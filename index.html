      <label class="field"><span>FC max</span><input type="number" inputmode="numeric" id="o-hr" value="${p.hrMax}"></label>
      <label class="field"><span>FTP vélo (W)</span><input type="number" inputmode="numeric" id="o-ftp" value="${S.profile ? p.ftp : ''}" placeholder="ex. 230"></label>
      <label class="field"><span>Allure seuil course</span><input type="text" id="o-run" value="${S.profile ? SP.fmtPace(p.runT) : ''}" placeholder="ex. 4:45 /km"></label>
      <label class="field"><span>CSS natation</span><input type="text" id="o-css" value="${S.profile ? SP.fmtPace(p.css) : ''}" placeholder="ex. 1:55 /100 m"></label>
      <label class="field"><span>Années de sport</span><input type="number" inputmode="numeric" id="o-y" value="${esc(p.years)}"></label></div>
      <p class="small muted">Tu ne connais pas une valeur ? Laisse vide : on l’estime, puis les tests de la bibliothèque (ramp test, test 30 min, test CSS) la mesureront. Repère : allure seuil ≈ ton allure sur 10 km + 5 s/km ; CSS ≈ ton allure sur 400 m soutenus.</p>
      <button class="btn primary block" id="o-ok">Enregistrer</button>`);
    $('#o-ok', sh).addEventListener('click', () => {
      const weight = +$('#o-w', sh).value || 75;
      const years = $('#o-y', sh).value;
      const ftp = +$('#o-ftp', sh).value || Math.round(weight * 2.6);
      const runT = SP.parsePace($('#o-run', sh).value) || 330;
      const css = SP.parsePace($('#o-css', sh).value) || 130;
      setProfile({ name: $('#o-name', sh).value.trim(), weight, ftp, runT, css, hrMax: +$('#o-hr', sh).value || 185, years, levels: { bike: W.suggestLevel(ftp, weight, years), run: runLevel(runT), swim: swimLevel(css) } });
      closeSheet(); render();
      toast('Profil enregistré');
    });
  }

  // ------------------------------------------------------------------ IA
  async function aiPlan() {
    let f; try { f = planFormValues(); } catch (e) { toast(e.message, true); return; }
    if (f.type === 'bike' && f.bikeDisc === 'vtt') { f.goal = f.vttGoal; f.discipline = 'vtt'; }
    if (f.type === 'run') { toast('L’IA est proposée pour les plans triathlon et vélo', true); return; }
    const ps = progressSheet('Claude prépare ton plan');
    try {
      let plan;
      if (f.type === 'bike') {
        const pr = PLAN.aiPlanPrompt(Object.assign({}, f), Object.assign({}, P(), { level: P().levels.bike }), historyContext());
        const text = await AI.call(pr.system, pr.prompt, 32000, n => ps.update(n, pr.nWeeks * 1300));
        plan = TRI.addStretches(normalizeBikePlan(PLAN.planFromAI(AI.extractJSON(text), f, Object.assign({}, P(), { level: P().levels.bike }), pr)), { mode: f.stretch || 'auto' });
        plan.discipline = f.bikeDisc === 'vtt' ? 'vtt' : 'route';
      } else {
        const pr = TRI.aiTriPrompt(f, P(), historyContext());
        const text = await AI.call(pr.system, pr.prompt, 48000, n => ps.update(n, pr.nWeeks * 2600));
        plan = TRI.triPlanFromAI(AI.extractJSON(text), f, P(), pr);
      }
      S.plan = plan; savePlan(); ps.close(); render(); toast('Plan créé');
    } catch (e) { ps.close(); toast(e.message, true); }
  }
  async function aiWorkout() {
    const sport = S.view === 'library' && ['bike', 'run', 'swim'].includes(S.libSport) ? S.libSport : 'run';
    const sh = openSheet(`<h2>Séance du jour par l’IA</h2><p class="muted small">Claude tient compte de ton profil et de ta fatigue sur les trois sports.</p>
      <div class="chips" id="aw-sport" style="margin:10px 0">${['swim', 'bike', 'run'].map(k => `<button class="chip ${k === sport ? 'on' : ''}" data-v="${k}"><span class="sw" style="background:${sportColor(k)}"></span>${sportName(k)}</button>`).join('')}</div>
      <label class="field"><span>Ce que tu veux travailler, ou comment tu te sens</span><textarea id="aw-req" style="min-height:70px;font-family:var(--ui)" placeholder="Ex. jambes lourdes après la sortie longue, envie de travailler le seuil"></textarea></label>
      <div class="chips" id="aw-min">${[30, 45, 60, 75, 90].map(m => `<button class="chip ${m === 60 ? 'on' : ''}" data-v="${m}">${m} min</button>`).join('')}</div>
      <button class="btn primary block" style="margin-top:14px" id="aw-go">${IC.spark} Créer la séance</button>`);
    let minutes = 60, sp = sport;
    $('#aw-min', sh).addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; minutes = +b.dataset.v; sh.querySelectorAll('#aw-min .chip').forEach(c => c.classList.toggle('on', c === b)); });
    $('#aw-sport', sh).addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; sp = b.dataset.v; sh.querySelectorAll('#aw-sport .chip').forEach(c => c.classList.toggle('on', c === b)); });
    $('#aw-go', sh).addEventListener('click', async () => {
      const req = $('#aw-req', sh).value.trim();
      closeSheet();
      const ps = progressSheet('Claude crée ta séance');
      try {
        const p = P();
        const pr = PLAN.aiWorkoutPrompt(Object.assign({}, p, { level: p.levels[sp] }), historyContext(), req, minutes);
        pr.prompt = pr.prompt.replace(/SYNTAXE DES SÉANCES[\s\S]*?puissances entre 40 et 200 %\./, TRI.TRI_SYNTAX) + `\nSport : ${sportName(sp)} (utilise la syntaxe ${sp === 'bike' ? 'VÉLO' : sp === 'run' ? 'COURSE' : 'NATATION'}). Seuils : allure seuil ${SP.fmtPace(p.runT)}/km, CSS ${SP.fmtPace(p.css)}/100 m, FTP ${p.ftp} W.`;
        const j = AI.extractJSON(await AI.call(pr.system, pr.prompt, 3000, n => ps.update(n, 900)));
        const tree = sp === 'bike' ? W.parseWorkout(j.workout) : SP.parseWorkout(j.workout, sp);
        const w = { id: 'ai-' + Date.now(), sport: sp, name: j.name || 'Séance IA', cat: sp === 'bike' ? PLAN.guessFocus(j.name + ' ' + j.description) : '', level: p.levels[sp], desc: j.description || '', tree, dsl: sp === 'bike' ? W.toDSL(tree) : SP.toDSL(tree, sp), source: 'ai' };
        ps.close(); S._tmpWorkout = w; openAnyWorkout(w);
      } catch (e) { ps.close(); toast(e.message, true); }
    });
  }

  // ------------------------------------------------------------------ actions
  const findPlanSession = id => S.plan ? TRI.findSession(S.plan, id) : null;
  // la puce active d'une liste défilante horizontale reste visible
  const showChip = () => { const c = document.querySelector('.chips .chip.on[data-act=libcat]'), row = c && c.parentElement; if (row && row.scrollWidth > row.clientWidth) row.scrollLeft = c.offsetLeft - row.offsetLeft - 12; };
  const ACT = {
    tab: el => { S.view = el.dataset.v; closeAllSheets(); render(); window.scrollTo(0, 0); },
    onboard: () => openOnboarding(),
    install: async () => { if (S.installPrompt) { S.installPrompt.prompt(); await S.installPrompt.userChoice; S.installPrompt = null; render(); } },
    connTrainer: () => connectTrainer(),
    connCad: () => connectCad(),
    connPm: () => connectPm(),
    connTm: () => connectTm(),
    freeTread: () => openFreeTread(),
    freeBike: () => openFreeBike(),
    libMin: el => { S.libMinutes = +el.dataset.v; render(); },
    ideaMin: el => { S.ideaMinutes = +el.dataset.v; render(); },
    connHr: () => connectHr(),
    ideaSport: el => { S.ideaSport = el.dataset.v; S.ideaSeed = Math.floor(Math.random() * 1e6); render(); },
    ideaAgain: () => { S.ideaSeed = Math.floor(Math.random() * 1e6); render(); },
    ideaOpen: () => { const w = S._homeIdea; if (!w) return; if (w.sport === 'bike') startWorkout(w, { tree: w.tree }); else openSportWorkout(w, { minutes: 0 }); },
    quick: el => {
      const v = el.dataset.v;
      if (v === 'kickr') { S.view = 'library'; S.libSport = 'bike'; S.libCat = 'all'; render(); window.scrollTo(0, 0); }
      else if (v === 'strength') { S.view = 'library'; S.libSport = 'strength'; render(); window.scrollTo(0, 0); }
      else if (v === 'log') openEntry('run');
      else if (v === 'log-strength') openEntry('strength');
      else if (v === 'stretch') { S.view = 'library'; S.libSport = 'stretch'; render(); window.scrollTo(0, 0); }
      else if (v === 'log-stretch') openEntry('stretch', null, { minutes: 15 });
      else if (v === 'weight') openWeight();
      else if (v === 'import') openImport();
    },
    jFilter: el => { S.jFilter = el.dataset.v; render(); },
    openAct: el => openActivity(el.dataset.id),
    stravaSync: () => syncStrava(),
    syncAll: () => syncAll(),
    libSport: el => { S.libSport = el.dataset.v; S.libCat = 'all'; render(); },
    libcat: el => { S.libCat = el.dataset.v; render(); if (el.classList.contains('tm-teaser')) { window.scrollTo(0, 0); showChip(); } },
    tmJump: el => { const t = document.getElementById('tm-' + el.dataset.v); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    tmProgs: () => { closeSheet(); S.view = 'library'; S.libSport = 'run'; S.libCat = 'tapis'; render(); window.scrollTo(0, 0); showChip(); },
    openW: el => openAnyWorkout(findWorkout(el.dataset.id)),
    builder: () => S.libSport === 'bike' ? openBuilder(null) : openSportBuilder(S.libSport, null),
    surpriseSheet: () => S.libSport === 'bike' ? openSurprise() : openSportSurprise(S.libSport),
    aiWorkout: () => aiWorkout(),
    openTpl: el => openCircuit(el.dataset.id),
    openCircuit: el => openCircuit(el.dataset.id),
    newCircuit: () => newCircuit(),
    newRoutine: () => newCircuit('stretch'),
    stTab: el => { S.stTab = el.dataset.v; render(); },
    stFilter: el => { S.stFilter = el.dataset.v; render(); },
    strTab: el => { S.strTab = el.dataset.v; render(); },
    exoFilter: el => { S.exoFilter = el.dataset.v; render(); },
    openExo: el => openExercise(el.dataset.id),
    rampTest: () => openWorkout(Object.assign({ sport: 'bike' }, W.LIBRARY.find(x => x.id === 'ramp'))),
    planStart: el => { const f = findPlanSession(el.dataset.id); if (!f) return; const w = planSessionWorkout(f.s); startWorkout(w, { tree: w.tree, planSessionId: f.s.id }); },
    planSess: el => openPlanSession(el.dataset.id),
    planStretch: el => { const f = findPlanSession(el.dataset.id); if (f) openCircuit(f.s.routine, { planSessionId: f.s.id, date: f.s.date }); },
    planWeekJump: el => { S.planMode = 'week'; S.planOpen = +el.dataset.v; render(); const d = document.getElementById('wk-' + el.dataset.v); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    planStretchMode: el => { TRI.addStretches(S.plan, { mode: el.dataset.v, from: day0(Date.now()) }); savePlan(); render(); toast(el.dataset.v === 'off' ? 'Étirements retirés du plan à partir d’aujourd’hui' : 'Étirements placés à partir d’aujourd’hui'); },
    planCheck: el => { const c = S.plan.checklist || (S.plan.checklist = {}); c[el.dataset.v] = !c[el.dataset.v]; savePlan(); render(); },
    planLighten: async el => {
      const v = await ask('Alléger cette semaine ?', 'Fatigue, semaine chargée, petit bobo : les séances qui restent cette semaine sont raccourcies de 30 % et les séances dures deviennent de l’endurance. Les tests et le renfo ne changent pas.', [{ label: 'Alléger la semaine', value: 1, cls: 'primary' }, { label: 'Annuler', value: 0 }]);
      if (!v) return;
      const n = TRI.lightenWeek(S.plan, +el.dataset.v, P(), day0(Date.now()));
      savePlan(); render(); toast(n ? n + ' séance' + (n > 1 ? 's' : '') + ' allégée' + (n > 1 ? 's' : '') : 'Rien à alléger');
    },
    planStrength: el => { const f = findPlanSession(el.dataset.id); if (f) openTemplate(f.s.template, { planSessionId: f.s.id, date: f.s.date }); },
    planLog: el => { const f = findPlanSession(el.dataset.id); if (f) openEntry(f.s.sport === 'event' ? 'other' : f.s.sport, null, { name: f.s.name, minutes: f.s.minutes, planSessionId: f.s.id, date: f.s.date }); },
    planAdd: el => openAddSession(+el.dataset.v + 864e5 * Math.max(0, Math.min(6, Math.floor((Date.now() - +el.dataset.v) / 864e5)))),
    planDay: el => openPlanDay(+el.dataset.v),
    planMode: el => { S.planMode = el.dataset.v; render(); },
    planMonthNav: el => { const d = new Date(S.planMonth.y, S.planMonth.m + +el.dataset.v, 1); S.planMonth = { y: d.getFullYear(), m: d.getMonth() }; render(); },
    monthNav: el => { const d = new Date(S.month.y, S.month.m + +el.dataset.v, 1); S.month = { y: d.getFullYear(), m: d.getMonth() }; render(); },
    planGarmin: () => planToGarmin(),
    planIcs: () => planIcs(),
    planDelete: async () => { const v = await ask('Supprimer le plan ?', 'Tes activités restent dans le journal.', [{ label: 'Supprimer le plan', value: 1, cls: 'danger' }, { label: 'Annuler', value: 0 }]); if (v) { S.plan = null; LS.del('plan'); render(); } },
    planGen: () => { try { S.plan = generatePlanFromForm(); savePlan(); render(); window.scrollTo(0, 0); toast('Plan créé : ' + S.plan.weeks.length + (S.plan.weeks.length > 1 ? ' semaines' : ' semaine')); } catch (e) { toast(e.message, true); } },
    planAI: () => aiPlan(),
    pfDay: el => { const d = +el.dataset.v; const f = S._triForm; f.days = f.days.includes(d) ? f.days.filter(x => x !== d) : f.days.concat(d).sort(); el.classList.toggle('on'); },
    pfType: el => { S._triForm.type = el.dataset.v; render(); },
    pfDisc: el => { S._triForm[el.dataset.k] = el.dataset.v; render(); },
    cssCalc: () => {
      const a = SP.parsePace($('#css400').value), b = SP.parsePace($('#css200').value);
      if (!a || !b || a <= b) { toast('Indique les temps du 400 m et du 200 m (m:ss)', true); return; }
      const css = Math.round(SP.cssFromTest(a, b));
      setProfile({ css }); render(); toast('CSS : ' + SP.fmtPace(css) + ' /100 m');
    },
    runTarget: el => { S.settings.runTarget = el.dataset.v; saveSettings(); render(); },
    gcCopy: async () => {
      const code = Garmin.relayCode(location.origin);
      try { await navigator.clipboard.writeText(code); toast('Code du relais copié : colle-le dans ton Worker Cloudflare'); }
      catch (e) {
        const sh = openSheet(`<h2>Code du relais</h2><p class="small muted">Sélectionne tout le texte, copie-le, puis colle-le dans « Edit code » de ton Worker Cloudflare.</p><textarea class="codebox" readonly rows="14">${esc(code)}</textarea>`);
        const ta = $('textarea', sh); ta.focus(); ta.select();
      }
    },
    gcTest: async () => {
      try {
        await Garmin.token(true);
        const n = (await Garmin.listActivities(isoDay(Date.now() - 7 * 864e5), isoDay(Date.now() + 864e5))).length;
        toast('Garmin connecté : ' + n + ' activité' + (n > 1 ? 's' : '') + ' ces 7 derniers jours');
      } catch (e) { toast(e.message, true); }
    },
    icuTest: async () => { try { const n = await Intervals.test(); toast('intervals.icu connecté : ' + n); } catch (e) { toast(e.message, true); } },
    prodAdd: () => { S.products.push({ id: 'p' + Date.now(), name: 'Nouveau produit', unit: 'unité', kcal: 100, carbs: 25, fluid: 0, sodium: 0, caf: 0 }); saveProducts(); render(); },
    stravaOn: () => { try { Strava.authorize(); } catch (e) { toast(e.message, true); } },
    stravaOff: () => { const c = Strava.cfg(); delete c.token; delete c.athlete; delete c.scope; Strava.save(c); render(); },
    aiTest: async () => { try { const t = await AI.call('Réponds en un mot.', 'Dis « OK ».', 20); toast('Clé valide : ' + t.trim()); } catch (e) { toast(e.message, true); } },
    backup: async () => {
      const details = [];
      for (const a of S.acts) if (a.hasDetail) { const d = await Store.getSession(a.id).catch(() => null); if (d) details.push(d); }
      const data = { app: 'd6tri', version: VERSION, exported: Date.now(), profile: S.profile, settings: S.settings, plan: S.plan, custom: S.custom, favs: S.favs, acts: S.acts, weights: S.weights, products: S.products, details };
      download(new TextEncoder().encode(JSON.stringify(data)), 'd6tri-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
    },
    restore: () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
      inp.onchange = async () => {
        try {
          const d = JSON.parse(await inp.files[0].text());
          if (d.app !== 'd6tri') throw new Error('Ce fichier n’est pas une sauvegarde ' + APP + '.');
          ['profile', 'plan', 'custom', 'favs', 'acts', 'weights', 'products'].forEach(k => { if (d[k]) { S[k] = d[k]; LS.set(k, d[k]); } });
          if (d.settings) { S.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings); saveSettings(); }
          for (const x of d.details || []) await Store.putSession(x);
          render(); toast('Sauvegarde importée : ' + (d.acts || []).length + ' activités');
        } catch (e) { toast(e.message, true); }
      };
      inp.click();
    },
    wipe: async () => {
      const v = await ask('Tout effacer ?', 'Profil, plan, journal, poids et réglages seront supprimés de ce téléphone.', [{ label: 'Tout effacer', value: 1, cls: 'danger' }, { label: 'Annuler', value: 0 }]);
      if (!v) return;
      for (const a of S.acts) if (a.hasDetail) await Store.deleteSession(a.id).catch(() => {});
      ['profile', 'settings', 'plan', 'custom', 'favs', 'acts', 'weights', 'products', 'strava', 'ai', 'icu', 'garmin', 'syncIgnore', 'lastAutoSync', 'demo'].forEach(k => LS.del(k));
      location.reload();
    }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.closest('#player') || (el.closest('.sheet') && !['tab', 'pfDay'].includes(el.dataset.act))) return;
    if (el.tagName === 'INPUT') return;
    const fn = ACT[el.dataset.act]; if (fn) { e.stopPropagation(); fn(el, e); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.act === 'demo') { setDemo(t.checked); return; }
    if (t.dataset.pr !== undefined) {
      const k = t.dataset.pr; let v = t.value;
      if (['ftp', 'weight', 'hrMax', 'hrRest', 'hours', 'pool', 'lthr'].includes(k)) v = v === '' ? '' : +v;
      setProfile({ [k]: v });
      if (['ftp', 'weight', 'lthr', 'hrMax'].includes(k)) render();
      return;
    }
    if (t.dataset.lv !== undefined) { setProfile({ levels: Object.assign({}, P().levels, { [t.dataset.lv]: +t.value }) }); return; }
    if (t.dataset.pace !== undefined) { const v = SP.parsePace(t.value); if (!v) { toast('Format attendu : m:ss', true); return; } setProfile({ [t.dataset.pace]: v }); render(); return; }
    if (t.dataset.st !== undefined) { const k = t.dataset.st; S.settings[k] = t.type === 'checkbox' ? t.checked : (k === 'step' ? +t.value : t.value); saveSettings(); return; }
    if (t.dataset.sv !== undefined) { const c = Strava.cfg(); c[t.dataset.sv] = t.value.trim(); Strava.save(c); return; }
    if (t.dataset.gc !== undefined) { const c = Garmin.cfg(); c[t.dataset.gc] = t.value.trim(); if (t.dataset.gc === 'apiKey' || t.dataset.gc === 'relay') { delete c.token; delete c.tokenExp; } Garmin.save(c); render(); return; }
    if (t.dataset.ic !== undefined) { const c = Intervals.cfg(); c[t.dataset.ic] = t.value.trim(); Intervals.save(c); if (t.dataset.ic === 'apiKey') render(); return; }
    if (t.dataset.ai !== undefined) { const c = AI.cfg(); c[t.dataset.ai] = t.value.trim(); LS.set('ai', c); if (t.dataset.ai === 'apiKey') render(); return; }
    if (t.dataset.prod !== undefined) { const pr = S.products[+t.dataset.i]; if (!pr) return; const k = t.dataset.prod; pr[k] = k === 'name' ? t.value : +t.value || 0; saveProducts(); return; }
    if (t.dataset.pf !== undefined) {
      const k = t.dataset.pf; const f = S._triForm;
      f[k] = t.type === 'checkbox' ? t.checked : (['hours', 'maxIndoor', 'weeks', 'swimPerWeek', 'longRideDay', 'longRunDay'].includes(k) ? +t.value : t.value);
      if (k === 'eventDate' || k === 'stretch' || k === 'distance') render();
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.pf === 'hours') { S._triForm.hours = +t.value; const l = $('#pf-h'); if (l) l.textContent = fx(+t.value, +t.value % 1 ? 1 : 0) + ' h'; }
  });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installPrompt = e; if (S.view === 'home') render(); });

  // ------------------------------------------------------------------ démarrage
  async function boot() {
    bindDevices();
    if (S.demo) { sim.trainer.connect(); sim.hr.connect(); }
    render();
    try { const who = await Strava.handleRedirect(); if (who) { S.view = 'profile'; render(); toast('Strava connecté : ' + who); if (Strava.hasRead()) syncStrava(); } } catch (e) { toast(e.message, true); }
    try {
      const snap = await Store.kvGet('inprogress');
      if (snap && snap.samples && snap.samples.length > 30) {
        const v = await ask('Séance interrompue retrouvée', `« ${esc(snap.workout.name)} », ${W.fmtDur(snap.samples.length, true)} enregistrées.`, [
          { label: 'Reprendre la séance', value: 'resume', cls: 'primary' }, { label: 'L’enregistrer telle quelle', value: 'save' }, { label: 'La supprimer', value: 'drop', cls: 'danger' }]);
        if (v === 'resume') startWorkout(Object.assign({}, snap.workout, { tree: snap.tree }), { tree: snap.tree, restore: snap, planSessionId: snap.planSessionId });
        else if (v === 'save') { const sess = buildSession(snap, false); const a = actFromSession(sess); await saveActivity(a, sess); await Store.kvDel('inprogress'); render(); openActivity(a.id, { fresh: true }); }
        else if (v === 'drop') await Store.kvDel('inprogress');
      }
    } catch (e) { console.warn(e); }
    if (!S.profile && !sheetStack.length) openOnboarding();
    autoSync();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoSync(); });
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  boot();
  window.D6 = { S, ACT, dev: () => dev, startWorkout, render, openActivity, saveActivity, STR, openCircuit, syncAll };
})();

</script>
</body>
