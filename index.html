      <details class="small muted" style="margin:8px 0 14px"><summary>Aide sur la syntaxe</summary><p style="margin-top:8px">Étape : <code>durée@puissance</code> en % de FTP, ex. <code>8m@95</code>, <code>30s@150</code>, <code>1m30s@110</code>.<br>Rampe : <code>10m@50-75</code>. Watts fixes : <code>5m@220w</code>.<br>Options : <code>c90</code> (cadence), <code>free</code> (mode libre sans ERG), <code>"libellé"</code>.<br>Répétition : <code>5x(3m@115, 3m@50)</code>, imbrication possible.</p></details>
      <button class="btn primary block" id="b-save">Enregistrer</button>`);
    const prev = () => {
      try {
        const tree = W.parseWorkout($('#b-dsl', sh).value);
        const st = W.workoutStats(tree, p.ftp);
        $('#b-prev', sh).innerHTML = profileSVG(tree, p.ftp, { h: 70, ftpLine: true }) + `<p class="small muted" style="margin-top:6px">${W.fmtDur(st.duration, true)} · ${r0(st.tss)} TSS · IF ${fx(st.IF, 2)}</p>`;
        return tree;
      } catch (e) { $('#b-prev', sh).innerHTML = `<div class="notice err small">${esc(e.message)}</div>`; return null; }
    };
    prev();
    $('#b-dsl', sh).addEventListener('input', prev);
    $('#b-save', sh).addEventListener('click', () => {
      const tree = prev(); if (!tree) return;
      const name = $('#b-name', sh).value.trim() || 'Ma séance';
      const c = { sport: 'bike', id: isOwn ? src.id : 'custom-' + Date.now(), name, cat: $('#b-cat', sh).value, level: +$('#b-lvl', sh).value, desc: isOwn ? src.desc : (src ? 'Variante de « ' + src.name + ' ».' : 'Séance personnalisée.'), dsl: W.toDSL(tree), source: 'custom' };
      S.custom = S.custom.filter(x => x.id !== c.id).concat(c); LS.set('custom', S.custom);
      closeSheet(); S.view = 'library'; S.libSport = 'bike'; S.libCat = 'mine'; render(); toast('Séance enregistrée');
    });
  }


  // ------------------------------------------------------------------ connexion des capteurs
  async function connectTrainer() {
    const t = dev.trainer;
    if (t.state !== 'disconnected') { t.disconnect(); updateDevices(); return; }
    try {
      const name = await t.connect();
      t.weight = (P().weight || 75) + 9;
      toast('Connecté à ' + name + (S.settings.trainerHint && !name.includes(S.settings.trainerHint) && !S.demo ? ' (attention : ce n’est pas « ' + S.settings.trainerHint + ' »)' : ''));
    } catch (e) {
      if (e.name === 'NotFoundError') return; // sélection annulée
      toast(e.message, true);
    }
    updateDevices();
  }
  async function connectHr() {
    const h = dev.hr;
    if (h.state !== 'disconnected') { h.disconnect(); updateDevices(); return; }
    try { const n = await h.connect(); toast('Cardio connecté : ' + n); } catch (e) { if (e.name !== 'NotFoundError') toast(e.message, true); }
    updateDevices();
  }

  // ------------------------------------------------------------------ audio, voix, écran
  let audioCtx = null;
  function beep(freq, dur) {
    if (!S.settings.beeps) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
    } catch (e) { /* */ }
  }
  function say(text) {
    if (!S.settings.voice || !('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) { /* */ }
  }
  const vibrate = p => { if (S.settings.vibrate && navigator.vibrate) navigator.vibrate(p); };
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
      else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { /* */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.runner && S.runner.state !== 'done') keepAwake(true); });


  // ------------------------------------------------------------------ lecteur de séance
  async function startWorkout(w, opts) {
    opts = opts || {};
    if (!S.profile) { openOnboarding(); return; }
    if (dev.trainer.state !== 'connected') {
      const choice = await ask('Home trainer non connecté', 'Connecte ton KICKR pour que l’appli règle la résistance.', [
        { label: 'Connecter mon KICKR', value: 'conn', cls: 'primary' }, { label: 'Essayer en mode démo', value: 'demo' }, { label: 'Annuler', value: null }]);
      if (!choice) return;
      if (choice === 'demo') setDemo(true);
      else { await connectTrainer(); if (dev.trainer.state !== 'connected') return; }
    }
    const runner = new RUN.Runner({ workout: { id: w.id, name: w.name, cat: w.cat, level: w.level, test: w.test, source: w.source }, tree: opts.tree || w.tree, ftp: P().ftp, trainer: dev.trainer, hr: dev.hr, cad: dev.cad || null, pm: dev.pm && dev.pm.state === 'connected' ? dev.pm : null, powerSrc: S.settings.powerSrc || 'pedals', match: S.settings.powerMatch !== false, autoPause: S.settings.autoPause, restore: opts.restore });
    // forme du jour : intensité choisie dans la fiche, sinon celle réglée aujourd'hui (jamais pour un test)
    const fi = opts.intensity !== undefined ? opts.intensity : (opts.restore || w.cat === 'test' || w.test ? 1 : formeGet('bike'));
    if (fi && fi !== 1) runner.intensity = fi;
    runner.showDual = !!S.settings.hasPedals;
    runner.planSessionId = opts.planSessionId || (opts.restore && opts.restore.planSessionId) || null;
    S.runner = runner;
    openPlayer(runner);
  }

  function openPlayer(run) {
    const el = document.createElement('div');
    el.id = 'player';
    const isTest = run.workout.test;
    el.innerHTML = `
      <div class="p-head"><button class="iconbtn" data-p="close" aria-label="Terminer">${IC.close}</button><div class="title ellipsis">${esc(run.workout.name)}</div><span class="p-elapsed" id="p-el">0:00</span></div>
      <div class="p-main">
        <div class="p-interval"><span class="zone-edge" id="p-zedge"></span><div style="padding-left:6px;min-width:0"><div class="rep" id="p-rep"></div><div class="lbl ellipsis" id="p-lbl">—</div><div class="next ellipsis" id="p-next"></div></div><div class="remain" id="p-rem">0:00</div></div>
        <div class="p-power"><div class="p-srctag" id="p-srctag" ${run.pm ? '' : 'hidden'}><i></i>puissance <span id="p-srcname"></span></div><div class="big" id="p-pw">0<small>W</small></div><div class="target" id="p-tg"></div>${sourcesHTML()}</div>
        <div class="p-metrics"><div class="m" id="p-m-cad"><b id="p-cad">0</b><span id="p-cad-l">rpm</span></div><div class="m"><b id="p-hr">–</b><span>bpm</span></div><div class="m"><b id="p-lapavg">0</b><span>moy. interv.</span></div><div class="m"><b id="p-tss">0</b><span>TSS</span></div></div>
        <div class="p-chart"><canvas id="p-chart"></canvas></div>
      </div>
      <div class="p-controls">
        <div class="adj"><button data-p="minus" aria-label="Moins">−</button><div class="val" id="p-adj"><b>100 %</b>intensité</div><button data-p="plus" aria-label="Plus">+</button></div>
        <button class="btn" data-p="pause" id="p-pause">${IC.pause}<span>Pause</span></button>
        <button class="btn" data-p="${isTest ? 'endtest' : 'skip'}">${isTest ? 'Fin du test' : IC.skip + '<span>Passer</span>'}</button>
        <button class="btn" data-p="more" aria-label="Plus d’options">${IC.more}</button>
      </div>
      <div class="startcover" id="p-cover"><div class="stack"><h2>${esc(run.workout.name)}</h2><p class="muted">${W.fmtDur(run.total, true)}${run.state === 'paused' ? ' · séance retrouvée, reprise à ' + W.fmtDur(run.elapsed) : ''}</p><button class="btn primary" data-p="go">${IC.play} ${run.state === 'paused' ? 'Reprendre' : 'C’est parti'}</button><button class="btn ghost" data-p="cancel">Annuler</button></div></div>`;
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    Hist.push();
    const pw = []; // puissance lissée 3 s
    const refPower = () => { const m = run.pmData(); return run.refSource === 'pedals' && m ? m.power : (dev.trainer.data.power || 0); };
    const pwT = setInterval(() => { pw.push({ t: Date.now(), p: refPower() }); while (pw.length && Date.now() - pw[0].t > 3000) pw.shift(); }, 250);
    const offData = () => clearInterval(pwT);
    const p3 = () => pw.length ? pw.reduce((a, x) => a + x.p, 0) / pw.length : refPower();
    let lastChart = 0, alertT = null;
    const set = (id, v) => { const e = document.getElementById(id); if (e && e.innerHTML !== v) e.innerHTML = v; };

    function update() {
      const s = run.step; if (!s) return;
      const d = dev.trainer.data;
      const cad = run._cad(d);
      const free = run.isFree;
      const tgt = run.targetWatts();
      const zone = W.zoneOf(tgt / run.ftp);
      $('#p-zedge').style.background = zone.color;
      set('p-rem', W.fmtDur(Math.max(0, Math.ceil(run.stepRemaining))));
      set('p-lbl', esc(s.l || zone.name) + (s.c && !String(s.l || '').includes(String(s.c)) ? ` <span class="muted">· ${s.c} rpm</span>` : ''));
      set('p-rep', s.rep ? `Répétition ${s.rep.i}/${s.rep.n}` : '');
      const nx = run.nextStep;
      set('p-next', nx ? `Ensuite : ${W.fmtDur(nx.d, true)} à ${r0(W.stepPowerAt(nx, 0) * run.ftp * run.intensity)} W${nx.l ? ' (' + esc(nx.l) + ')' : ''}` : 'Dernière étape');
      const pp = r0(p3());
      set('p-pw', `${pp}<small>W</small>`);
      if (free) set('p-tg', `Mode libre${tgt ? ` · vise <b>${tgt}</b> W` : ''} · pente ${run.grade.toFixed(1)} %`);
      else {
        const diff = pp - tgt, col = Math.abs(diff) <= Math.max(8, tgt * 0.05) ? 'var(--ok)' : diff > 0 ? 'var(--z5)' : 'var(--z2)';
        set('p-tg', `Cible <b>${tgt}</b> W<span class="delta" style="background:${col};color:#0D1B2E">${diff > 0 ? '+' : ''}${diff}</span>${s.c ? ` · <b>${s.c}</b> rpm` : ''}`);
      }
      set('p-cad', String(r0(cad)));
      set('p-cad-l', s.c ? `rpm · cible ${s.c}` : 'rpm');
      const mc = $('#p-m-cad'), cd = s.c && cad > 0 ? Math.abs(cad - s.c) : null;
      mc.classList.toggle('ok', cd !== null && cd <= 5);
      mc.classList.toggle('warn', (cd !== null && cd > 8) || (!free && cad > 0 && cad < 60 && tgt > run.ftp * 0.8 && !(s.c && s.c < 65)));
      mc.classList.toggle('tgt', !!s.c);
      const hrv = run._currentHr();
      set('p-hr', hrv ? String(hrv) : '–');
      const lap = run.laps[run.laps.length - 1];
      if (lap) { const seg = run.samples.slice(lap.from); set('p-lapavg', String(seg.length ? r0(seg.reduce((a, x) => a + x.p, 0) / seg.length) : 0)); }
      if (run.samples.length % 5 === 0 || !run._tssCache) {
        const sum = run.samples.length > 30 ? M.summarize(run.samples, run.ftp) : { tss: 0 };
        run._tssCache = r0(sum.tss);
      }
      set('p-tss', String(run._tssCache || 0));
      set('p-el', `${W.fmtDur(run.displayElapsed)} / ${W.fmtDur(run.total)}`);
      set('p-adj', free ? `<b>${run.grade.toFixed(1)} %</b>pente` : `<b>${r0(run.intensity * 100)} %</b>intensité`);
      const pb = $('#p-pause');
      const pausedHtml = `${IC.play}<span>Reprendre</span>`, runHtml = `${IC.pause}<span>Pause</span>`;
      const want = run.state === 'paused' ? pausedHtml : runHtml;
      if (pb.innerHTML !== want) pb.innerHTML = want;
      updateSources(run, set);
      if (Date.now() - lastChart > 1000) { lastChart = Date.now(); drawPlayerChart(run); }
    }

    run.on('tick', update);
    const simCad = () => { if (S.demo && dev.trainer === sim.trainer) dev.trainer.cadTarget = (run.step && run.step.c) || 0; };
    run.on('step', ({ step, idx }) => {
      simCad();
      if (idx === 0) return;
      const w = r0(W.stepPowerAt(step, 0) * run.ftp * run.intensity);
      vibrate([120, 60, 120]);
      beep(1320, 0.25);
      say(`${step.l ? step.l + '. ' : ''}${W.fmtDur(step.d, true).replace("'", ' minutes ').replace('"', ' secondes').replace('h', ' heure ')}${run.isFree ? ', mode libre' : ', ' + w + ' watts'}${step.c ? ', cadence ' + step.c : ''}`);
    });
    run.on('beep', n => beep(880, 0.12));
    run.on('lowcad', () => {
      vibrate([300]);
      let a = $('#p-alert'); if (!a) { a = document.createElement('div'); a.id = 'p-alert'; a.className = 'p-alert'; el.appendChild(a); }
      a.textContent = 'Cadence trop basse : relance à 80 tr/min ou plus pour ne pas bloquer en ERG';
      clearTimeout(alertT); alertT = setTimeout(() => a.remove(), 5000);
    });
    run.on('cadoff', ({ cad, target }) => {
      vibrate([80, 60, 80]);
      let a = $('#p-alert'); if (!a) { a = document.createElement('div'); a.id = 'p-alert'; a.className = 'p-alert'; el.appendChild(a); }
      const up = cad < target;
      a.textContent = `Cadence ${cad} rpm : ${up ? 'accélère' : 'ralentis'} vers ${target} rpm`;
      say(`${up ? 'Plus vite' : 'Moins vite'}, cadence ${target}`);
      clearTimeout(alertT); alertT = setTimeout(() => a.remove(), 5000);
    });
    const banner = (t, ms) => { let a = $('#p-alert'); if (!a) { a = document.createElement('div'); a.id = 'p-alert'; a.className = 'p-alert'; el.appendChild(a); } a.textContent = t; clearTimeout(alertT); alertT = setTimeout(() => a.remove(), ms || 6000); };
    run.on('pmlost', () => { vibrate([200, 80, 200]); banner('Pédales perdues : le KICKR prend le relais pour la puissance'); say('Pédales perdues'); });
    run.on('pmback', () => { toast('Pédales retrouvées'); });
    run.on('pmhalf', () => banner('Les pédales envoient environ la moitié de la puissance. Dans l’app Favero Assioma, règle le Bluetooth sur un seul canal (pas « Dual channel L/R »).', 12000));
    run.on('state', st => {
      if (st === 'paused' && run._autoPaused) toast('Pause automatique, reprends le pédalage pour continuer');
      update();
    });
    run.on('done', () => finishSession(run, cleanup));
    const saver = setInterval(() => { if (run.state === 'running' || run.state === 'paused') Store.kvSet('inprogress', Object.assign(run.snapshot(), { planSessionId: run.planSessionId })).catch(() => {}); }, 15000);
    function cleanup() { clearInterval(saver); offData(); keepAwake(false); el.remove(); document.body.style.overflow = ''; S.runner = null; Hist.pop(1); }

    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      const k = b.dataset.p;
      if (k === 'go') {
        $('#p-cover').remove(); keepAwake(true);
        beep(660, 0.1); // déverrouille l'audio
        if (run.state === 'ready') run.start(); else run.resume();
        simCad();
        say('C’est parti. ' + (run.step.l || '') );
        update();
      } else if (k === 'cancel') { run.destroy(); cleanup(); if (run.o.restore) Store.kvDel('inprogress'); }
      else if (k === 'pause') { run.state === 'paused' ? run.resume() : run.pause(false); }
      else if (k === 'skip') run.skip();
      else if (k === 'plus' || k === 'minus') {
        const sgn = k === 'plus' ? 1 : -1;
        if (run.isFree) run.setGrade(run.grade + sgn * 0.5); else run.setIntensity(run.intensity + sgn * S.settings.step);
        update();
      } else if (k === 'endtest') {
        const v = await ask('Terminer le test ?', 'Ta FTP sera calculée sur ce que tu as déjà réalisé.', [{ label: 'Oui, j’ai tout donné', value: 1, cls: 'primary' }, { label: 'Continuer', value: 0 }]);
        if (v) run.finish(true);
      } else if (k === 'more') {
        const v = await ask('Options', '', [
          { label: run.ergOn ? 'Passer en mode libre (sans ERG)' : 'Revenir en mode ERG', value: 'erg' },
          { label: 'Revenir à l’étape précédente', value: 'back' },
          { label: 'Prolonger l’étape d’1 minute', value: 'ext' },
          { label: 'Terminer et enregistrer', value: 'end', cls: 'primary' },
          { label: 'Fermer', value: null }]);
        if (v === 'erg') run.toggleErg(); else if (v === 'back') run.back(); else if (v === 'ext') run.extend(60); else if (v === 'end') run.finish(false);
        update();
      } else if (k === 'close') {
        if (run.state === 'ready') { run.destroy(); cleanup(); return; }
        const v = await ask('Arrêter la séance ?', '', [{ label: 'Terminer et enregistrer', value: 'save', cls: 'primary' }, { label: 'Abandonner sans enregistrer', value: 'drop', cls: 'danger' }, { label: 'Continuer', value: null }]);
        if (v === 'save') run.finish(false);
        else if (v === 'drop') { run.destroy(); if (dev.trainer.state === 'connected') dev.trainer.setSim(0); Store.kvDel('inprogress'); cleanup(); toast('Séance abandonnée'); }
      }
    });
    window.addEventListener('resize', () => drawPlayerChart(run), { passive: true });
    update();
    drawPlayerChart(run);
  }

  function drawPlayerChart(run) {
    const cv = document.getElementById('p-chart'); if (!cv) return;
    const { ctx, w, h } = setupCanvas(cv, cv.parentElement.clientHeight);
    ctx.clearRect(0, 0, w, h);
    const total = run.total;
    const top = Math.max(1.3, ...run.flat.map(s => Math.max(s.p, s.p2 || 0))) * 1.08 * run.ftp;
    const X = t => t / total * w, Y = v => h - Math.min(h, v / top * h);
    const el = run.displayElapsed;
    run.flat.forEach(s => {
      const col = W.zoneOf(s.p2 !== undefined ? (s.p + s.p2) / 2 : s.p).color;
      const x0 = X(s.start), x1 = X(s.start + s.d);
      ctx.globalAlpha = s.start + s.d <= el ? 0.9 : s.start > el ? 0.38 : 0.7;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x0, h); ctx.lineTo(x0, Y(s.p * run.ftp * run.intensity)); ctx.lineTo(x1, Y((s.p2 !== undefined ? s.p2 : s.p) * run.ftp * run.intensity)); ctx.lineTo(x1, h); ctx.closePath(); ctx.fill();
    });
    ctx.globalAlpha = 1;
    // puissance réelle (moyenne 5 s) — l'axe suit le temps de séance (échantillons hors pause)
    const smp = run.samples;
    if (smp.length > 2) {
      ctx.beginPath(); ctx.strokeStyle = '#EEF3FA'; ctx.lineWidth = 1.5;
      const step = Math.max(1, Math.floor(smp.length / w));
      let acc = 0, n = 0;
      for (let i = 0; i < smp.length; i++) {
        acc += smp[i].p; n++;
        if (i % step === 0) {
          const v = acc / n; acc = 0; n = 0;
          const x = X(Math.min(total, i * (el / smp.length)));
          i === 0 ? ctx.moveTo(x, Y(v)) : ctx.lineTo(x, Y(v));
        }
      }
      ctx.stroke();
      // cadence (échelle 0–140 rpm, en pointillés)
      if (smp.some(s => s.c)) {
        ctx.beginPath(); ctx.strokeStyle = 'rgba(77,208,200,.8)'; ctx.lineWidth = 1; ctx.setLineDash([3, 2]);
        let st0 = false;
        for (let i = 0; i < smp.length; i += step) {
          const x = X(Math.min(total, i * (el / smp.length))), y = h - Math.min(140, smp[i].c || 0) / 140 * h * 0.95;
          if (!st0) { ctx.moveTo(x, y); st0 = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke(); ctx.setLineDash([]);
      }
      const hrs = smp.map(s => s.hr).filter(Boolean);
      if (hrs.length > 2) {
        const hmax = P().hrMax || 190;
        ctx.beginPath(); ctx.strokeStyle = 'rgba(255,95,95,.85)'; ctx.lineWidth = 1.2;
        let started = false;
        for (let i = 0; i < smp.length; i += step) {
          if (!smp[i].hr) continue;
          const x = X(Math.min(total, i * (el / smp.length))), y = h - smp[i].hr / hmax * h * 0.95;
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    const xc = X(el);
    ctx.fillStyle = '#FFCB2F'; ctx.fillRect(xc - 1, 0, 2, h);
  }


  // ------------------------------------------------------------------ fin de séance
  function buildSession(snap, completed) {
    const samples = snap.samples;
    const summary = M.summarize(samples, snap.ftp, { elapsed: samples.length ? Math.round((samples[samples.length - 1].t - samples[0].t) / 1000) + 1 : 0 });
    const sess = {
      id: 's' + samples[0].t, startTime: samples[0].t, name: snap.workout.name, workoutId: snap.workout.id, cat: snap.workout.cat,
      dsl: W.toDSL(snap.tree), ftp: snap.ftp, samples, laps: snap.laps.filter(l => l.to === null ? true : l.to > l.from).map(l => Object.assign({}, l, { to: l.to === null ? samples.length : l.to })),
      pauses: (snap.pauses || []).filter(p => p.to), summary, completed: !!completed, planSessionId: snap.planSessionId || null, intensity: snap.intensity,
      powerRef: summary.sources && summary.sources.cover > 0.5 && snap.powerSrc === 'pedals' ? 'pedals' : 'trainer'
    };
    if (snap.workout.test === 'ramp') {
      const best1 = M.bestAverage(samples.map(s => s.p), 60);
      sess.test = { kind: 'ramp', best1: r0(best1), ftp: r0(best1 * 0.75) };
    } else if (snap.workout.test === 'ftp20') {
      const b20 = M.bestAverage(samples.map(s => s.p), 1200);
      if (b20) sess.test = { kind: 'ftp20', best20: r0(b20), ftp: r0(b20 * 0.95) };
    }
    return sess;
  }


  function drawSessionChart(cv, sess) {
    if (!cv) return;
    const { ctx, w, h } = setupCanvas(cv, 140);
    const smp = sess.samples; if (!smp.length) return;
    const mxP = Math.max(sess.ftp * 1.3, ...smp.map(s => Math.max(s.p, s.tg || 0))) * 1.05;
    const X = i => i / (smp.length - 1) * w, Y = v => h - v / mxP * h;
    const step = Math.max(1, Math.floor(smp.length / (w * 1.5)));
    ctx.fillStyle = 'rgba(61,156,240,.22)';
    ctx.beginPath(); ctx.moveTo(0, h);
    for (let i = 0; i < smp.length; i += step) ctx.lineTo(X(i), Y(smp[i].tg || 0));
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
    // l'autre capteur (KICKR ou pédales), en fin trait coloré
    const alt = sess.powerRef === 'pedals' ? 'pk' : 'pp';
    if (smp.some(s => s.pp !== undefined)) {
      ctx.beginPath(); ctx.strokeStyle = alt === 'pk' ? 'rgba(98,176,255,.9)' : 'rgba(242,169,59,.9)'; ctx.lineWidth = 1;
      let st = false;
      for (let i = 0; i < smp.length; i += step) { let a = 0, n = 0; for (let k = i; k < Math.min(smp.length, i + step); k++) { if (smp[k][alt] !== undefined) { a += smp[k][alt]; n++; } } if (!n) continue; if (!st) { ctx.moveTo(X(i), Y(a / n)); st = true; } else ctx.lineTo(X(i), Y(a / n)); }
      ctx.stroke();
    }
    ctx.beginPath(); ctx.strokeStyle = '#EEF3FA'; ctx.lineWidth = 1.2;
    for (let i = 0; i < smp.length; i += step) { let a = 0, n = 0; for (let k = i; k < Math.min(smp.length, i + step); k++) { a += smp[k].p; n++; } i ? ctx.lineTo(X(i), Y(a / n)) : ctx.moveTo(0, Y(a / n)); }
    ctx.stroke();
    if (smp.some(s => s.c)) {
      ctx.beginPath(); ctx.strokeStyle = 'rgba(77,208,200,.75)'; ctx.lineWidth = 1; ctx.setLineDash([3, 2]); let st = false;
      for (let i = 0; i < smp.length; i += step) { const y = h - Math.min(140, smp[i].c || 0) / 140 * h * 0.95; if (!st) { ctx.moveTo(X(i), y); st = true; } else ctx.lineTo(X(i), y); }
      ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1.2;
    }
    if (smp.some(s => s.hr)) {
      const hmax = Math.max(P().hrMax || 190, ...smp.map(s => s.hr || 0));
      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,95,95,.9)'; let st = false;
      for (let i = 0; i < smp.length; i += step) { if (!smp[i].hr) continue; const y = h - smp[i].hr / hmax * h * 0.95; if (!st) { ctx.moveTo(X(i), y); st = true; } else ctx.lineTo(X(i), y); }
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(238,243,250,.3)'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(0, Y(sess.ftp)); ctx.lineTo(w, Y(sess.ftp)); ctx.stroke(); ctx.setLineDash([]);
  }

  function download(bytes, name, mime) {
    const blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }


  // ------------------------------------------------------------------ IA
  function progressSheet(title) {
    const sh = openSheet(`<h2>${esc(title)}</h2><p class="muted" id="ai-p">Connexion à Claude…</p><div class="progress" style="margin-top:12px"><i id="ai-bar" style="width:4%"></i></div>`);
    return {
      update(n, expected) { const e = $('#ai-p', sh); if (e) e.textContent = 'Rédaction en cours… ' + Math.round(n / 1000) + ' k caractères'; const b = $('#ai-bar', sh); if (b) b.style.width = Math.min(96, 4 + n / expected * 92) + '%'; },
      close() { closeSheet(); }
    };
  }

  // ------------------------------------------------------------------ adaptation au temps disponible
  const DUR_CHOICES = [20, 30, 40, 45, 50, 60, 75, 90, 120];
  function durationChips(minutes, origSec, fixed) {
    if (fixed === 'tapis') return `<p class="small muted" style="margin:8px 0">Programme du tapis : durée fixe. Pour plus court ou plus long, prends un autre numéro de la même famille.</p>`;
    if (fixed) return `<p class="small muted" style="margin:8px 0">Durée fixe : c’est un test, il se fait en entier.</p>`;
    return `<div class="small muted" style="margin:10px 0 6px">Temps dont je dispose</div>
      <div class="chips"><button class="chip ${!minutes ? 'on' : ''}" data-k="dur" data-v="0">Séance d’origine · ${W.fmtDur(origSec, true)}</button>${DUR_CHOICES.map(m => `<button class="chip ${minutes === m ? 'on' : ''}" data-k="dur" data-v="${m}">${m} min</button>`).join('')}</div>`;
  }
  function adaptNotice(r, minutes) {
    if (!r.changed) return '';
    const off = Math.abs(r.duration - minutes * 60) > 120 ? ` Au plus près de ${minutes} min : ${W.fmtDur(r.duration, true)}.` : '';
    return `<div class="notice small" style="margin:10px 0">Adaptée à ${minutes} min. ${esc(r.summary)}${off}</div>`;
  }
  // ---- forme du jour : un coefficient par sport, retenu pour la journée
  const localDay = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function formeGet(sport) { const f = LS.get('forme', null); return f && f.date === localDay() && f[sport] ? f[sport] : 1; }
  function formeSet(sport, v) { const f = LS.get('forme', null), d = localDay(); const o = f && f.date === d ? f : { date: d }; o[sport] = Math.round(v * 1000) / 1000; LS.set('forme', o); }
  // garde-fous techniques seulement : la forme du jour se règle librement
  const clampInt = v => Math.max(0.05, Math.min(5, Math.round(v * 1000) / 1000));
  const numIn = v => parseFloat(String(v).replace(',', '.').replace(/[^0-9.]/g, ''));
  // réglage « valeur max » + raccourcis en % ; k = préfixe des actions (data-k ou data-t)
  function formeHTML(attr, value, unit, pct, note) {
    return `<div class="forme"><button ${attr}="fmax-" aria-label="Moins">−</button><div class="fv"><input class="fv-in" ${attr}="fval" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${value}" aria-label="Valeur de l’effort le plus dur, en ${unit}" style="width:${Math.max(2, String(value).length) + 0.6}ch"> ${unit}<span>${pct === 1 ? 'comme prévu' : r0(pct * 100) + ' % de la séance prévue'}${note ? ' · ' + note : ''}</span></div><button ${attr}="fmax+" aria-label="Plus">+</button></div>
      <div class="chips" style="margin-top:8px">${[[0.9, 'Fatigué −10 %'], [0.95, '−5 %'], [1, 'Normal'], [1.03, '+3 %'], [1.05, 'En forme +5 %']].map(([v, l]) => `<button class="chip ${Math.abs(v - pct) < 0.0005 ? 'on' : ''}" ${attr}="fpct" data-v="${v}">${l}</button>`).join('')}</div>`;
  }
  // puissance de l'effort le plus dur (W) : étapes de 30 s et plus, hors portions libres
  // (les accélérations de l'échauffement ne servent pas de référence)
  const bikeMax = (tree, ftp) => {
    const st = W.flatten(tree, ftp).filter(s => !s.free), long = st.filter(s => s.d >= 30);
    return Math.max(0, ...(long.length ? long : st).map(s => Math.max(s.p || 0, s.p2 || 0) * ftp));
  };

  // séance adaptée (arbre + nom) pour un sport donné
  function adapted(w, tree, minutes, sport) {
    if (!minutes) return { tree, name: w.name, changed: false };
    const r = AD.adaptToDuration(tree, sport, minutes * 60, P());
    return Object.assign(r, { name: r.changed ? AD.adaptName(w.name, tree, r.tree, sport, minutes, P()) : w.name });
  }

  // fiche d'une séance vélo (KICKR)
  function openWorkout(w, opts) {
    opts = opts || {};
    const p = P();
    const scaled = S.settings.scaleToLevel && w.source === 'lib' && w.level !== p.level && w.cat !== 'test';
    const fixed = w.cat === 'test' || !!w.test;
    let intensity = fixed ? 1 : formeGet('bike'), adapt = scaled, minutes = fixed ? 0 : (opts.minutes !== undefined ? opts.minutes : (S.libMinutes || 0));
    const baseTree = () => adapt ? W.scaleForLevel(w.tree, w.level, p.level) : w.tree;
    const cur = () => adapted(w, baseTree(), minutes, 'bike');
    const body = () => {
      const r = cur(), tree = r.tree;
      const st = W.workoutStats(tree, p.ftp);
      const cads = [...new Set(W.flatten(tree, p.ftp).filter(s => s.c).map(s => s.c))].sort((a, b) => a - b);
      return `<div class="row between"><span class="tag">${esc((W.CATS[w.cat] || {}).name || 'Séance')}</span>${levelDots(w.level)}</div>
        <h2 style="margin-top:10px">${esc(r.name)}</h2><p class="muted small">${esc(w.desc || '')}</p>
        <div style="margin:12px 0">${profileSVG(tree, p.ftp * intensity, { h: 96, ftpLine: true })}</div>
        <div class="statline" style="margin-bottom:6px"><div class="stat"><b>${W.fmtDur(st.duration, true)}</b><span>durée</span></div><div class="stat"><b>${r0(st.tss * intensity * intensity)}</b><span>TSS</span></div><div class="stat"><b>${fx(st.IF * intensity, 2)}</b><span>IF</span></div><div class="stat"><b>${r0(st.kj * intensity)}</b><span>kJ</span></div>${cads.length ? `<div class="stat"><b>${cads.length > 1 ? cads[0] + '–' + cads[cads.length - 1] : cads[0]}</b><span>rpm visés</span></div>` : ''}</div>
        ${durationChips(minutes, W.totalDuration(baseTree()), fixed)}${adaptNotice(r, minutes)}
        ${scaled ? `<div class="switch"><span>Adapter à mon niveau (${W.LEVELS[p.level]})<br><span class="small muted">séance prévue niveau ${w.level}/5</span></span><input type="checkbox" data-k="adapt" ${adapt ? 'checked' : ''}></div>` : ''}
        ${!fixed && bikeMax(tree, p.ftp) > 0 ? `<div style="margin:14px 0 6px" class="small muted">Forme du jour : puissance de l’effort le plus dur <span style="opacity:.75">(touche le chiffre pour le taper)</span></div>${formeHTML('data-k', r0(bikeMax(tree, p.ftp) * intensity), 'W', intensity, formeGet('bike') !== 1 && Math.abs(formeGet('bike') - intensity) < 0.0005 ? 'réglée aujourd’hui' : '')}` : ''}
        <div class="btn-row" style="margin:16px 0"><button class="btn primary" data-k="start">${IC.play} Démarrer</button><button class="btn" data-k="fav" aria-label="Favori">${S.favs.includes(w.id) ? IC.starOn : IC.star}</button><button class="btn" data-k="edit">Modifier</button>${(w.source === 'gen' || w.source === 'ai' || r.changed) && !S.custom.some(c => c.id === w.id) ? '<button class="btn" data-k="save">Enregistrer</button>' : ''}</div>
        <h3 style="margin:6px 0">Déroulé</h3>${stepsHTML(tree, p.ftp, intensity)}
        ${w.source === 'custom' || (w.source === 'ai' && S.custom.some(c => c.id === w.id)) ? '<button class="btn danger block" style="margin-top:14px" data-k="del">Supprimer cette séance</button>' : ''}`;
    };
    const sh = openSheet(`<div id="wbody">${body()}</div>`);
    const re = () => { $('#wbody', sh).innerHTML = body(); };
    sh.addEventListener('click', async e => {
      const b = e.target.closest('[data-k]'); if (!b) return;
      const k = b.dataset.k;
      if (k === 'fpct') { intensity = +b.dataset.v; formeSet('bike', intensity); re(); }
      else if (k === 'fmax-' || k === 'fmax+') {
        const mx = bikeMax(cur().tree, p.ftp), now = Math.round(mx * intensity);
        if (now + (k === 'fmax+' ? 5 : -5) < 10) return;
        intensity = clampInt((now + (k === 'fmax+' ? 5 : -5)) / mx); formeSet('bike', intensity); re();
      }
      else if (k === 'dur') { minutes = +b.dataset.v; re(); }
      else if (k === 'start') { const r = cur(); closeSheet(); startWorkout(Object.assign({}, w, { name: r.name }), { tree: r.tree, intensity, planSessionId: w.planSessionId || opts.planSessionId }); }
      else if (k === 'fav') { S.favs = S.favs.includes(w.id) ? S.favs.filter(x => x !== w.id) : S.favs.concat(w.id); LS.set('favs', S.favs); re(); if (S.view === 'library') render(); }
      else if (k === 'edit') { const r = cur(); closeSheet(); openBuilder(Object.assign({}, w, { tree: r.tree, name: r.name })); }
      else if (k === 'save') { const r = cur(); saveCustom(Object.assign({}, w, { id: r.changed ? 'custom-' + Date.now() : w.id, tree: r.tree, name: r.name, source: r.changed ? 'gen' : w.source })); toast('Séance enregistrée dans « Mes séances »'); re(); }
      else if (k === 'del') { S.custom = S.custom.filter(c => c.id !== w.id); LS.set('custom', S.custom); closeSheet(); render(); toast('Séance supprimée'); }
    });
    sh.addEventListener('change', e => {
      if (e.target.dataset.k === 'adapt') { adapt = e.target.checked; re(); }
      if (e.target.dataset.k === 'fval') { // puissance tapée directement
        const v = numIn(e.target.value), mx = bikeMax(cur().tree, p.ftp);
        if (v >= 10 && mx > 0) { intensity = clampInt(v / mx); formeSet('bike', intensity); }
        re();
      }
    });
    sh.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.k === 'fval') e.target.blur(); });
  }

  // séance surprise vélo, avec le type d'effort et le temps disponible

        <div class="btn-row" style="margin-top:16px"><button class="btn primary" data-k="start">${IC.play} Démarrer</button><button class="btn" data-k="again">Autre proposition</button><button class="btn" data-k="more">Détails</button></div>`;

    document.getElementById('player').classList.toggle('dual', has);
    if (!has) return;
    const tag0 = document.getElementById('p-srctag'); if (tag0) tag0.hidden = false;
    $('#src-p').classList.toggle('absent', !run.pm);
    const pm = run.pmData(), d = dev.trainer.data || {}, refP = run.refSource === 'pedals';
    set('src-k-w', String(r0(d.power))); set('src-k-c', String(r0(d.cadence)));
    // la cadence du KICKR est une estimation : quand elle vaut la moitié de celle des pédales, on le signale
    // (hystérésis d'environ 2 s pour éviter le clignotement)
    const half = pm && pm.cad > 30 && d.cadence > 0 && Math.abs(2 * d.cadence - pm.cad) <= Math.max(4, pm.cad * 0.06);
    run._halfK = Math.max(0, Math.min(12, (run._halfK || 0) + (half ? 1 : -1)));
    const showHalf = run._halfK >= 6;
    $('#src-k').classList.toggle('half', showHalf);
    set('src-k-ref', refP ? (showHalf ? 'cadence ≈ ½' : '') : 'référence'); set('src-p-ref', refP ? 'référence' : '');
    $('#src-k').classList.toggle('ref', !refP); $('#src-p').classList.toggle('ref', refP);
    set('src-k-ft', run.isFree ? (run.manualW !== null && run.manualW !== undefined ? `pente ${fx(run.grade, 1)} %` : 'mode libre') : `résistance réglée à ${r0(run.ergCommand())} W`);
    $('#src-p').classList.toggle('lost', !!run.pm && !pm);
    set('src-p-w', pm ? String(r0(pm.power)) : '–'); set('src-p-c', pm ? String(r0(pm.cad)) : '–');
    const bal = pm && pm.bal;
    set('src-p-l', bal ? 'G ' + r0(bal) : (pm ? 'G –' : 'signal perdu')); set('src-p-r', bal ? 'D ' + r0(100 - bal) : (pm ? 'D –' : ''));
    const bar = document.getElementById('src-p-bar'); if (bar) bar.style.width = (bal || 50) + '%';
    set('p-srcname', refP ? `Pédales ${esc(pmLabel())}` : 'KICKR');
    const tag = document.getElementById('p-srctag'); if (tag) tag.style.setProperty('--c', refP ? SRC_COL.pedals : SRC_COL.trainer);
  }

  // connexion des pédales en pleine séance (bouton dans la tuile « Assioma » du lecteur)
  async function connectPmLive() {
    const m = dev.pm; if (!m) return;
    if (m.state === 'disconnected') {
      try {
        const n = await m.connect(real.trainer.device ? real.trainer.device.id : null);
        if (!S.settings.hasPedals) { S.settings.hasPedals = true; saveSettings(); }
        toast('Pédales connectées : ' + n);
      } catch (e) { if (e.name !== 'NotFoundError') toast(e.message, true); return; }
    }
    if (S.runner && m.state === 'connected') S.runner.pm = m;
    updateDevices();
  }
  document.addEventListener('click', e => { const b = e.target.closest('.pm-conn'); if (!b) return; e.stopPropagation(); connectPmLive(); });

  // fiche activité : comparaison des deux capteurs
  function sourcesCompareHTML(sm, detail) {
    const s = sm && sm.sources; if (!s || !s.n) return '';
    const refP = (detail && detail.powerRef) ? detail.powerRef === 'pedals' : Math.abs((sm.avgP || 0) - s.pedals) < Math.abs((sm.avgP || 0) - s.kickr);
    const gap = s.gap * 100;
    const row = (l, k, p) => `<tr><td>${l}</td><td>${k}</td><td>${p}</td></tr>`;
    return `<h3 style="margin:18px 0 6px">KICKR et pédales</h3>
      <table class="laps srccmp"><tr><th></th><th><span class="sw" style="background:${SRC_COL.trainer}"></span>KICKR</th><th><span class="sw" style="background:${SRC_COL.pedals}"></span>Pédales</th></tr>
      ${row('Puissance moyenne', `<b>${r0(s.kickr)}</b> W`, `<b>${r0(s.pedals)}</b> W`)}
      ${row('Cadence moyenne', s.cadK ? r0(s.cadK) + ' rpm <span class="muted">(estimée)</span>' : '–', s.cadP ? r0(s.cadP) + ' rpm' : '–')}
      ${row('Référence', refP ? '' : '✓', refP ? '✓' : '')}</table>
      <p class="small muted" style="margin-top:8px">Les pédales lisent ${gap >= 0 ? '+' : ''}${fx(gap, 1)} % par rapport au KICKR${Math.abs(gap) <= 5 ? ', un écart normal (pertes de transmission, étalonnage)' : ' : pense à étalonner les pédales et à faire un spindown du KICKR'}.${s.bal ? ` Équilibre moyen : gauche ${fx(s.bal, 1)} %, droite ${fx(100 - s.bal, 1)} %.` : ''}${s.cover < 0.95 ? ` Pédales captées ${r0(s.cover * 100)} % du temps.` : ''}</p>
      ${s.halfShare >= 0.1 ? `<p class="small muted" style="margin-top:6px">Le KICKR n’a pas de capteur de cadence : il l’estime d’après les à-coups de ton pédalage. Pendant ${r0(s.halfShare * 100)} % de la séance, il a affiché la moitié de ta vraie cadence (pédalage souple, petit braquet). La cadence enregistrée et envoyée à Strava est celle des pédales.</p>` : ''}`;
  }

  // ------------------------------------------------------------------ tapis de course (Domyos Run 100, FTMS)
  const TM_COL = '#34c77b';
  const kmh = v => TM.fmtKmh(v || 0);
  const paceOf = v => v > 0.5 ? SP.fmtPace(3600 / v) : '–';

  async function connectTm() {
    const t = dev.tm; if (!t) return;
    if (t.state !== 'disconnected') { openTmSheet(); return; }
    try {
      const n = await t.connect(real.trainer.device ? real.trainer.device.id : null);
      if (!S.settings.hasTreadmill) { S.settings.hasTreadmill = true; saveSettings(); }
      toast(t.canSpeed ? `Tapis connecté : ${n}. L’app peut régler sa vitesse.` : `Tapis connecté : ${n}. Il n’accepte pas de consigne de vitesse : l’app t’indiquera la vitesse à régler.`);
    } catch (e) { if (e.name !== 'NotFoundError') toast(e.message, true); }
    updateDevices(); render();
  }

  function openTmSheet() {
    const t = dev.tm; if (!t) return;
    const body = () => {
      const on = t.state === 'connected', ctl = S.settings.tmControl !== false;
      const maxR = (t.range && t.range.max) || 14, maxes = [10, 12, 14, 16, 18, 20].filter(v => v <= Math.max(maxR, 10));
      const cur = Math.min(S.settings.tmMax || maxR, maxR);
      return `<span class="tag" style="color:${TM_COL}">Tapis de course</span>
        <h2 style="margin-top:8px">${on ? esc(t.name) : 'Tapis non connecté'}</h2>
        <div class="statline" style="margin:12px 0" id="tm-live">${tmLiveHTML(t)}</div>
        ${on ? (t.canSpeed
          ? `<div class="notice small" style="margin:6px 0 12px"><b>Ton tapis accepte que l’app règle sa vitesse</b> (${kmh(t.range.min)} à ${kmh(t.range.max)} km/h).</div>`
          : `<div class="notice small" style="margin:6px 0 12px"><b>Ton tapis envoie ses données mais n’accepte pas de consigne de vitesse.</b> Pendant la séance, l’app t’annonce la vitesse à régler sur la console. Vérifie que le FTMS est bien activé dans Domyos E-Connected, puis reconnecte le tapis.</div>`) : ''}
        <div class="switch"><span>Régler la vitesse automatiquement<br><span class="small muted">À chaque étape, l’app envoie la vitesse au tapis. Un appui sur + / – de la console te rend la main jusqu’à l’étape suivante.</span></span><input type="checkbox" data-k="ctl" ${ctl ? 'checked' : ''}></div>
        <div class="small muted" style="margin:14px 0 6px">Vitesse maximale autorisée</div>
        <div class="chips">${maxes.map(v => `<button class="chip ${cur === v ? 'on' : ''}" data-k="max" data-v="${v}">${v} km/h</button>`).join('')}</div>
        <div class="small muted" style="margin:14px 0 6px">Vitesses préenregistrées (séance libre), en km/h</div>
        <div class="f-edit">${tmPresets().map((v, i) => `<input type="number" inputmode="decimal" step="0.5" min="1" max="${maxR}" value="${v}" data-k="preset" data-i="${i}" aria-label="Vitesse ${i + 1}">`).join('')}</div>
        <div class="btn-row" style="margin-top:16px">${on ? `<button class="btn primary" data-k="free">${IC.tread} Séance libre</button><button class="btn" data-k="progs">Programmes du tapis</button><button class="btn" data-k="off">Déconnecter</button>` : '<button class="btn primary" data-k="on">Connecter</button><button class="btn" data-k="progs">Programmes du tapis</button>'}</div>
        <details class="small muted" style="margin-top:14px"><summary>Si le tapis n’apparaît pas</summary><p style="margin-top:6px">Une seule fois : dans l’app Domyos E-Connected, active le FTMS, ferme E-Connected, puis éteins et rallume le tapis. Ensuite, aucune autre app (E-Connected, Kinomap, Zwift) ne doit être connectée au tapis pendant la séance. Le tapis apparaît souvent sous un nom commençant par DOMYOS ; ton KICKR peut aussi apparaître dans la liste, ne le choisis pas.</p></details>`;
    };
    const sh = openSheet(`<div id="tm-body">${body()}</div>`);
    const re = () => { $('#tm-body', sh).innerHTML = body(); };
    const live = setInterval(() => { const el = $('#tm-live', sh); if (!el || !document.body.contains(sh)) { clearInterval(live); return; } el.innerHTML = tmLiveHTML(t); }, 700);
    sh.addEventListener('click', async e => {
      const b = e.target.closest('[data-k]'); if (!b) return;
      const k = b.dataset.k;
      if (k === 'max') { S.settings.tmMax = +b.dataset.v; saveSettings(); re(); }
      else if (k === 'off') { t.disconnect(); updateDevices(); re(); }
      else if (k === 'on') { await connectTm(); re(); }
      else if (k === 'free') { closeSheet(); openFreeTread(); }
      else if (k === 'progs') ACT.tmProgs();
    });
    sh.addEventListener('change', e => {
      if (e.target.dataset.k === 'ctl') { S.settings.tmControl = e.target.checked; saveSettings(); }
      if (e.target.dataset.k === 'preset') {
        const list = tmPresets().slice(), v = Math.round(parseFloat(String(e.target.value).replace(',', '.')) * 10) / 10;
        if (v >= 1 && v <= 25) { list[+e.target.dataset.i] = v; S.settings.tmPresets = list; saveSettings(); toast('Vitesse enregistrée'); } else e.target.value = list[+e.target.dataset.i];
      }
    });
  }
  function tmLiveHTML(t) {
    const on = t.state === 'connected', d = t.data || {};
    return `<div class="stat"><b>${on ? kmh(d.speed) : '–'}</b><span>km/h</span></div><div class="stat"><b>${on ? paceOf(d.speed) : '–'}</b><span>allure /km</span></div><div class="stat"><b>${on && d.incline !== null && d.incline !== undefined ? fx(d.incline, 1) : '–'}</b><span>pente %</span></div>`;
  }

  // ---- lancement d'une séance de course sur tapis
  async function startTreadRun(w, opts) {
    opts = opts || {};
    if (!S.profile) { openOnboarding(); return; }
    if (!dev.tm || dev.tm.state !== 'connected') {
      if (S.demo) await dev.tm.connect();
      else {
        const choice = await ask('Tapis non connecté', 'Connecte ton tapis pour que l’app suive la séance et règle la vitesse.', [
          { label: 'Connecter le tapis', value: 'conn', cls: 'primary' }, { label: 'Essayer en mode démo', value: 'demo' }, { label: 'Annuler', value: null }]);
        if (!choice) return;
        if (choice === 'demo') { setDemo(true); await dev.tm.connect(); }
        else { await connectTm(); if (dev.tm.state !== 'connected') return; }
      }
      updateDevices();
    }
    if (S.demo && sim.hrRun.state !== 'connected') sim.hrRun.connect();
    const run = new TM.TreadRunner({
      workout: { id: w.id, name: w.name, cat: w.cat, sport: 'run' }, tree: w.tree, prof: P(), tm: dev.tm,
      hr: S.demo ? sim.hrRun : dev.hr, control: S.settings.tmControl !== false, maxSpeed: S.settings.tmMax || 14
    });
    run.planSessionId = opts.planSessionId || w.planSessionId || null;
    S.treadRun = run;
    openTreadPlayer(run);
  }

  function openTreadPlayer(run) {
    const el = document.createElement('div');
    el.id = 'player'; el.className = 'tread';
    const st = SP.stats(run.tree, 'run', run.prof);
    if (run.workout.cat !== 'test') run.intensity = formeGet('run');
    const cap = run.maxSpeed;
    const formeBox = () => {
      const pm = run.planMax(), top = Math.round(pm * run.intensity * 10) / 10;
      return `<div class="small muted" style="margin:4px 0 6px">Forme du jour : vitesse de l’effort le plus rapide <span style="opacity:.75">(touche le chiffre pour le taper)</span></div>${formeHTML('data-t', kmh(top), 'km/h', run.intensity, '')}
        ${top > cap + 0.05 ? `<p class="small" style="margin:8px auto 0;max-width:320px;color:var(--warn, #f2a93b)">La séance monte à ${kmh(top)} km/h, au-dessus de ta limite de ${kmh(cap)} km/h : seuls les passages les plus rapides seraient plafonnés (limite réglable dans la fiche du tapis). <button class="linkbtn" data-t="fcap">Tout réduire en proportion (${kmh(cap)} km/h max)</button></p>` : ''}
        <p class="small muted" style="margin:8px 0 0">Première consigne : ${kmh(run.targetSpeed(run.steps[0]))} km/h.</p>`;
    };
    const first = run.targetSpeed(run.steps[0]);
    el.innerHTML = `
      <div class="p-head"><button class="iconbtn" data-t="close" aria-label="Terminer">${IC.close}</button><div class="title ellipsis">${esc(run.workout.name)}</div><span class="p-elapsed" id="t-el">0:00</span></div>
      <div class="p-main">
        <div class="p-interval"><span class="zone-edge" id="t-zedge"></span><div style="padding-left:6px;min-width:0"><div class="rep" id="t-rep"></div><div class="lbl ellipsis" id="t-lbl">—</div><div class="next ellipsis" id="t-next"></div></div><div class="remain" id="t-rem">0:00</div></div>
        <div class="p-power"><div class="p-srctag" id="t-mode"><i></i><span id="t-modetxt"></span></div><div class="big" id="t-spd">0,0<small>km/h</small></div><div class="target" id="t-tg"></div><div class="t-pace" id="t-pace"></div></div>
        <div class="p-metrics"><div class="m"><b id="t-hr">–</b><span>bpm</span></div><div class="m"><b id="t-dist">0,00</b><span>km</span></div><div class="m"><b id="t-avg">–</b><span>allure moy.</span></div><div class="m"><b id="t-inc">–</b><span>pente %</span></div></div>
        <div class="p-chart"><canvas id="t-chart"></canvas></div>
      </div>
      <div class="p-controls">
        <div class="adj"><button data-t="minus" aria-label="Moins vite">−</button><div class="val" id="t-adj"><b>100 %</b>vitesse des consignes</div><button data-t="plus" aria-label="Plus vite">+</button></div>
        <button class="btn" data-t="pause" id="t-pause">${IC.pause}<span>Pause</span></button>
        <button class="btn" data-t="skip">${IC.skip}<span>Passer</span></button>
        <button class="btn" data-t="end" aria-label="Terminer la séance">${IC.more}</button>
      </div>
      <div class="startcover" id="t-cover"><div class="stack" id="t-coverbody">
        <h2>${esc(run.workout.name)}</h2><p class="muted">${W.fmtDur(st.duration, true)} · ${fmtKm(st.distance, 'run')} · sur tapis</p>
        <div id="t-forme" style="width:100%;max-width:340px;margin:0 auto">${formeBox()}</div>
        <p class="small muted" style="max-width:300px;margin:0 auto">${run.control ? 'L’app réglera la vitesse à chaque étape. Tu peux reprendre la main à tout moment avec + / – sur la console.' : `Le tapis ne prend pas de consigne : l’app t’annoncera la vitesse à régler (${kmh(first)} km/h pour commencer).`}</p>
        <button class="btn primary" data-t="ready">${IC.play} Je suis prêt</button><button class="btn ghost" data-t="cancel">Annuler</button></div></div>`;
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    Hist.push();
    let alertT = null, lastChart = 0;
    const set = (id, v) => { const e = document.getElementById(id); if (e && e.innerHTML !== v) e.innerHTML = v; };
    const banner = (t, ms) => { let a = $('#p-alert'); if (!a) { a = document.createElement('div'); a.id = 'p-alert'; a.className = 'p-alert'; el.appendChild(a); } a.textContent = t; clearTimeout(alertT); alertT = setTimeout(() => a.remove(), ms || 6000); };
    const stepTxt = s => run.isDist(s) ? (s.dist >= 1000 ? fx(s.dist / 1000, s.dist % 1000 ? 1 : 0) + ' km' : s.dist + ' m') : W.fmtDur(s.d !== undefined ? s.d : s.dur, true);

    function update() {
      const s = run.step; if (!s) return;
      const d = dev.tm.data || {}, v = d.speed || 0, tg = run.override ? null : run.targetSpeed();
      $('#t-zedge').style.background = SP.stepColor(s, 'run');
      const pr = run.stepProgress();
      set('t-rem', pr.dist ? r0(pr.left) + '<small style="font-size:.45em"> m</small>' : W.fmtDur(Math.ceil(pr.left)));
      set('t-lbl', esc(s.l || SP.stepName(s, 'run')));
      set('t-rep', s.rep ? `Répétition ${s.rep.i}/${s.rep.n}` : '');
      const nx = run.next;
      set('t-next', nx ? `Ensuite : ${stepTxt(nx)} à ${kmh(run.targetSpeed(nx))} km/h${nx.l ? ' (' + esc(nx.l) + ')' : ''}` : 'Dernière étape');
      set('t-spd', `${kmh(v)}<small>km/h</small>`);
      set('t-pace', `${paceOf(v)} <span class="muted">/km</span>`);
      if (tg !== null) {
        const diff = Math.round((v - tg) * 10) / 10, col = Math.abs(diff) <= 0.2 ? 'var(--ok)' : diff > 0 ? 'var(--z5)' : 'var(--z2)';
        set('t-tg', `Cible <b>${kmh(tg)}</b> km/h · ${paceOf(tg)}/km<span class="delta" style="background:${col};color:#0D1B2E">${diff > 0 ? '+' : ''}${kmh(diff)}</span>`);
      } else set('t-tg', `Vitesse libre · consigne ${kmh(run.targetSpeed())} km/h`);
      const mode = !run.control ? ['console', `règle ${kmh(run.targetSpeed())} km/h sur la console`, '#62b0ff'] : run.override ? ['manual', 'vitesse à la main jusqu’à l’étape suivante', '#f2a93b'] : ['auto', 'vitesse réglée par l’app', TM_COL];
      set('t-modetxt', mode[1]); $('#t-mode').style.setProperty('--c', mode[2]);
      const hr = run._hr(); set('t-hr', hr ? String(hr) : '–');
      set('t-dist', fx(run.distance / 1000, 2));
      set('t-avg', run.distance > 50 ? SP.fmtPace(run.elapsed / (run.distance / 1000)) : '–');
      set('t-inc', d.incline !== null && d.incline !== undefined ? fx(d.incline, 1) : '–');
      set('t-el', `${W.fmtDur(run.elapsed)} / ${W.fmtDur(run.total)}`);
      set('t-adj', `<b>${r0(run.intensity * 100)} %</b>vitesse des consignes`);
      const pb = $('#t-pause'), want = run.state === 'paused' ? `${IC.play}<span>Reprendre</span>` : `${IC.pause}<span>Pause</span>`;
      if (pb.innerHTML !== want) pb.innerHTML = want;
      if (Date.now() - lastChart > 1000) { lastChart = Date.now(); drawTreadChart(run); }
    }
    run.on('tick', update);
    run.on('state', s => {
      if (s === 'running' && $('#t-cover')) { $('#t-cover').remove(); say('C’est parti. ' + (run.step.l || SP.stepName(run.step, 'run')) + (run.control ? ', ' + kmh(run.targetSpeed()) + ' kilomètres heure' : '')); }
      update();
    });
    run.on('soon', ({ step, speed }) => { beep(880, 0.12); if (speed !== null) say(`Dans 5 secondes, ${run.control ? '' : 'règle '}${kmh(speed).replace(',', ' virgule ')} kilomètres heure`); });
    run.on('step', ({ step }) => {
      vibrate([120, 60, 120]); beep(1320, 0.25);
      say(`${step.l ? step.l + '. ' : ''}${stepTxt(step).replace("'", ' minutes ').replace('"', ' secondes').replace(' m', ' mètres')}`);
    });
    run.on('override', v => { banner(`Vitesse réglée à la console (${kmh(v)} km/h) : l’app te laisse la main jusqu’à l’étape suivante.`); });
    run.on('beltstop', () => { vibrate([200]); banner('Tapis arrêté : séance en pause. Relance le tapis (START) pour continuer.', 8000); });
    run.on('resumed', () => toast('C’est reparti'));
    run.on('safety', () => banner('Clé de sécurité retirée : le tapis s’est arrêté.', 8000));
    run.on('done', () => { say('Séance terminée. Bravo ! Ralentis et arrête le tapis quand tu veux.'); finishTread(run, cleanup); });
    function cleanup() { run.stop(); keepAwake(false); el.remove(); document.body.style.overflow = ''; S.treadRun = null; Hist.pop(1); }

    // vitesse max tapée directement (« 12 », « 12,5 »)
    el.addEventListener('change', e => {
      if (e.target.dataset.t !== 'fval') return;
      const v = numIn(e.target.value), pm = run.planMax();
      if (v >= run.minSpeed && pm > 0) { run.setIntensity(v / pm); formeSet('run', run.intensity); }
      $('#t-forme').innerHTML = formeBox();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.t === 'fval') e.target.blur(); });
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      const k = b.dataset.t;
      if (k === 'fval') return;
      if (k === 'fpct' || k === 'fmax-' || k === 'fmax+' || k === 'fcap') {
        const pm = run.planMax();
        if (k === 'fpct') run.setIntensity(+b.dataset.v);
        else if (k === 'fcap') run.setIntensity(cap / pm);
        else { const nv = Math.round(pm * run.intensity * 10) / 10 + (k === 'fmax+' ? 0.1 : -0.1); if (nv >= run.minSpeed - 0.001) run.setIntensity(nv / pm); }
        formeSet('run', run.intensity);
        $('#t-forme').innerHTML = formeBox();
        return;
      }
      if (k === 'ready') {
        keepAwake(true); beep(660, 0.1);
        run.begin();
        $('#t-coverbody').innerHTML = `<h2>Démarre le tapis</h2><p class="muted" style="max-width:300px;margin:0 auto">Clé de sécurité en place, monte sur le tapis et appuie sur <b>START</b>. La séance démarre dès que la bande tourne.</p>
          ${run.control ? '<button class="btn primary" data-t="launch">Lancer le tapis depuis l’app</button>' : ''}${S.demo ? '<button class="btn" data-t="demostart">Simuler START (démo)</button>' : ''}<button class="btn ghost" data-t="cancel">Annuler</button>`;
        say('Appuie sur START pour démarrer le tapis');
      } else if (k === 'launch') {
        const box = $('#t-coverbody');
        for (let n = 3; n > 0; n--) { box.innerHTML = `<h2 style="font-size:64px">${n}</h2><p class="muted">Le tapis démarre…</p>`; beep(880, 0.1); await new Promise(r => setTimeout(r, 1000)); }
        run.launch();
      } else if (k === 'demostart') { dev.tm.userStart && dev.tm.userStart(); }
      else if (k === 'cancel') { cleanup(); }
      else if (k === 'pause') { run.state === 'paused' ? run.resume() : run.pause(); update(); }
      else if (k === 'skip') run.skip();
      else if (k === 'plus' || k === 'minus') { const nv = run.intensity + (k === 'plus' ? 0.02 : -0.02); if (nv > 0.04) run.setIntensity(nv); update(); }
      else if (k === 'end' || k === 'close') {
        const v = await ask('Terminer la séance ?', 'Le tapis continue de tourner : arrête-le avec STOP.', [{ label: 'Enregistrer et terminer', value: 'save', cls: 'primary' }, { label: 'Continuer', value: null }, { label: 'Abandonner sans enregistrer', value: 'drop' }]);
        if (v === 'save') finishTread(run, cleanup);
        else if (v === 'drop') cleanup();
      }
    });
    update();
  }

  // graphique du lecteur : consignes (blocs), vitesse réelle, FC
  function drawTreadChart(run) {
    const cv = document.getElementById('t-chart'); if (!cv) return;
    const { ctx, w, h } = setupCanvas(cv);
    const total = Math.max(run.total, run.elapsed + 1), X = t => t / total * w;
    const vmax = Math.max(16, ...run.steps.map(s => run.targetSpeed(s) || 0)) * 1.05, Y = v => h - v / vmax * h * 0.96;
    run.steps.forEach(s => {
      const v = run.targetSpeed(s) || 0;
      ctx.fillStyle = SP.stepColor(s, 'run'); ctx.globalAlpha = 0.7;
      ctx.fillRect(X(s.start), Y(v), Math.max(1, X(s.dur) - 0.5), h - Y(v));
    });
    ctx.globalAlpha = 1;
    const smp = run.samples; if (!smp.length) return;
    const t0 = smp[0].t;
    ctx.beginPath(); ctx.strokeStyle = '#EEF3FA'; ctx.lineWidth = 1.6;
    smp.forEach((s, i) => { const x = X(i), y = Y(s.s); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    if (smp.some(s => s.hr)) {
      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,95,95,.9)'; ctx.lineWidth = 1.2; let st = false;
      const hm = run.prof.hrMax || 190;
      smp.forEach((s, i) => { if (!s.hr) return; const y = h - (s.hr - 60) / (hm - 60) * h * 0.95; if (!st) { ctx.moveTo(X(i), y); st = true; } else ctx.lineTo(X(i), y); });
      ctx.stroke();
    }
    ctx.fillStyle = '#FFCB2F'; ctx.fillRect(X(run.elapsed) - 1, 0, 2, h);
  }

  // ---- fin de séance : activité « course sur tapis »
  async function finishTread(run, cleanup) {
    const samples = run.samples.slice();
    run.stop(); cleanup();
    if (samples.length < 60) { toast('Séance de moins d’une minute : rien n’a été enregistré'); render(); return; }
    const sm = run.summary();
    const id = 'tm' + samples[0].t;
    const detail = { id, sport: 'run', intensity: run.intensity, startTime: samples[0].t, name: run.workout.name, samples, laps: run.laps.map(l => Object.assign({}, l, { to: l.to === null ? samples.length : l.to })), pauses: run.pauses, summary: sm, dsl: run.tree ? SP.toDSL(run.tree, 'run') : null, control: run.control, free: !run.tree };
    const a = { id, sport: 'run', sub: 'treadmill', source: 'treadmill', cat: run.workout.cat, name: run.workout.name, startTime: samples[0].t, summary: sm, planSessionId: run.planSessionId || null, completed: run.steps ? run.idx >= run.steps.length : true };
    try { await saveActivity(a, detail); } catch (e) { toast('Impossible d’enregistrer : ' + e.message, true); }
    if (a.planSessionId) markPlanDone(a.planSessionId, a.id); else autoLinkPlan(a);
    render();
    openActivity(a.id, { fresh: true });
    if (S.settings.autoStrava && Strava.isConnected()) uploadStrava(a, detail);
  }

  // fiche activité : intervalles d'une course sur tapis
  function treadLapsHTML(detail) {
    if (!detail || !detail.laps || detail.laps.length < 2) return '';
    const rows = detail.laps.map(l => TM.lapStats(detail.samples.slice(l.from, l.to), l, detail.samples)).filter(r => r && r.n >= 10);
    if (rows.length < 2) return '';
    return `<h3 style="margin:16px 0 6px">Intervalles</h3><table class="laps"><tr><th>Étape</th><th>Durée</th><th>Dist.</th><th>Cible</th><th>Réalisé</th><th>FC</th></tr>${rows.map(r => {
      const ok = r.target && Math.abs(r.avgSpeed - r.target) <= 0.3;
      return `<tr><td class="ellipsis" style="max-width:110px">${esc(r.label || '')}</td><td>${W.fmtDur(r.n, true)}</td><td>${r0(r.dist)} m</td><td>${r.target ? paceOf(r.target) : '–'}</td><td><b style="color:${r.target ? (ok ? 'var(--ok)' : 'var(--warn, #f2a93b)') : 'inherit'}">${paceOf(r.avgSpeed)}</b></td><td>${r.avgHr ? r0(r.avgHr) : '–'}</td></tr>`;
    }).join('')}</table><p class="small muted" style="margin-top:6px">Allures en min/km.${detail.control ? ' La vitesse a été réglée par l’app.' : ''}</p>`;
  }

  // ------------------------------------------------------------------ séances libres : piloter le tapis ou le home trainer depuis le téléphone
  const FREE_BIKE_ZONES = [[0.5, 'Récup'], [0.65, 'Endurance'], [0.8, 'Tempo'], [0.95, 'Seuil'], [1.1, 'PMA']];
  const FREE_GRADES = [0, 2, 4, 6, 8];
  const tmPresets = () => (S.settings.tmPresets && S.settings.tmPresets.length ? S.settings.tmPresets : [4, 8, 10, 12, 14]);
  const round5 = w => Math.round(w / 5) * 5;

    const banner = (t, ms) => { let a = $('#p-alert'); if (!a) { a = document.createElement('div'); a.id = 'p-alert'; a.className = 'p-alert'; el.appendChild(a); } a.textContent = t; clearTimeout(alertT); alertT = setTimeout(() => a.remove(), ms || 5000); };

      set('f-vavg', run.elapsed > 10 ? kmh(run.distance / run.elapsed * 3.6) : '–');
      const hr = run._hr(); set('f-hr', hr ? String(hr) : '–');

      const be = $('#f-belt'); if (be.innerHTML !== bb) be.innerHTML = bb;

    // démarrage de la bande depuis le téléphone : compte à rebours de 3 s

    run.on('console', v => toast(`Vitesse réglée à la console : ${kmh(v)} km/h`));

      else if (k === 'end') {
        const moving = (dev.tm.data.speed || 0) >= 0.5;

      const choice = await ask('Home trainer non connecté', 'Connecte ton KICKR pour régler la résistance depuis le téléphone.', [
        { label: 'Connecter mon KICKR', value: 'conn', cls: 'primary' }, { label: 'Essayer en mode démo', value: 'demo' }, { label: 'Annuler', value: null }]);

    const run = new RUN.Runner({ workout: { id: 'free-bike', name: 'Vélo libre', cat: 'free', source: 'free' }, tree, ftp: p.ftp, trainer: dev.trainer, hr: dev.hr, cad: dev.cad || null, pm: dev.pm && dev.pm.state === 'connected' ? dev.pm : null, powerSrc: S.settings.powerSrc || 'pedals', match: S.settings.powerMatch !== false, autoPause: S.settings.autoPause });
    run.manualW = S.settings.freeBikeW || round5(p.ftp * 0.65);
    run.showDual = true;
    S.runner = run;
    let mode = 'erg';
    const el = document.createElement('div');
    el.id = 'player'; el.className = 'free bike';
    el.innerHTML = `
      <div class="p-head"><button class="iconbtn" data-f="end" aria-label="Terminer">${IC.close}</button><div class="title ellipsis">Vélo libre</div><span class="p-elapsed" id="b-el">0:00</span></div>
      <div class="f-main">
        <div class="seg f-seg"><button data-f="mode" data-v="erg" class="on">Puissance (ERG)</button><button data-f="mode" data-v="grade">Pente</button></div>
        <div class="p-power"><div class="p-srctag" id="p-srctag" ${run.pm ? '' : 'hidden'}><i></i>puissance <span id="p-srcname"></span></div><div class="big" id="b-pw">0<small>W</small></div><div class="target" id="b-tg"></div>${sourcesHTML()}</div>

        <div class="p-metrics f-metrics"><div class="m"><b id="b-time">0:00</b><span>temps</span></div><div class="m"><b id="b-cad">–</b><span>rpm</span></div><div class="m"><b id="b-hr">–</b><span>bpm</span></div><div class="m"><b id="b-avg">–</b><span>W moy.</span></div><div class="m"><b id="b-spd">–</b><span>km/h</span></div><div class="m"><b id="b-dist">0,0</b><span>km</span></div><div class="m"><b id="b-kj">0</b><span>kJ</span></div><div class="m"><b id="b-np">–</b><span>NP</span></div></div>

    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    Hist.push(); keepAwake(true);
    let lastChart = 0;
    const set = (id, v) => { const e = document.getElementById(id); if (e && e.innerHTML !== v) e.innerHTML = v; };
    // puissance lissée sur 3 s (pédales ou KICKR selon la référence)
    const pw = [];
    const refPower = () => { const m = run.pmData(); return run.refSource === 'pedals' && m ? m.power : (dev.trainer.data.power || 0); };
    const pwT = setInterval(() => { pw.push({ t: Date.now(), p: refPower() }); while (pw.length && Date.now() - pw[0].t > 3000) pw.shift(); }, 250);
    const p3 = () => pw.length ? pw.reduce((a, x) => a + x.p, 0) / pw.length : refPower();
    function controlsHTML() {
      if (mode === 'erg') {
        set('b-presets', FREE_BIKE_ZONES.map(([f, l]) => { const w = round5(p.ftp * f); return `<button data-f="preset" data-v="${w}" class="${run.manualW === w ? 'on' : ''}"><b>${w}</b><span>${l}</span></button>`; }).join(''));
        set('b-fine', [-10, -5, 5, 10].map(dv => `<button data-f="nudge" data-v="${dv}">${dv > 0 ? '+' : '−'}${Math.abs(dv)} W</button>`).join(''));

    }
    const tick = setInterval(update, 250);
    run.on('lap', n => { beep(1320, 0.15); toast('Tour ' + n); });
    run.on('state', s => { if (s === 'paused') toast('En pause : reprends quand tu veux'); });
    function cleanup() { clearInterval(tick); clearInterval(pwT); keepAwake(false); el.remove(); document.body.style.overflow = ''; S.runner = null; Hist.pop(1); }
    // nouveau tour, sauf si le tour en cours vient de commencer (on le renomme)

      const l = run.laps[run.laps.length - 1];

          if (k === 'preset') markLap(w + ' W', w);
          else { const l = run.laps[run.laps.length - 1]; if (l && run.samples.length - l.from < 10) { l.label = w + ' W'; l.target = w; } }

          if (k === 'preset') markLap('Pente ' + fx(run.grade, 1) + ' %', 0);

      } else if (k === 'pause') { run.state === 'paused' ? run.resume() : run.pause(); update(); }

        else if (v === 'drop') end(false);

    controlsHTML();
    run.start();

    update();
  }

  // graphique des séances libres : mesure (blanc), consigne (jaune), FC (rouge) sur toute la séance
  function drawFreeChart(smp, key, tgKey, hrMax, id) {
    const cv = document.getElementById(id); if (!cv) return;
    const { ctx, w, h } = setupCanvas(cv);
    const n = smp.length; if (n < 2) return;
    const X = i => i / Math.max(n - 1, 60) * w;
    const mx = Math.max(1, ...smp.map(s => s[key] || 0), ...smp.map(s => s[tgKey] || 0)) * 1.12, Y = v => h - v / mx * h;
    const step = Math.max(1, Math.floor(n / w));
    ctx.beginPath(); ctx.strokeStyle = 'rgba(255,203,47,.9)'; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.2; let st = false;
    for (let i = 0; i < n; i += step) { const t = smp[i][tgKey]; if (!t) { st = false; continue; } if (!st) { ctx.moveTo(X(i), Y(t)); st = true; } else ctx.lineTo(X(i), Y(t)); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.strokeStyle = '#EEF3FA'; ctx.lineWidth = 1.6;
    for (let i = 0; i < n; i += step) { const y = Y(smp[i][key] || 0); i ? ctx.lineTo(X(i), y) : ctx.moveTo(X(i), y); }
    ctx.stroke();
    if (smp.some(s => s.hr)) {
      const hm = hrMax || 190; ctx.beginPath(); ctx.strokeStyle = 'rgba(255,95,95,.9)'; ctx.lineWidth = 1.2; st = false;
      for (let i = 0; i < n; i += step) { if (!smp[i].hr) continue; const y = h - (smp[i].hr - 60) / (hm - 60) * h * 0.95; if (!st) { ctx.moveTo(X(i), y); st = true; } else ctx.lineTo(X(i), y); }
      ctx.stroke();
    }
  }

  // ------------------------------------------------------------------ renfo : circuits réglables, fiches d'exercices, lecteur guidé
  const { STR, FIGS } = window.WC;
  const STR_COL = '#a98bf0', STRETCH_COL = '#5ec98f';
  let figUid = 0;
  const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // schéma d'un exercice : animé (fiches, lecteur) ou figé sur la pose la plus parlante (listes)
  function exFig(id, opt) {
    opt = opt || {};
    const F = FIGS.FIG[id]; if (!F) return '';
    const anim = opt.animate && !reduceMotion();
    return FIGS.figureSVG(id, { animate: anim, pose: F.key || 0, uid: 'f' + (++figUid), cls: opt.cls, label: (STR.EX[id] || {}).name || id });
  }
  const fmtSec = s => s >= 60 ? Math.floor(s / 60) + ' min' + (s % 60 ? ' ' + String(s % 60).padStart(2, '0') : '') : s + ' s';
  const minTxt = sec => '≈ ' + Math.max(1, Math.round(sec / 60)) + ' min';
  // « 1:30 », « 1'30 », « 90 », « 1 min 30 » → secondes
  function parseSec(v) {
    const t = String(v).trim().replace(',', '.');
    let m = t.match(/^(\d+)\s*(?::|'|min)\s*(\d{1,2})?\s*(?:s|")?$/i);
    if (m) return (+m[1]) * 60 + (+(m[2] || 0));
    m = t.match(/^(\d+(?:\.\d+)?)/); return m ? Math.round(+m[1]) : NaN;
  }

  // ---- circuits : modèles, réglages retenus, circuits perso
  const myCircuits = () => LS.get('circuits', []);
  const prefs = () => LS.get('circuitPrefs', {});
  function circuitById(id) {
    const own = myCircuits().find(c => c.id === id);
    if (own) return Object.assign(STR.normalize(own), { own: true });
    const base = STR.CIRCUITS.find(c => c.id === id) || STR.ROUTINES.find(c => c.id === id); if (!base) return null;
    const p = prefs()[id];
    return Object.assign(STR.normalize(Object.assign({}, base, p || {}, { id: base.id, name: base.name, goal: base.goal, desc: base.desc })), { tuned: !!p });
  }
  function saveCircuit(c) {
    if (c.own) { const all = myCircuits(); const i = all.findIndex(x => x.id === c.id); const o = STR.normalize(c); o.name = c.name; if (i >= 0) all[i] = o; else all.unshift(o); LS.set('circuits', all); return; }
    const base = STR.normalize(STR.CIRCUITS.find(x => x.id === c.id) || STR.ROUTINES.find(x => x.id === c.id));
    const keep = ['order', 'format', 'rounds', 'work', 'rest', 'roundRest', 'ex'];
    const p = prefs(), same = keep.every(k => JSON.stringify(base[k]) === JSON.stringify(c[k]));
    if (same) delete p[c.id]; else p[c.id] = Object.fromEntries(keep.map(k => [k, c[k]]));
    LS.set('circuitPrefs', p); c.tuned = !same;
  }

  // ---- bibliothèque
  function strengthLibrary() {
    const tab = S.strTab || 'circuits';
    let html = `<div class="chips" style="margin:14px 0">${[['circuits', 'Circuits'], ['exos', 'Exercices']].map(([k, l]) => `<button class="chip ${tab === k ? 'on' : ''}" data-act="strTab" data-v="${k}">${l}</button>`).join('')}</div>`;
    if (tab === 'exos') return html + exerciseCatalog();
    html += `<p class="muted small" style="margin:-4px 0 12px">Touche un circuit pour régler les tours ou les séries, le temps d’effort et les récups, puis lance le minuteur guidé. Chaque exercice a son schéma animé.</p>`;
    html += `<div class="btn-row" style="margin-bottom:6px"><button class="btn" data-act="newCircuit">${IC.plus} Créer un circuit</button><button class="btn" data-act="quick" data-v="log-strength">Noter une séance</button></div>`;
    const card = c => {
      const cc = STR.normalize(c), sec = STR.estimate(cc);
      return `<button class="wk str-card" data-act="openCircuit" data-id="${esc(c.id)}"><div class="str-thumbs">${cc.ex.slice(0, 3).map(e => exFig(e.ex)).join('')}</div><div class="meta"><div class="name">${esc(c.name)}${c.tuned ? ' <span class="tag sm">réglé</span>' : ''}</div><div class="sub">${minTxt(sec)} · ${esc(STR.summaryText(cc))}</div><div class="sub ellipsis">${cc.ex.map(e => esc(STR.EX[e.ex].name)).join(', ')}</div></div></button>`;
    };
    const mine = myCircuits().filter(c => c.kind !== 'stretch');
    if (mine.length) html += `<h3 class="str-goal"><span class="sw" style="background:${STR_COL}"></span>Mes circuits</h3>` + mine.map(c => card(c)).join('');
    Object.entries(STR.GOALS).forEach(([g, G]) => {
      const list = STR.CIRCUITS.filter(c => c.goal === g).map(c => circuitById(c.id));
      if (list.length) html += `<h3 class="str-goal"><span class="sw" style="background:${G.color}"></span>${esc(G.name)}</h3>` + list.map(card).join('');

  }
  const EXO_FILTERS = [['all', 'Tous'], ['course', 'Course'], ['vélo', 'Vélo'], ['natation', 'Natation'], ['libre', 'Sans matériel']];
  const ST_FILTERS = [['all', 'Tous'], ['course', 'Course'], ['vélo', 'Vélo'], ['natation', 'Natation'], ['dyn', 'Mobilité (avant)'], ['static', 'Étirements (après)']];
  const exoMatch = (e, f) => f === 'all' || (f === 'libre' ? !e.equip : f === 'dyn' ? e.dyn : f === 'static' ? e.kind === 'stretch' && !e.dyn : e.sports.includes(f));
  function exerciseCatalog() {
    const f = S.exoFilter || 'all';
    const list = STR.EXERCISES.filter(e => exoMatch(e, f));
    return `<div class="chips" style="margin:-4px 0 12px">${EXO_FILTERS.map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="exoFilter" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="exo-grid">${list.map(e => `<button class="exo-card" data-act="openExo" data-id="${e.id}">${exFig(e.id)}<b>${esc(e.name)}</b><span>${esc(e.muscles)}</span></button>`).join('')}</div>`;
  }

  // ---- fiche exercice
  function exerciseHTML(id) {

    const tags = [X.kind === 'stretch' ? (X.dyn ? 'Mobilité, en mouvement' : 'Étirement tenu') : X.type === 'time' ? 'Tenue / chrono' : X.type === 'load' ? 'Avec charge' : 'Répétitions'].concat(X.side ? ['De chaque côté'] : [], X.equip ? ['Matériel : ' + X.equip] : ['Sans matériel']);
    return `<div class="exo-fig">${exFig(id, { animate: true })}</div>

      <div class="chips wrap" style="margin-bottom:10px">${tags.map(t => `<span class="chip static">${esc(t)}</span>`).join('')}</div>
      <h3 style="margin:10px 0 6px">Comment faire</h3><ol class="exo-how">${X.how.map(h => `<li>${esc(h)}</li>`).join('')}</ol>

      ${X.kind === 'stretch' && !X.dyn ? '<p class="small muted" style="margin-top:10px">Étire-toi sans douleur, en respirant calmement : une tension douce suffit. Pas d’à-coups.</p>' : ''}`;

  function openExercise(id) { const st = (STR.EX[id] || {}).kind === 'stretch'; return openSheet(`<span class="tag" style="color:${st ? STRETCH_COL : STR_COL}">${st ? 'Étirements · ' + (STR.EX[id].dyn ? 'mobilité' : 'étirement') : 'Renfo · exercice'}</span>${exerciseHTML(id)}`); }
  function pickExercise(onPick, kind) {
    let f = 'all';
    const src = kind === 'stretch' ? STR.STRETCHES : STR.EXERCISES, FL = kind === 'stretch' ? ST_FILTERS : EXO_FILTERS;
    const grid = () => src.filter(e => exoMatch(e, f))
      .map(e => `<button class="exo-card" data-k="pick" data-id="${e.id}">${exFig(e.id)}<b>${esc(e.name)}</b><span>${esc(e.muscles)}</span></button>`).join('');

  // ---- fiche circuit : réglages
  function stepper(key, label, value, text, hint) {
    return `<div class="str-row"><span class="lbl">${label}${hint ? `<small>${hint}</small>` : ''}</span><div class="stp"><button data-k="dec" data-f="${key}" aria-label="Moins">−</button><input class="stp-in" data-f="${key}" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" value="${esc(text)}" aria-label="${esc(label)}"><button data-k="inc" data-f="${key}" aria-label="Plus">+</button></div></div>`;
  }
  const STEP = { rounds: 1, work: 5, rest: 5, roundRest: 15 };
  function openCircuit(id, opts) {
    opts = opts || {};
    let c = typeof id === 'object' ? id : circuitById(id);
    if (!c) { c = circuitById('habituel'); }
    const isCirc = () => c.order === 'circuit';
    const st = () => c.kind === 'stretch';
    const median = () => { const v = c.ex.map(e => e.sec).sort((a, b) => a - b); return v[Math.floor(v.length / 2)] || 30; };
    const stretchBody = () => {
      const sec = STR.estimate(c), G = STR.STRETCH_GOALS[c.goal] || STR.STRETCH_GOALS.recup;
      return `<span class="tag" style="color:${G.color}">Étirements · ${esc(c.own ? 'ma routine' : G.name)}</span>
        ${c.own ? `<label class="field" style="margin-top:8px"><span>Nom de la routine</span><input type="text" data-f="name" value="${esc(c.name)}"></label>` : `<h2 style="margin-top:8px">${esc(c.name)}</h2>`}
        ${c.desc ? `<p class="muted small">${esc(c.desc)}</p>` : ''}
        <div class="str-total"><b>${minTxt(sec)}</b><span>${c.ex.length} étirement${c.ex.length > 1 ? 's' : ''} · ${esc(STR.summaryText(c))}</span></div>
        <div class="str-set">
          ${stepper('rounds', 'Passages', c.rounds, String(c.rounds), 'toute la routine, une ou plusieurs fois')}
          ${stepper('hold', 'Tenue', median(), fmtSec(median()), '− / + : tous les étirements ; ou ajuste-les un par un')}
          ${stepper('rest', 'Transition', c.rest, c.rest ? fmtSec(c.rest) : 'aucune', 'pour changer de position')}
          ${c.rounds > 1 ? stepper('roundRest', 'Pause entre passages', c.roundRest, c.roundRest ? fmtSec(c.roundRest) : 'aucune') : ''}
        </div>
        <h3 style="margin:16px 0 6px">Étirements</h3>
        <div class="str-list">${rows() || '<div class="card muted small">Ajoute au moins un étirement.</div>'}</div>
        <button class="btn block" style="margin-top:8px" data-k="add">${IC.plus} Ajouter un étirement</button>
        <div class="btn-row" style="margin:16px 0 6px"><button class="btn primary" data-k="start" ${c.ex.length ? '' : 'disabled'}>${IC.play} Démarrer</button><button class="btn" data-k="log" ${c.ex.length ? '' : 'disabled'}>Noter sans minuteur</button></div>
        <div class="btn-row">${c.own ? '<button class="btn sm danger" data-k="delc">Supprimer cette routine</button>' : `<button class="btn sm" data-k="copy">Copier dans « Mes routines »</button>${c.tuned ? '<button class="btn sm" data-k="reset">Revenir à la routine d’origine</button>' : ''}`}</div>
        ${!c.own && c.tuned ? '<p class="small muted" style="margin-top:6px">Tes réglages de cette routine sont retenus pour la prochaine fois.</p>' : ''}`;
    };
    const rows = () => c.ex.map((e, i) => {
      const X = STR.EX[e.ex];
      const val = `<div class="stp sm"><button data-k="dec" data-f="sec" data-i="${i}" aria-label="Moins">−</button><input class="stp-in" data-f="sec" data-i="${i}" type="text" inputmode="numeric" value="${fmtSec(e.sec)}" aria-label="Durée"><button data-k="inc" data-f="sec" data-i="${i}" aria-label="Plus">+</button></div>${X.side ? '<small class="str-u">par côté</small>' : ''}`;
      return `<div class="str-ex"><button class="str-th" data-k="info" data-id="${e.ex}" aria-label="Voir ${esc(X.name)}">${exFig(e.ex)}</button>
        <div class="str-nm"><button class="linkbtn" data-k="info" data-id="${e.ex}"><b>${esc(X.name)}</b></button><span>${esc(X.muscles)}</span>
          <span class="str-ops"><button data-k="up" data-i="${i}" ${i ? '' : 'disabled'} aria-label="Monter">↑</button><button data-k="down" data-i="${i}" ${i < c.ex.length - 1 ? '' : 'disabled'} aria-label="Descendre">↓</button><button data-k="del" data-i="${i}" aria-label="Retirer">✕</button></span></div>
        <div class="str-val">${val}</div></div>`;
    }).join('');
    const body = () => {
      if (st()) return stretchBody();
      const sec = STR.estimate(c), G = STR.GOALS[c.goal] || STR.GOALS.general;
      const labels = isCirc() ? { rounds: 'Tours', rest: 'Récup entre exercices', roundRest: 'Récup entre tours' } : { rounds: 'Séries', rest: 'Récup entre séries', roundRest: 'Récup entre exercices' };
      return `<span class="tag" style="color:${G.color}">Renfo · ${esc(c.own ? 'mon circuit' : G.name)}</span>
        ${c.own ? `<label class="field" style="margin-top:8px"><span>Nom du circuit</span><input type="text" data-f="name" value="${esc(c.name)}"></label>` : `<h2 style="margin-top:8px">${esc(c.name)}</h2>`}
        ${c.desc ? `<p class="muted small">${esc(c.desc)}</p>` : ''}
        <div class="str-total"><b>${minTxt(sec)}</b><span>${c.ex.length} exercice${c.ex.length > 1 ? 's' : ''} · ${esc(STR.summaryText(c))}</span></div>
        <div class="str-set">
          <div class="seg sm" role="tablist"><button class="${isCirc() ? 'on' : ''}" data-k="order" data-v="circuit">En circuit</button><button class="${!isCirc() ? 'on' : ''}" data-k="order" data-v="series">Série par série</button></div>
          <p class="small muted" style="margin:6px 2px 10px">${isCirc() ? 'Tous les exercices à la suite, puis on recommence pour le tour suivant.' : 'Toutes les séries d’un exercice avant de passer au suivant.'}</p>
          <div class="seg sm" role="tablist"><button class="${c.format === 'reps' ? 'on' : ''}" data-k="format" data-v="reps">Répétitions</button><button class="${c.format === 'temps' ? 'on' : ''}" data-k="format" data-v="temps">Au temps</button></div>
