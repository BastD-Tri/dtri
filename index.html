          ${stepper('rest', labels.rest, c.rest, c.rest ? fmtSec(c.rest) : 'aucune')}
          ${stepper('roundRest', labels.roundRest, c.roundRest, c.roundRest ? fmtSec(c.roundRest) : 'aucune')}
        </div>
        <h3 style="margin:16px 0 6px">Exercices</h3>
        <div class="str-list">${c.ex.map((e, i) => {
          const X = STR.EX[e.ex];

          if (c.format === 'temps') val = `<span class="str-v">${fmtSec(c.work)}${X.side ? '<small>par côté</small>' : ''}</span>`;
          else if (X.type === 'time') val = `<div class="stp sm"><button data-k="dec" data-f="sec" data-i="${i}" aria-label="Moins">−</button><input class="stp-in" data-f="sec" data-i="${i}" type="text" inputmode="numeric" value="${fmtSec(e.sec)}" aria-label="Durée"><button data-k="inc" data-f="sec" data-i="${i}" aria-label="Plus">+</button></div>${X.side ? '<small class="str-u">par côté</small>' : ''}`;
          else val = `<div class="stp sm"><button data-k="dec" data-f="reps" data-i="${i}" aria-label="Moins">−</button><input class="stp-in" data-f="reps" data-i="${i}" type="text" inputmode="numeric" value="${e.reps}" aria-label="Répétitions"><button data-k="inc" data-f="reps" data-i="${i}" aria-label="Plus">+</button></div><small class="str-u">${X.side ? 'rép. par côté' : 'rép.'}</small>${X.type === 'load' ? `<div class="stp sm" style="margin-top:4px"><button data-k="dec" data-f="kg" data-i="${i}" aria-label="Moins lourd">−</button><input class="stp-in" data-f="kg" data-i="${i}" type="text" inputmode="decimal" value="${e.kg ? String(e.kg).replace('.', ',') : '–'}" aria-label="Charge en kg"><button data-k="inc" data-f="kg" data-i="${i}" aria-label="Plus lourd">+</button></div><small class="str-u">kg</small>` : ''}`;
          return `<div class="str-ex"><button class="str-th" data-k="info" data-id="${e.ex}" aria-label="Voir ${esc(X.name)}">${exFig(e.ex)}</button>
            <div class="str-nm"><button class="linkbtn" data-k="info" data-id="${e.ex}"><b>${esc(X.name)}</b></button><span>${esc(X.muscles)}</span>
              <span class="str-ops"><button data-k="up" data-i="${i}" ${i ? '' : 'disabled'} aria-label="Monter">↑</button><button data-k="down" data-i="${i}" ${i < c.ex.length - 1 ? '' : 'disabled'} aria-label="Descendre">↓</button><button data-k="del" data-i="${i}" aria-label="Retirer">✕</button></span></div>
            <div class="str-val">${val}</div></div>`;
        }).join('') || '<div class="card muted small">Ajoute au moins un exercice.</div>'}</div>
        <button class="btn block" style="margin-top:8px" data-k="add">${IC.plus} Ajouter un exercice</button>
        <div class="btn-row" style="margin:16px 0 6px"><button class="btn primary" data-k="start" ${c.ex.length ? '' : 'disabled'}>${IC.play} Démarrer</button><button class="btn" data-k="log" ${c.ex.length ? '' : 'disabled'}>Noter sans minuteur</button></div>
        <div class="btn-row">${c.own ? '<button class="btn sm danger" data-k="delc">Supprimer ce circuit</button>' : `<button class="btn sm" data-k="copy">Copier dans « Mes circuits »</button>${c.tuned ? '<button class="btn sm" data-k="reset">Revenir au circuit d’origine</button>' : ''}`}</div>
        ${!c.own && c.tuned ? '<p class="small muted" style="margin-top:6px">Tes réglages de ce circuit sont retenus pour la prochaine fois.</p>' : ''}`;
    };
    const sh = openSheet(`<div id="cbody">${body()}</div>`);
    const re = () => { saveCircuit(c); $('#cbody', sh).innerHTML = body(); if (S.view === 'library') render(); };
    const bump = (f, i, dir) => {
      if (f === 'hold') { c.ex.forEach(e => { e.sec = Math.max(10, Math.min(600, e.sec + dir * 5)); }); return re(); }
      if (i !== undefined && !isNaN(i)) {
        const e = c.ex[i], X = STR.EX[e.ex];
        if (f === 'reps') e.reps = Math.max(1, Math.min(100, e.reps + dir * (e.reps >= 30 ? 5 : 1)));
        else if (f === 'sec') e.sec = Math.max(5, Math.min(600, e.sec + dir * (e.sec >= 60 ? 15 : 5)));
        else if (f === 'kg') e.kg = Math.max(0, Math.round(((e.kg || 0) + dir * 2.5) * 10) / 10) || undefined;
        void X;
      } else {
        const lim = STR.LIM[f]; c[f] = Math.max(lim[0], Math.min(lim[1], c[f] + dir * STEP[f]));
      }
      re();

    sh.addEventListener('click', e => {
      const b = e.target.closest('[data-k]'); if (!b || b.disabled) return;
      const k = b.dataset.k, i = b.dataset.i !== undefined ? +b.dataset.i : undefined;
      if (k === 'inc' || k === 'dec') bump(b.dataset.f, i, k === 'inc' ? 1 : -1);
      else if (k === 'order' || k === 'format') { c[k] = b.dataset.v; re(); }
      else if (k === 'info') openExercise(b.dataset.id);
      else if (k === 'up' && i > 0) { [c.ex[i - 1], c.ex[i]] = [c.ex[i], c.ex[i - 1]]; re(); }
      else if (k === 'down' && i < c.ex.length - 1) { [c.ex[i + 1], c.ex[i]] = [c.ex[i], c.ex[i + 1]]; re(); }
      else if (k === 'del') { c.ex.splice(i, 1); re(); }
      else if (k === 'add') pickExercise(id => { const n = STR.normalize({ kind: c.kind, ex: [{ ex: id }] }).ex[0]; c.ex.push(n); re(); }, c.kind);
      else if (k === 'start') { closeSheet(); openStrengthPlayer(c, opts); }
      else if (k === 'log') { closeSheet(); openEntry(st() ? 'stretch' : 'strength', null, Object.assign({ name: c.name, minutes: Math.max(1, Math.round(STR.estimate(c) / 60)), planSessionId: opts.planSessionId, date: opts.date }, st() ? { stretch: STR.toSets(c) } : { strength: STR.toSets(c) })); }
      else if (k === 'reset') { const p = prefs(); delete p[c.id]; LS.set('circuitPrefs', p); c = circuitById(c.id); $('#cbody', sh).innerHTML = body(); if (S.view === 'library') render(); toast('Circuit d’origine rétabli'); }
      else if (k === 'copy') {
        const o = Object.assign(STR.normalize(c), { id: 'c' + Date.now(), name: c.name + ' (à moi)', goal: c.goal, desc: c.desc, own: true });
        saveCircuit(o); c = circuitById(o.id); $('#cbody', sh).innerHTML = body(); if (S.view === 'library') render(); toast(st() ? 'Copiée dans « Mes routines » : renomme-la si tu veux' : 'Copié dans « Mes circuits » : renomme-le si tu veux');
      } else if (k === 'delc') {
        ask('Supprimer ce circuit ?', esc(c.name), [{ label: 'Supprimer', value: true, cls: 'danger' }, { label: 'Annuler', value: false }]).then(ok => {
          if (!ok) return; LS.set('circuits', myCircuits().filter(x => x.id !== c.id)); closeSheet(); render(); toast('Circuit supprimé');
        });
      }
    });
    sh.addEventListener('change', e => {
      const t = e.target, f = t.dataset.f; if (!f) return;
      if (f === 'name') { c.name = t.value.trim() || (st() ? 'Ma routine' : 'Mon circuit'); saveCircuit(c); if (S.view === 'library') render(); return; }
      if (f === 'hold') { const v = parseSec(t.value); if (v >= 5) c.ex.forEach(e => { e.sec = Math.min(600, v); }); return re(); }
      const i = t.dataset.i !== undefined ? +t.dataset.i : undefined;
      if (i !== undefined) {
        const e2 = c.ex[i];
        if (f === 'reps') { const v = parseInt(t.value, 10); if (v > 0) e2.reps = Math.min(100, v); }
        else if (f === 'sec') { const v = parseSec(t.value); if (v >= 5) e2.sec = Math.min(600, v); }
        else if (f === 'kg') { const v = parseFloat(String(t.value).replace(',', '.')); e2.kg = v > 0 ? Math.min(300, v) : undefined; }
      } else {
        const v = f === 'rounds' ? parseInt(t.value, 10) : /aucun/i.test(t.value) ? 0 : parseSec(t.value);
        if (!isNaN(v)) { const lim = STR.LIM[f]; c[f] = Math.max(lim[0], Math.min(lim[1], v)); }
      }
      re();
    });
    sh.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('stp-in')) e.target.blur(); });
    return sh;
  }
  function newCircuit(kind) {

      : Object.assign(STR.normalize({ ex: [{ ex: 'squats' }, { ex: 'pompes' }, { ex: 'gainage' }], rounds: 3, rest: 20, roundRest: 60 }), { id: 'c' + Date.now(), name: 'Mon circuit', goal: 'general', desc: '', own: true });
    saveCircuit(c); render();
    return openCircuit(circuitById(c.id));
  }

  const STC_TXT = c => c.kind === 'stretch'

    : `10 s pour te mettre en place, puis l’app enchaîne : bips à 3-2-1, annonces vocales${c.format === 'reps' ? ', et « Fait » quand tes répétitions sont finies' : ''}.`;

  // ---- lecteur guidé
  function openStrengthPlayer(c, opts) {
    opts = opts || {};
    const run = new STR.CircuitRunner(c);
    S.strRun = run;
    let wallStart = 0;
    const el = document.createElement('div');
    const STc = c.kind === 'stretch';
    el.id = 'player'; el.className = 'str' + (STc ? ' stretch' : '');
    el.innerHTML = `
      <div class="p-head"><button class="iconbtn" data-s="close" data-p="close" aria-label="Terminer">${IC.close}</button><div class="title ellipsis">${esc(c.name)}</div><span class="p-elapsed" id="s-el">0:00</span></div>
      <div class="s-prog"><i id="s-bar"></i></div><div class="s-where small muted" id="s-where"></div>
      <div class="s-main">
        <span class="s-phase" id="s-phase"></span>
        <div class="s-name" id="s-name"></div>
        <div class="s-fig" id="s-fig"></div>
        <div class="s-count" id="s-count"></div>
        <div class="s-tip small" id="s-tip"></div>
      </div>
      <div class="s-ctl" id="s-ctl"></div>
      <div class="startcover" id="s-cover"><div class="stack">
        <h2>${esc(c.name)}</h2><p class="muted">${minTxt(STR.estimate(c))} · ${c.ex.length} ${STc ? 'étirements' : 'exercices'} · ${esc(STR.summaryText(c))}</p>
        <div class="str-thumbs big">${c.ex.map(e => exFig(e.ex)).join('')}</div>
        <p class="small muted" style="max-width:300px;margin:0 auto">${STC_TXT(c)}</p>
        <button class="btn primary" data-s="go">${IC.play} C’est parti</button><button class="btn ghost" data-s="cancel">Annuler</button></div></div>`;
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    Hist.push();
    const set = (id, v) => { const e = document.getElementById(id); if (e && e.innerHTML !== v) e.innerHTML = v; };
    const clockTxt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    const where = b => b.kind === 'work' ? (STc ? `${b.rounds > 1 ? `Passage ${b.round}/${b.rounds} · ` : ''}position ${b.i + 1}/${b.n}` : `${c.order === 'circuit' ? 'Tour' : 'Série'} ${b.round}/${b.rounds} · exercice ${b.i + 1}/${b.n}`) : '';
    function controls(b) {
      if (!b) return '';
      const paused = run.state === 'paused';
      const pauseBtn = big => `<button class="btn${big ? ' s-big' : ''}" data-s="pause" aria-label="${paused ? 'Reprendre' : 'Pause'}">${paused ? IC.play : IC.pause}${big ? `<span>${paused ? 'Reprendre' : 'Pause'}</span>` : ''}</button>`;
      const prev = `<button class="btn s-prev" data-s="prev" aria-label="Exercice précédent">${IC.skip}</button>`;
      const end = `<button class="btn" data-s="end" aria-label="Terminer">${IC.more}</button>`;
      if (b.kind === 'work' && !b.dur) return prev + `<button class="btn primary s-big" data-s="next">${IC.check}<span>Fait</span></button>` + pauseBtn(false) + end;
      if (b.kind === 'work') return prev + pauseBtn(true) + `<button class="btn" data-s="next" aria-label="Passer">${IC.skip}</button>` + end;
      return prev + `<button class="btn s-big" data-s="more">+15 s</button>` + pauseBtn(false) + `<button class="btn" data-s="next" aria-label="Passer la récup">${IC.skip}</button>` + end;
    }
    function showBlock(b) {
      el.dataset.kind = b.kind;
      const X = b.ex ? STR.EX[b.ex] : null, nx = b.next ? STR.EX[b.next.ex] : null;
      if (b.kind === 'work') {
        set('s-phase', STc ? (X.dyn || X.kind !== 'stretch' ? 'Mouvement' : 'Étirement') : 'Effort'); set('s-name', esc(X.name) + (b.side ? ` <small>côté ${b.side}</small>` : b.perSide ? ' <small>de chaque côté</small>' : ''));
        set('s-tip', esc(X.tip)); set('s-where', where(b));
        $('#s-fig').innerHTML = exFig(b.ex, { animate: true });
      } else if (b.kind === 'switch') {
        set('s-phase', 'Change de côté'); set('s-name', esc(X.name) + ' <small>côté droit ensuite</small>'); set('s-tip', 'Mets-toi en place de l’autre côté.');
        $('#s-fig').innerHTML = exFig(b.ex, { animate: false });
      } else {
        set('s-phase', b.kind === 'prep' ? 'Prépare-toi' : STc ? (b.long ? 'Fin du passage · pause' : 'Transition') : b.long ? (c.order === 'circuit' ? 'Fin du tour' : 'Exercice suivant') + ' · récup' : 'Récup');
        set('s-name', nx ? `<small>Ensuite</small> ${esc(nx.name)}` : '');
        set('s-tip', nx ? esc((b.next.dur ? fmtSec(b.next.dur) + (b.next.side ? ' côté ' + b.next.side : '') : b.next.reps + (b.next.perSide ? ' par côté' : ' répétitions')) + ' · ' + nx.tip) : '');
        set('s-where', b.next ? where(b.next) : '');
        $('#s-fig').innerHTML = nx ? exFig(b.next.ex, { animate: true }) : '';
      }
      $('#s-ctl').innerHTML = controls(b);
      update();
    }
    function update() {
      const b = run.block; if (!b) return;
      set('s-el', `${W.fmtDur(Math.round(run.elapsed))} / ${minTxt(run.total).replace('≈ ', '')}`);
      $('#s-bar').style.width = (run.progress * 100).toFixed(1) + '%';
      if (b.dur) set('s-count', `<b>${clockTxt(run.left)}</b>`);
      else set('s-count', `<b>${b.reps}</b><span>${b.perSide ? 'répétitions par côté' : 'répétitions'}${b.kg ? ' · ' + String(b.kg).replace('.', ',') + ' kg' : ''}</span>`);
      el.classList.toggle('paused', run.state === 'paused');
    }
    const announce = b => {
      const X = b.ex ? STR.EX[b.ex] : null, nx = b.next ? STR.EX[b.next.ex] : null;
      if (b.kind === 'prep') say('Prépare-toi. Premier exercice : ' + (nx ? nx.name : ''));
      else if (b.kind === 'work') say(X.name + (b.side ? ', côté ' + b.side : '') + ', ' + (b.dur ? fmtSec(b.dur).replace(' s', ' secondes') : b.reps + ' répétitions' + (b.perSide ? ' par côté' : '')) + (STc && X.kind === 'stretch' && !X.dyn ? '. Respire calmement.' : ''));
      else if (b.kind === 'switch') say('Change de côté');
      else if (STc) say((b.long ? 'Fin du passage. ' : '') + (nx ? 'Ensuite, ' + nx.name : ''));
      else say((b.long ? (c.order === 'circuit' ? 'Fin du tour. ' : 'Exercice terminé. ') : '') + 'Récupération, ' + fmtSec(b.dur).replace(' s', ' secondes') + (nx ? '. Ensuite, ' + nx.name : ''));
    };
    run.on('block', b => { vibrate(b.kind === 'work' ? [120, 60, 120] : [80]); beep(b.kind === 'work' ? 1320 : 660, 0.2); announce(b); showBlock(b); });
    run.on('count', n => beep(880, 0.1));
    run.on('half', () => beep(990, 0.08));
    run.on('tick', update);
    run.on('state', () => { const b = run.block; if (b) $('#s-ctl').innerHTML = controls(b); update(); });
    run.on('done', res => { say(STc ? 'Routine terminée. Bravo, prends le temps de bien t’hydrater.' : 'Circuit terminé. Bravo !'); showEnd(res); });
    function cleanup() { run.stop(); keepAwake(false); el.remove(); document.body.style.overflow = ''; S.strRun = null; Hist.pop(1); }
    function showEnd(res) {
      const sets = res.strength.reduce((s, e) => s + e.sets.length, 0);
      el.querySelector('.s-main').innerHTML = `<div class="s-end"><div class="s-phase">Terminé</div><h2>Bravo !</h2>
        <div class="str-total"><b>${W.fmtDur(res.duration, true)}</b><span>${res.strength.length} ${STc ? 'étirements' : 'exercices'} · ${sets} ${STc ? (sets > 1 ? 'tenues' : 'tenue') : 'séries faites'}</span></div>
        <ul class="steps">${res.strength.map(e => `<li><span class="bar" style="background:${STc ? STRETCH_COL : STR_COL}"></span><span class="grow"><b>${esc(STR.EX[e.ex].name)}</b><br><span class="small muted">${e.sets.map(s => s.sec ? s.sec + ' s' : s.reps + (s.kg ? '×' + String(s.kg).replace('.', ',') + ' kg' : '')).join(' · ')}</span></span></li>`).join('')}</ul></div>`;
      set('s-where', ''); $('#s-bar').style.width = '100%';
      $('#s-ctl').innerHTML = `<button class="btn primary" data-s="save">Enregistrer dans le journal</button><button class="btn" data-s="drop">Fermer sans enregistrer</button>`;
      el.dataset.kind = 'end';
    }
    async function save(res) {
      const start = wallStart || Date.now();
      const a = Object.assign({ id: 'str' + start, sport: STc ? 'stretch' : 'strength', source: 'circuit', name: c.name, startTime: start, summary: { duration: Math.max(60, res.duration) }, planSessionId: opts.planSessionId || null }, STc ? { stretch: res.strength } : { strength: res.strength }, { circuit: { id: c.id, order: c.order, format: c.format, rounds: c.rounds, work: c.work, rest: c.rest, roundRest: c.roundRest }, completed: res.complete });
      try { await saveActivity(a); } catch (e) { toast('Impossible d’enregistrer : ' + e.message, true); return; }
      if (a.planSessionId) markPlanDone(a.planSessionId, a.id); else autoLinkPlan(a);
      cleanup(); render(); openActivity(a.id, { fresh: true });
    }
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const k = b.dataset.s;
      if (k === 'go') { wallStart = Date.now(); $('#s-cover').remove(); keepAwake(true); beep(660, 0.1); run.start(); }
      else if (k === 'cancel' || k === 'drop') cleanup();
      else if (k === 'next') run.next();
      else if (k === 'prev') run.prev();
      else if (k === 'more') run.addRest(15);
      else if (k === 'pause') { run.state === 'paused' ? run.resume() : run.pause(); }
      else if (k === 'save') save(run.results());
      else if (k === 'end' || k === 'close') {
        if (run.state === 'idle') return cleanup();
        if (run.state === 'done') return;
        const was = run.state; run.pause();
        const res = run.results(), any = res.strength.length > 0;
        const v = await ask(STc ? 'Terminer la routine ?' : 'Terminer le circuit ?', any ? 'Ce que tu as déjà fait peut être enregistré dans le journal.' : 'Rien n’a encore été fait.', [{ label: any ? 'Enregistrer et terminer' : 'Terminer', value: any ? 'save' : 'drop', cls: 'primary' }, { label: 'Continuer', value: null }].concat(any ? [{ label: 'Abandonner sans enregistrer', value: 'drop' }] : []));
        if (v === 'save') { run.stop(); run.state = 'done'; save(run.results()); }
        else if (v === 'drop') cleanup();
        else if (was === 'running') run.resume();
      }
    });
    return run;
  }

  // ------------------------------------------------------------------ séances du plan
  function planToday() {
    if (!S.plan) return [];
    const out = [];
    S.plan.weeks.forEach(w => w.sessions.forEach(s => { if (sameDay(s.date, Date.now())) out.push(s); }));
    return out;
  }
  function planWeekMinutes(ms) {
    const t = { swim: 0, bike: 0, run: 0, strength: 0, stretch: 0 };
    if (!S.plan) return null;
    const mon = PLAN.mondayOf(ms || Date.now()).getTime();
    const w = S.plan.weeks.find(x => x.start === mon || (mon >= x.start && mon < x.start + 7 * 864e5));
    if (!w) return null;
    w.sessions.forEach(s => { if (t[s.sport] !== undefined) t[s.sport] += (s.minutes || 0) * 60; });
    return t;
  }
  function planSessionWorkout(s) {
    if (s.sport === 'bike') return { id: 'plan-' + s.id, sport: 'bike', name: s.name, cat: s.cat || 'endu', level: P().levels.bike, desc: s.desc, dsl: s.dsl, tree: W.parseWorkout(s.dsl), source: 'plan', test: s.test, planSessionId: s.id };
    return { id: 'plan-' + s.id, sport: s.sport, name: s.name, cat: s.cat || '', level: P().levels[s.sport] || 3, desc: s.desc, dsl: s.dsl, tree: SP.parseWorkout(s.dsl, s.sport), source: 'plan', test: s.test, planSessionId: s.id, date: s.date };
  }
  function sessionCard(s, compact) {
    const col = sportColor(s.sport);
    let btn = '';
    if (!s.done && s.kind !== 'event') {
      if (s.sport === 'bike' && s.kind === 'workout') btn = `<button class="btn primary sm" data-act="planStart" data-id="${s.id}">${IC.play} Démarrer</button>`;

      else if (s.kind === 'strength') btn = `<button class="btn sm" data-act="planStrength" data-id="${s.id}">Commencer</button>`;
      else if (s.kind === 'stretch') btn = `<button class="btn sm" data-act="planStretch" data-id="${s.id}">Commencer</button>`;

    return `<div class="pcard ${s.done ? 'done' : ''}" style="--c:${col}" data-act="planSess" data-id="${s.id}">

  // ------------------------------------------------------------------ accueil
  function ideaWorkout() {
    const p = P(), sp = S.ideaSport, seed = S.ideaSeed;
    const f = fitness();
    const tired = f.tsb < -20;
    const minutes = S.ideaMinutes || (sp === 'bike' ? 60 : 45);
    if (sp === 'bike') { const g = W.generateWorkout({ focus: tired ? 'endu' : 'auto', minutes, level: p.levels.bike, seed }); g.sport = 'bike'; return g; }
    if (sp === 'run') return SP.generateRun({ focus: tired ? 'easy' : 'auto', minutes, level: p.levels.run, seed, runT: p.runT });
    return SP.generateSwim({ focus: tired ? 'tech' : 'auto', minutes, level: p.levels.swim, seed, css: p.css });
  }

        <div class="row between"><div class="chips">${['swim', 'bike', 'run'].map(sp => `<button class="chip ${S.ideaSport === sp ? 'on' : ''}" data-act="ideaSport" data-v="${sp}"><span class="sw" style="background:${sportColor(sp)}"></span>${sportName(sp)}</button>`).join('')}</div></div>
        <div class="chips durchips">${[20, 30, 45, 60, 75, 90].map(m => `<button class="chip ${(S.ideaMinutes || (S.ideaSport === 'bike' ? 60 : 45)) === m ? 'on' : ''}" data-act="ideaMin" data-v="${m}">${m} min</button>`).join('')}</div>

        <div class="row between"><div><b>${esc(w.name)}</b><div class="small muted">${W.fmtDur(st.duration, true)}${w.sport !== 'bike' ? ' · ' + fmtKm(st.distance, w.sport) : ' · ' + r0(st.tss) + ' TSS'}</div></div><button class="btn ghost sm" data-act="ideaAgain">Autre idée</button></div>
        <div class="btn-row"><button class="btn primary" data-act="ideaOpen">${w.sport === 'bike' ? IC.play + ' Démarrer' : 'Voir la séance'}</button></div></div>`;
    }
    html += `</section>`;
    // actions rapides
    html += `<section class="block"><div class="quick">
      <button data-act="quick" data-v="kickr">${sportBadge('bike')}<span>Séance KICKR</span></button>
      <button data-act="quick" data-v="log">${sportBadge('run')}<span>Saisir une activité</span></button>
      <button data-act="quick" data-v="strength">${sportBadge('strength')}<span>Renfo</span></button>
      <button data-act="quick" data-v="stretch">${sportBadge('stretch')}<span>Étirements</span></button>
      <button data-act="quick" data-v="weight"><span class="sbadge" style="--c:#8FA6C4">${IC.scale}</span><span>Poids</span></button>

    </div></section>`;
    // semaine
    const wt = weekTotals(), pw = planWeekMinutes();
    html += `<section class="block"><div class="block-head"><h2>Cette semaine</h2><span class="small muted">${r0(wt.load)} de charge</span></div><div class="card">`;

      html += `<div class="wbar"><span class="lab">${sportName(sp)}</span><div class="track">${plan ? `<i class="plan" style="width:${plan / max * 100}%"></i>` : ''}<i class="done" style="width:${done / max * 100}%;background:${sportColor(sp)}"></i></div><span class="val num">${dur(done)}${plan ? ' / ' + dur(plan) : ''}</span></div>`;

    html += `</div></section>`;
    // forme
    const f = fitness();
    html += `<section class="block"><div class="block-head"><h2>Ma forme</h2><button class="btn ghost sm" data-act="tab" data-v="bilan">Bilan</button></div>
      <div class="form-strip"><div class="stat"><b>${r0(f.last.ctl)}</b><span>Forme (CTL)</span></div><div class="stat"><b>${r0(f.last.atl)}</b><span>Fatigue (ATL)</span></div><div class="stat"><b style="color:${f.tsb < -20 ? 'var(--danger)' : f.tsb > 5 ? 'var(--ok)' : 'var(--text)'}">${f.tsb > 0 ? '+' : ''}${r0(f.tsb)}</b><span>Fraîcheur (TSB)</span></div></div></section>`;
    // dernières activités
    const last = actsSorted().slice(0, 3);

    // home trainer
    html += `<section class="block"><div class="block-head"><h2>Appareils</h2><label class="row small muted" style="gap:8px">Mode démo <span class="switch" style="padding:0;border:0"><input type="checkbox" data-act="demo" ${S.demo ? 'checked' : ''}></span></label></div>
      <div class="card" style="padding:4px 16px">
        <div class="device"><div class="ico">${IC.bike}</div><div class="grow"><div><b id="dv-tr-name">Home trainer</b></div><div class="small muted" id="dv-tr-state">—</div></div><div class="live" id="dv-tr-live"></div><button class="btn sm" id="dv-tr-btn" data-act="connTrainer">Connecter</button></div>
        <div class="device"><div class="ico">${IC.heart}</div><div class="grow"><div><b id="dv-hr-name">Ceinture cardio</b></div><div class="small muted" id="dv-hr-state">—</div></div><div class="live" id="dv-hr-live"></div><button class="btn sm" id="dv-hr-btn" data-act="connHr">Connecter</button></div>
        <div class="device" id="dv-pm"><div class="ico" style="color:${SRC_COL.pedals}">${IC.pedal}</div><div class="grow"><div><b id="dv-pm-name">Pédales Assioma Duo</b></div><div class="small muted" id="dv-pm-state">Facultatif</div></div><div class="live" id="dv-pm-live"></div><button class="btn sm" id="dv-pm-btn" data-act="connPm">Connecter</button></div>
        <div class="device" id="dv-tm"><div class="ico">${IC.tread}</div><div class="grow"><div><b id="dv-tm-name">Tapis de course</b></div><div class="small muted" id="dv-tm-state">Domyos Run 100 et tapis FTMS</div></div><div class="live" id="dv-tm-live"></div><button class="btn sm" id="dv-tm-btn" data-act="connTm">Connecter</button></div>
        <div class="btn-row f-entry"><button class="btn" data-act="freeBike">${IC.bike} Vélo libre</button><button class="btn" data-act="freeTread">${IC.tread} Tapis libre</button><button class="btn" data-act="tmProgs">Programmes du tapis</button></div>
        <div class="device" id="dv-cad" ${S.demo ? 'hidden' : ''}><div class="ico">${IC.cad || IC.bike}</div><div class="grow"><div><b id="dv-cad-name">Capteur de cadence</b></div><div class="small muted" id="dv-cad-state">Facultatif</div></div><div class="live" id="dv-cad-live"></div><button class="btn sm" id="dv-cad-btn" data-act="connCad">Connecter</button></div>
      </div></section>`;
    return html;
  }

  // ------------------------------------------------------------------ journal
  function actMetrics(a) {
    const s = a.summary || {};
    const parts = [W.fmtDur(s.duration || 0, true)];
    if (s.distance && a.sport !== 'strength') parts.push(fmtKm(s.distance, a.sport));
    if (a.sport === 'run' && s.distance > 300) parts.push(SP.fmtPace(s.duration / (s.distance / 1000)) + '/km');
    if (a.sport === 'swim' && s.distance > 50) parts.push(SP.fmtPace(s.duration / (s.distance / 100)) + '/100 m');
    if (a.sport === 'bike' && s.avgP) parts.push(r0(s.avgP) + ' W');
    if (a.sub === 'vtt') parts.push('VTT'); else if (a.sub === 'trail') parts.push('trail');
    if (a.sport === 'strength' && a.strength) parts.push(a.strength.length + ' exercices');
    if (a.sport === 'stretch' && a.stretch) parts.push(a.stretch.length + ' étirements');
    if (s.tss) parts.push(r0(s.tss) + ' de charge');
    return parts.join(' · ');
  }
  function actRow(a) {
    const feel = a.feel ? `<span class="feel f${a.feel}" title="Sensations : ${J.FEEL[a.feel]}"></span>` : '';
    return `<button class="arow" data-act="openAct" data-id="${esc(a.id)}">${sportBadge(a.sport)}<span class="grow"><span class="name ellipsis">${esc(a.name)}</span><span class="small muted">${actMetrics(a)}</span></span>
      <span class="meta">${feel}${a.nutrition && a.nutrition.length ? '<span class="nut" title="Nutrition saisie">●</span>' : ''}${a.stravaId ? '<span class="badge-strava">S</span>' : ''}<span class="small muted">${fmtTime(a.startTime)}</span></span></button>`;
  }
  function viewJournal() {
    let html = topbar('Journal', S.acts.length + ' activités');
    html += `<div class="btn-row" style="margin-bottom:12px"><button class="btn primary" data-act="quick" data-v="log">${IC.plus} Ajouter</button><button class="btn" data-act="quick" data-v="import">${IC.upload} Importer</button>${syncSources(true).length ? `<button class="btn" data-act="syncAll">${IC.sync} Synchroniser</button>` : ''}</div>`;
    html += `<div class="chips" style="margin-bottom:12px">${[['all', 'Tout']].concat(Object.entries(J.SPORTS).map(([k, v]) => [k, v.name])).map(([k, l]) => `<button class="chip ${S.jFilter === k ? 'on' : ''}" data-act="jFilter" data-v="${k}">${k !== 'all' ? `<span class="sw" style="background:${sportColor(k)}"></span>` : ''}${l}</button>`).join('')}</div>`;
    const list = actsSorted().filter(a => S.jFilter === 'all' || a.sport === S.jFilter);
    if (!list.length) return html + `<div class="card stack"><h2>Ton journal est vide</h2><p class="muted">Ajoute une activité à la main, importe un fichier .FIT de Garmin Connect, ou active la synchro Garmin dans ton profil : tes sorties de la montre arriveront toutes seules.</p></div>`;
    let lastDay = '';
    html += '<div class="card" style="padding:2px 14px">';
    list.slice(0, 300).forEach(a => {
      const dk = new Date(a.startTime).toDateString();
      if (dk !== lastDay) {
        const dd = new Date(a.startTime).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        html += `<div class="dayhead">${dd.charAt(0).toUpperCase() + dd.slice(1)}</div>`; lastDay = dk;
      }
      html += actRow(a);
    });
    return html + '</div>';
  }

  // ------------------------------------------------------------------ profil de séance course / natation
  function sportProfileSVG(tree, sport, prof, o) {
    o = o || {};
    const w = 300, h = o.h || 60;
    const st = SP.stats(tree, sport, prof);
    const total = st.duration || 1;
    const top = Math.max(1.15, ...st.flat.map(s => s.frac)) * 1.04;
    let parts = '';
    st.flat.forEach(s => {
      const x = s.start / total * w, sw = Math.max(0.4, s.dur / total * w);
      const hh = Math.max(0.05, s.frac / top) * h;
      parts += `<rect x="${x.toFixed(2)}" y="${(h - hh).toFixed(2)}" width="${(sw + 0.2).toFixed(2)}" height="${hh.toFixed(2)}" fill="${SP.stepColor(s, sport)}"/>`;
    });
    const thr = `<line x1="0" x2="${w}" y1="${(h - h / top).toFixed(1)}" y2="${(h - h / top).toFixed(1)}" stroke="#EEF3FA" stroke-opacity=".35" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
    return `<svg class="profile-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px" role="img" aria-label="Profil de la séance">${parts}${thr}</svg>`;
  }

  // ------------------------------------------------------------------ fiche activité
  async function openActivity(id, opts) {
    opts = opts || {};
    const a = S.acts.find(x => x.id === id);
    if (!a) { toast('Activité introuvable', true); return; }
    const detail = a.hasDetail ? await Store.getSession(id).catch(() => null) : null;
    const p = P(), s = a.summary || {};
    const src = { kickr: 'Home trainer KICKR', treadmill: 'Tapis de course', strava: 'Importée de Strava', garmin: 'Synchronisée depuis Garmin Connect', icu: 'Synchronisée depuis intervals.icu' + (a.icuSource && a.icuSource !== 'UPLOAD' ? ' (' + ({ GARMIN_CONNECT: 'Garmin', FORM: 'FORM' }[a.icuSource] || a.icuSource.toLowerCase()) + ')' : ''), fit: 'Fichier FIT', manual: 'Saisie manuelle' }[a.source] || '';
    const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
    let stats = [stat(W.fmtDur(s.duration || 0, true), 'durée')];
    if (a.sport === 'bike') stats.push(stat(r0(s.avgP) || '–', 'W moy.'), stat(r0(s.np) || '–', 'NP'), stat(s.IF ? fx(s.IF, 2) : '–', 'IF'), stat(s.kj ? r0(s.kj) : '–', 'kJ'));
    if (a.sport === 'run' && s.distance) stats.push(stat(fmtKm(s.distance, 'run'), 'distance'), stat(SP.fmtPace(s.duration / (s.distance / 1000)), 'allure /km'));
    if (a.sport === 'swim' && s.distance) stats.push(stat(r0(s.distance) + ' m', 'distance'), stat(SP.fmtPace(s.duration / (s.distance / 100)), 'allure /100 m'));
    if (a.sport === 'bike' && s.distance) stats.push(stat(fmtKm(s.distance, 'bike'), a.sub === 'indoor' ? 'km virtuels' : 'distance'));
    if (a.sport === 'bike' && s.avgCad) stats.push(stat(r0(s.avgCad), 'rpm moy.'));
    if (s.avgHr) stats.push(stat(r0(s.avgHr) + (s.maxHr ? '/' + s.maxHr : ''), 'FC moy./max'));
    if (s.elevation) stats.push(stat(r0(s.elevation) + ' m', 'dénivelé'));
    stats.push(stat(r0(s.tss), 'charge' + (a.loadMethod ? ' (' + a.loadMethod + ')' : '')), stat(r0(a.kcalOut), 'kcal dépensées'));
    const kickr = a.source === 'kickr' && detail;
    const tread = a.source === 'treadmill' && detail;
    const lapRows = kickr ? detail.laps.map(l => Object.assign(M.lapSummary(detail.samples, l.from, l.to), { label: l.label, intensity: l.intensity, c: l.c })).filter(l => l.n >= 10) : [];
    const cadCell = l => { if (!l.avgCad) return '–'; const v = r0(l.avgCad); if (!l.c) return String(v); const ok = Math.abs(v - l.c) <= 5; return `<b style="color:${ok ? 'var(--ok)' : 'var(--warn, #f2a93b)'}">${v}</b><span class="muted">/${l.c}</span>`; };
    const sh = openSheet(`
      <div class="row" style="gap:10px">${sportBadge(a.sport, 34)}<div class="grow"><div class="small muted">${fmtDate(a.startTime, { weekday: 'long', day: 'numeric', month: 'long' })} · ${fmtTime(a.startTime)}</div><div class="small muted">${src}${a.stravaId ? ' · <span class="badge-strava">Sur Strava</span>' : ''}</div></div></div>
      <h2 style="margin-top:10px">${esc(a.name)}</h2>
      ${a.test ? `<div class="notice" style="margin:12px 0"><b>Résultat du test : FTP ${a.test.ftp} W</b><br><span class="small">${a.test.kind === 'ramp' ? 'Meilleure minute ' + a.test.best1 + ' W × 75 %' : 'Moyenne 20 min ' + a.test.best20 + ' W × 95 %'}. FTP actuelle : ${p.ftp} W.</span>${a.test.ftp !== p.ftp ? `<button class="btn primary block" style="margin-top:10px" data-k="setftp">Utiliser ${a.test.ftp} W comme FTP</button>` : ''}</div>` : ''}
      <div class="statline" style="margin:12px 0">${stats.join('')}</div>
      ${detail && detail.samples && detail.samples.length > 10 ? '<canvas class="chart" id="a-chart" height="140"></canvas>' : ''}
      ${kickr && detail.summary && detail.summary.sources && detail.summary.sources.n ? `<div class="legend"><span><i style="background:#EEF3FA"></i>${detail.powerRef === 'pedals' ? 'Pédales' : 'KICKR'} (référence)</span><span><i style="background:${detail.powerRef === 'pedals' ? SRC_COL.trainer : SRC_COL.pedals}"></i>${detail.powerRef === 'pedals' ? 'KICKR' : 'Pédales'}</span><span><i style="background:#ff5f5f"></i>FC</span><span><i class="dash"></i>cadence</span></div>` : ''}
      ${detail && detail.intensity && Math.abs(detail.intensity - 1) > 0.004 ? `<p class="small muted" style="margin-top:8px">Consignes à ${r0(detail.intensity * 100)} % de la séance prévue (forme du jour).</p>` : ''}
      ${kickr ? sourcesCompareHTML(detail.summary || s, detail) : ''}
      ${a.sport === 'run' && (a.source !== 'treadmill' || a.cat === 'test') && s.distance && s.duration >= 1500 && s.duration <= 2700 ? `<button class="btn ghost sm" data-k="runtest">C’était un test de 30 min ? Mettre à jour mes seuils</button>` : ''}
      ${a.sport === 'strength' ? strengthSummaryHTML(a) : ''}${a.sport === 'stretch' ? stretchSummaryHTML(a) : ''}
      <h3 style="margin:18px 0 8px">Ressenti</h3><div id="a-feel">${feelEditorHTML(a)}</div>
      <h3 style="margin:18px 0 8px">Nutrition pendant la séance</h3><div id="a-nut">${nutritionHTML(a)}</div>
      ${tread ? treadLapsHTML(detail) : ''}
      ${kickr || tread ? `<h3 style="margin:18px 0 8px">Exporter</h3>

      ${AI.available() ? `<button class="btn block" style="margin-top:14px" data-k="ai">${IC.spark} Analyse par l’IA</button><div id="s-ai" class="small" style="margin-top:10px;white-space:pre-wrap"></div>` : ''}

  function drawActivityChart(cv, a, detail) {
    if (!cv) return;
    const { ctx, w, h } = setupCanvas(cv, 140);
    const smp = detail.samples; if (!smp.length) return;
    const t0 = smp[0].t, t1 = smp[smp.length - 1].t || t0 + 1;
    const X = t => (t - t0) / (t1 - t0) * w;
    const speeds = smp.map(s => s.s).filter(v => v > 0);
    const pw = smp.map(s => s.p).filter(v => v > 0);
    const main = pw.length > smp.length * 0.3 ? 'p' : speeds.length ? 's' : null;
    if (main) {
      const vals = smp.map(s => s[main] || 0);
      const mx = Math.max(...vals) * 1.08 || 1;
      ctx.fillStyle = 'rgba(61,156,240,.22)'; ctx.strokeStyle = '#EEF3FA'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, h);
      const sm = 5; for (let i = 0; i < smp.length; i++) { let acc = 0, n = 0; for (let k = Math.max(0, i - sm); k <= Math.min(smp.length - 1, i + sm); k++) { acc += smp[k][main] || 0; n++; } ctx.lineTo(X(smp[i].t), h - acc / n / mx * h); }
      ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
    }
    if (main === 's' && smp.some(s => s.tg)) {
      const mx = Math.max(...smp.map(s => s.s || 0), ...smp.map(s => s.tg || 0)) * 1.08 || 1;
      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,203,47,.9)'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]); let st = false;
      smp.forEach(s => { if (!s.tg) { st = false; return; } const y = h - s.tg / mx * h; if (!st) { ctx.moveTo(X(s.t), y); st = true; } else ctx.lineTo(X(s.t), y); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    if (a.sport === 'bike' && smp.some(s => s.c)) {
      ctx.beginPath(); ctx.strokeStyle = 'rgba(77,208,200,.75)'; ctx.lineWidth = 1; ctx.setLineDash([3, 2]); let st = false;
      smp.forEach((s, i) => { if (i % 3) return; const y = h - Math.min(140, s.c || 0) / 140 * h * 0.95; if (!st) { ctx.moveTo(X(s.t), y); st = true; } else ctx.lineTo(X(s.t), y); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    if (smp.some(s => s.hr)) {
      const hmax = Math.max(P().hrMax || 190, ...smp.map(s => s.hr || 0));
      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,95,95,.95)'; ctx.lineWidth = 1.4; let st = false;
      smp.forEach(s => { if (!s.hr) return; const y = h - s.hr / hmax * h * 0.95; if (!st) { ctx.moveTo(X(s.t), y); st = true; } else ctx.lineTo(X(s.t), y); });
      ctx.stroke();
    }
  }

  function bindFeelNutrition(sh, a, refresh) {

  function drawWeightChart(cv, weights, from, to) {
    if (!cv) return;
    const { ctx, w, h } = setupCanvas(cv, cv.height || 120);
    let tr = J.weightTrend(weights, 7);
    if (from) tr = tr.filter(x => x.t >= from && x.t < to);
    if (tr.length < 1) return;
    const kgs = tr.map(x => x.kg);
    const lo = Math.min(...kgs) - 0.6, hi = Math.max(...kgs) + 0.6;
    const t0 = from || tr[0].t, t1 = to || Math.max(tr[tr.length - 1].t, t0 + 864e5);
    const X = t => (t - t0) / (t1 - t0) * (w - 8) + 4, Y = v => h - 14 - (v - lo) / (hi - lo) * (h - 24);
    ctx.fillStyle = '#8FA6C4'; ctx.font = '11px system-ui';
    ctx.fillText(fx(hi - 0.6, 1) + ' kg', 4, 11); ctx.fillText(fx(lo + 0.6, 1) + ' kg', 4, h - 2);
    ctx.fillStyle = 'rgba(238,243,250,.55)';
    tr.forEach(x => { ctx.beginPath(); ctx.arc(X(x.t), Y(x.kg), 2.5, 0, 7); ctx.fill(); });
    ctx.beginPath(); ctx.strokeStyle = '#FFCB2F'; ctx.lineWidth = 2;
    tr.forEach((x, i) => i ? ctx.lineTo(X(x.t), Y(x.avg)) : ctx.moveTo(X(x.t), Y(x.avg))); ctx.stroke();
  }

  // ------------------------------------------------------------------ synchro automatique : Garmin Connect (API personnelle) et intervals.icu (FORM…)
  const icuImportOn = () => Intervals.isConfigured() && S.settings.icuImport !== false;
  // Strava seulement à la demande : son API exige désormais un abonnement, inutile de la solliciter à chaque ouverture
  const syncSources = manual => [Garmin.isConfigured() && 'garmin', icuImportOn() && 'icu', manual && Strava.hasRead() && 'strava'].filter(Boolean);
  const lastSyncTime = () => Math.max(Garmin.isConfigured() ? Garmin.cfg().lastSync || 0 : 0, icuImportOn() ? Intervals.cfg().lastSync || 0 : 0);
  const ignored = key => (LS.get('syncIgnore', []) || []).includes(key);
  // complète l’activité avec le fichier d’origine (courbes FC, allure, puissance) ; un multisport donne une activité par sport
  async function withFit(meta, bytes) {
    let acts = [];
    try { for (const f of await J.fitsFromBytes(bytes, meta.id + '.fit')) acts.push(...J.activitiesFromFit(f.data, f.name)); } catch (e) { console.warn('FIT', meta.id, e); acts = []; }
    if (!acts.length) return meta.sport === 'multi' || meta.sport === 'skip' ? [] : [meta];
    const tag = a => Object.assign(a, { source: meta.source, garminId: meta.garminId, icuId: meta.icuId, icuSource: meta.icuSource });
    if (acts.length === 1) {
      const a = tag(acts[0]), m = meta.summary, s = a.summary;
      Object.keys(m).forEach(k => { if (!s[k] && m[k]) s[k] = m[k]; });
      const keep = meta.sport !== 'other' && meta.sport !== 'multi';
      return [Object.assign(a, { id: meta.id, name: meta.name, sport: keep ? meta.sport : a.sport, sub: (keep && meta.sub) || a.sub, pool: a.pool || meta.pool })];
    }
    return acts.map((a, k) => Object.assign(tag(a), { id: meta.id + '-' + k, name: meta.name + ' · ' + sportName(a.sport) }));
  }
  async function importFrom(list, kind, res, fetchFile) {
    let maxStart = 0;
    for (const meta of list) {
      maxStart = Math.max(maxStart, meta.startTime);
      const ref = kind === 'garmin' ? meta.garminId : meta.icuId, key = (kind === 'garmin' ? 'g' : 'i') + ref;
      if (ignored(key) || S.acts.some(x => (kind === 'garmin' ? x.garminId : x.icuId) === ref || x.id === meta.id || x.id.startsWith(meta.id + '-'))) continue;
      const d = meta.sport !== 'multi' && findDuplicate(meta);
      if (d) { if (kind === 'garmin' && !d.garminId) { d.garminId = ref; upsertAct(d); res.linked++; } else if (kind === 'icu' && !d.icuId) { d.icuId = ref; upsertAct(d); res.linked++; } continue; }
      const bytes = await fetchFile(meta).catch(() => null);
      for (const a of await withFit(meta, bytes)) {
        if (findDuplicate(a)) continue;
        const detail = a.detail; await saveActivity(a, detail); autoLinkPlan(a); res.added++; res.names.push(a.name);
      }
    }
    return maxStart;
  }
  async function syncGarmin(res, opts) {
    const c = Garmin.cfg();
    const from = opts.days ? Date.now() - opts.days * 864e5 : c.lastStart ? c.lastStart - 864e5 : Date.now() - 30 * 864e5;
    const raw = await Garmin.listActivities(isoDay(from), isoDay(Date.now() + 864e5));
    const list = raw.map(J.fromGarmin).filter(m => m.sport !== 'skip' && Number.isFinite(m.startTime))
      .sort((a, b) => a.startTime - b.startTime || (b.sport === 'multi') - (a.sport === 'multi'));
    const maxStart = await importFrom(list, 'garmin', res, m => Garmin.download(m.garminId));
    const c2 = Garmin.cfg(); c2.lastStart = Math.max(c2.lastStart || 0, maxStart); c2.lastSync = Date.now(); Garmin.save(c2);
  }
  async function syncIcu(res, opts) {
    const c = Intervals.cfg();
    const from = opts.days ? Date.now() - opts.days * 864e5 : c.lastStart ? c.lastStart - 864e5 : Date.now() - 30 * 864e5;
    const raw = await Intervals.listActivities(isoDay(from), isoDay(Date.now() + 864e5));
    res.stubs += raw.filter(a => a && a._note).length;
    const list = raw.map(J.fromIcu).filter(Boolean).sort((a, b) => a.startTime - b.startTime);
    const maxStart = await importFrom(list, 'icu', res, m => Intervals.file(m.icuId));
    const c2 = Intervals.cfg(); c2.lastStart = Math.max(c2.lastStart || 0, maxStart); c2.lastSync = Date.now(); Intervals.save(c2);
  }
  let syncing = null; const shownSyncErr = new Set();
  function syncAll(opts) {
    opts = opts || {};
    if (syncing) return syncing;
    const src = syncSources(!opts.silent);
    if (!src.length) { if (!opts.silent) goProfileCard('garmin-card'); return Promise.resolve(null); }
    if (!opts.silent) toast('Synchronisation…');
    syncing = (async () => {
      const res = { added: 0, linked: 0, stubs: 0, errors: [], names: [] };
      if (src.includes('garmin')) await syncGarmin(res, opts).catch(e => res.errors.push(e.message));
      if (src.includes('icu')) await syncIcu(res, opts).catch(e => res.errors.push(e.message));
      if (src.includes('strava')) await stravaInto(res).catch(e => res.errors.push(e.message));
      LS.set('lastAutoSync', Date.now());
      render();
      const errs = res.errors.filter(m => !opts.silent || !shownSyncErr.has(m));
      errs.forEach(m => shownSyncErr.add(m));
      if (res.added) toast(res.added === 1 ? 'Importée : ' + res.names[0] : res.added + ' activités importées' + (errs.length ? ' · ' + errs.join(' · ') : ''), false);
      else if (errs.length) toast(errs.join(' · '), true);
      else if (!opts.silent) toast('Rien de nouveau' + (res.linked ? ' (' + res.linked + ' reliée(s))' : '') + (res.stubs && !src.includes('garmin') ? ' · ' + res.stubs + ' activité(s) venue(s) de Strava illisible(s) via intervals.icu' : ''));
      return res;
    })().finally(() => { syncing = null; });
    return syncing;
  }
  // à l’ouverture et au retour dans l’app, au plus toutes les 15 minutes, jamais pendant une séance
  function autoSync() {
    if (PREVIEW || S.settings.autoSync === false || !syncSources().length || document.getElementById('player')) return;
    if (Date.now() - (LS.get('lastAutoSync', 0) || 0) < 15 * 60000) return;
    LS.set('lastAutoSync', Date.now());
    syncAll({ silent: true });
  }
  function findDuplicate(a) {
    return S.acts.find(x => (a.stravaId && x.stravaId === a.stravaId) || x.id === a.id || (x.sport === a.sport && Math.abs(x.startTime - a.startTime) < 3 * 60000));
  }
  async function stravaInto(res) {
    const c = Strava.cfg();
    const after = c.lastStart ? c.lastStart / 1000 - 3600 : Date.now() / 1000 - 90 * 86400;
    const list = await Strava.listActivities(after);
    let maxStart = c.lastStart || 0;
    for (const raw of list) {
      const a = J.fromStrava(raw);
      maxStart = Math.max(maxStart, a.startTime);
      const d = findDuplicate(a);
      if (d) { if (!d.stravaId) { d.stravaId = a.stravaId; upsertAct(d); res.linked++; } continue; }
      await saveActivity(a); autoLinkPlan(a); res.added++; res.names.push(a.name);
    }
    const c2 = Strava.cfg(); c2.lastStart = maxStart; c2.lastSync = Date.now(); Strava.save(c2);
  }
  async function syncStrava() {
    if (!Strava.hasRead()) { toast('Reconnecte Strava pour autoriser la lecture des activités', true); return; }
    toast('Synchronisation Strava…');
    const res = { added: 0, linked: 0, names: [] };
    try {
      await stravaInto(res);

  }

    const cats = sp === 'bike' ? W.CATS : sp === 'run' ? SP.RUN_CATS : SP.SWIM_CATS;
    const chips = [['all', 'Toutes'], ['fav', 'Favoris'], ['mine', 'Mes séances']].concat(Object.entries(cats).map(([k, v]) => [k, v.name]));
    html += `<div class="chips" style="margin:14px 0">${chips.map(([k, l]) => `<button class="chip ${S.libCat === k ? 'on' : ''}" data-act="libcat" data-v="${k}">${cats[k] ? `<span class="sw" style="background:${cats[k].color}"></span>` : ''}${l}</button>`).join('')}</div>`;
    const tapis = sp === 'run' && S.libCat === 'tapis';
    if (!tapis) html += `<div class="small muted" style="margin:-4px 0 6px">Temps dont je dispose</div><div class="chips durchips" style="margin-bottom:14px"><button class="chip ${!S.libMinutes ? 'on' : ''}" data-act="libMin" data-v="0">Durée d’origine</button>${[30, 45, 60, 75, 90].map(m => `<button class="chip ${S.libMinutes === m ? 'on' : ''}" data-act="libMin" data-v="${m}">${m} min</button>`).join('')}</div>`;
    html += `<div class="btn-row" style="margin-bottom:16px">${sp === 'bike' ? `<button class="btn" data-act="freeBike">${IC.bike} Séance libre</button>` : sp === 'run' ? `<button class="btn" data-act="freeTread">${IC.tread} Tapis libre</button>` : ''}<button class="btn" data-act="builder">Créer une séance</button><button class="btn" data-act="surpriseSheet">${IC.spark} Surprise</button>${AI.available() ? `<button class="btn" data-act="aiWorkout">${IC.spark} IA</button>` : ''}</div>`;
    if (tapis) return html + treadSection(p);
    let list = sp === 'bike' ? allWorkouts() : sportWorkouts(sp);
    if (S.libCat === 'fav') list = list.filter(w => S.favs.includes(w.id));
    else if (S.libCat === 'mine') list = list.filter(w => w.source !== 'lib');
    else if (S.libCat !== 'all') list = list.filter(w => w.cat === S.libCat);
    else if (sp === 'run') { list = list.filter(w => w.cat !== 'tapis'); html += treadTeaser(p); }
    if (!list.length) html += `<div class="card muted">${S.libCat === 'fav' ? 'Touche l’étoile d’une séance pour la retrouver ici.' : 'Aucune séance ici pour l’instant. Crée la tienne ou génère une séance surprise.'}</div>`;
    const lvl = p.levels[sp] || 3;
    list = list.slice().sort((a, b) => Math.abs(a.level - lvl) - Math.abs(b.level - lvl));
    const fit = w => {
      if (!S.libMinutes || w.cat === 'test' || w.test || w.cat === 'tapis') return w;
      const r = adapted(w, sp === 'bike' && S.settings.scaleToLevel && w.source === 'lib' && w.level !== p.level ? W.scaleForLevel(w.tree, w.level, p.level) : w.tree, S.libMinutes, sp);
      return Object.assign({}, w, { tree: r.tree, name: r.name });
    };
    html += list.map(w0 => {
      const w = fit(w0);
      if (sp === 'bike') {
        const st = W.workoutStats(w.tree, p.ftp);
        return `<button class="wk" data-act="openW" data-id="${esc(w.id)}"><div class="prof">${profileSVG(w.tree, p.ftp, { h: 46 })}</div><div class="meta"><div class="name">${esc(w.name)}</div><div class="sub">${W.fmtDur(st.duration, true)} · ${r0(st.tss)} TSS · ${levelDots(w.level)} ${S.favs.includes(w.id) ? '★' : ''}</div></div></button>`;
      }
      const st = SP.stats(w.tree, sp, p);
      return `<button class="wk" data-act="openW" data-id="${esc(w.id)}"><div class="prof">${sportProfileSVG(w.tree, sp, p, { h: 46 })}</div><div class="meta"><div class="name">${esc(w.name)}</div><div class="sub">${W.fmtDur(st.duration, true)} · ${fmtKm(st.distance, sp)} · ${levelDots(w.level)} ${S.favs.includes(w.id) ? '★' : ''}</div></div></button>`;
    }).join('');
    return html;
  }

  // ------------------------------------------------------------------ programmes intégrés du tapis
  const kmhTxt = v => SP.fmtKmh(v) + ' km/h';
  function treadCard(w, p) {
    const st = SP.stats(w.tree, 'run', p);
    return `<button class="wk" data-act="openW" data-id="${esc(w.id)}"><div class="prof">${sportProfileSVG(w.tree, 'run', p, { h: 46 })}</div><div class="meta"><div class="name">${esc(w.name)}</div><div class="sub">${w.minutes} min · ${fmtKm(st.distance, 'run')} · max ${kmhTxt(w.vmax)} · ${levelDots(w.level)} ${S.favs.includes(w.id) ? '★' : ''}</div></div></button>`;
  }
  function treadSection(p) {
    let html = `<p class="muted small" style="margin:-4px 0 4px">Les 30 programmes intégrés de ton tapis, relevés sur les graphiques du manuel. Avec « Sur le tapis », l’appli règle la vitesse minute par minute et applique ta forme du jour.</p>`;
    html += `<div class="btn-row" style="margin:10px 0 4px">${Object.entries(SP.TREAD_FAMS).map(([k, F]) => `<button class="btn sm" data-act="tmJump" data-v="${k}">${esc(F.name)}</button>`).join('')}</div>`;
    Object.entries(SP.TREAD_FAMS).forEach(([k, F]) => {
      const progs = SP.TREAD_LIB.filter(w => w.fam === k);
      html += `<h3 class="tm-fam" id="tm-${k}">${esc(F.full)}</h3><p class="muted small" style="margin:0 0 8px">${esc(F.desc)} ${progs[0].minutes} à ${progs[progs.length - 1].minutes > progs[0].minutes ? Math.max(...progs.map(w => w.minutes)) : progs[0].minutes} min.</p>`;
      html += progs.map(w => treadCard(w, p)).join('');
    });
    return html;
  }
  function treadTeaser(p) {
    const demo = SP.TREAD_LIB.find(w => w.id === 'tm_frac5') || SP.TREAD_LIB[0];
    return `<button class="wk tm-teaser" data-act="libcat" data-v="tapis"><div class="prof">${sportProfileSVG(demo.tree, 'run', p, { h: 46 })}</div><div class="meta"><div class="name">${IC.tread} Programmes du tapis</div><div class="sub">30 programmes : Calories, Fractionné, Endurance</div></div></button>`;
  }

  // ------------------------------------------------------------------ fiche séance course / natation
  function sportStepsHTML(tree, sport, prof) {
    const line = n => {
      const r = SP.paceRange(n, sport, prof);
      const amount = n.dist !== undefined ? fmtKm(n.dist, sport === 'swim' ? 'swim' : (n.dist < 1000 ? 'swim' : 'run')) : W.fmtDur(n.d, true);
      let tgt;
      if (sport === 'run' && n.k === 'kmh') tgt = `<b>${kmhTxt(n.v)}</b> <span class="muted">${SP.fmtPace(3600 / n.v)} /km · ${SP.stepName(n, sport, prof)}</span>`;
      else if (sport === 'run') tgt = n.k === 'hr' ? `zone ${n.z} FC <span class="muted">(${SP.hrRange(n.z, prof).join('–')} bpm)</span>` : n.k === 'open' || n.k === 'marche' ? SP.stepName(n, sport) : `${SP.fmtPace(r[0])}–${SP.fmtPace(r[1])} /km <span class="muted">${n.k === 'pace' ? '' : SP.RUN_T[n.k].name}</span>`;
      else tgt = `${SP.stepName(n, sport)} <span class="muted">${SP.fmtPace(r[0])}–${SP.fmtPace(r[1])} /100 m</span>`;
      return `<li><span class="bar" style="background:${SP.stepColor(n, sport)}"></span><span class="grow">${amount} · ${tgt}${n.rest ? ` <span class="tag">repos ${n.rest} s</span>` : ''}</span><span class="muted small ellipsis" style="max-width:38%">${esc(n.l || '')}</span></li>`;
    };
    const walk = (nodes, depth) => nodes.map(n => n.t === 'r'
      ? `<li class="rep" style="padding-left:${depth * 14}px">${n.n} ×</li>` + walk(n.k, depth + 1).replace(/<li>/g, `<li style="padding-left:${(depth + 1) * 14}px">`)
      : line(n)).join('');
    return `<ul class="steps">${walk(tree, 0)}</ul>`;
  }

  function openSportWorkout(w0, opts) {
    opts = opts || {};
    const p = P(), sport = w0.sport;
    const cats = sport === 'run' ? SP.RUN_CATS : SP.SWIM_CATS;
    const fixed = w0.cat === 'tapis' ? 'tapis' : (w0.cat === 'test' || !!w0.test);
    let minutes = fixed ? 0 : (opts.minutes !== undefined ? opts.minutes : (S.libMinutes || 0));
    let r = null;
    // la séance réellement proposée (adaptée au temps disponible)
    const cur = () => { r = adapted(w0, w0.tree, minutes, sport); return Object.assign({}, w0, { tree: r.tree, name: r.name }); };
    let w = cur();
    const body = () => {
      const st = SP.stats(w.tree, sport, p);
      return `<div class="row between"><span class="tag" style="color:${sportColor(sport)}">${sportName(sport)}${cats[w.cat] ? ' · ' + cats[w.cat].name : ''}</span>${levelDots(w.level || 3)}</div>
        <h2 style="margin-top:10px">${esc(w.name)}</h2><p class="muted small">${esc(w.desc || '')}</p>
        <div style="margin:12px 0">${sportProfileSVG(w.tree, sport, p, { h: 90 })}</div>
        <div class="statline" style="margin-bottom:6px"><div class="stat"><b>${W.fmtDur(st.duration, true)}</b><span>durée</span></div><div class="stat"><b>${fmtKm(st.distance, sport)}</b><span>distance</span></div><div class="stat"><b>${r0(st.load)}</b><span>charge</span></div></div>
        ${durationChips(minutes, SP.stats(w0.tree, sport, p).duration, fixed)}${adaptNotice(r, minutes)}
        ${sport === 'run' ? `<div class="small muted" style="margin:10px 0 6px">Cibles sur la montre</div><div class="chips"><button class="chip ${S.settings.runTarget !== 'hr' ? 'on' : ''}" data-k="tgt" data-v="pace">Allure</button><button class="chip ${S.settings.runTarget === 'hr' ? 'on' : ''}" data-k="tgt" data-v="hr">Fréquence cardiaque</button></div>` : ''}
        <div class="btn-row" style="margin:16px 0 8px">
          ${sport === 'run' ? (dev.tm && dev.tm.state === 'connected' ? `<button class="btn primary" data-k="tread">${IC.tread} Sur le tapis</button><button class="btn" data-k="watch">${IC.watch} Montre</button>` : `<button class="btn primary" data-k="watch">${IC.watch} Envoyer à ma montre</button><button class="btn" data-k="tread">${IC.tread} Sur le tapis</button>`) : `<button class="btn primary" data-k="sheet">Fiche piscine</button><button class="btn" data-k="watch">${IC.watch} Montre</button>`}
          <button class="btn" data-k="fav" aria-label="Favori">${S.favs.includes(w0.id) ? IC.starOn : IC.star}</button></div>
        <div class="btn-row"><button class="btn sm" data-k="fit">Fichier .FIT (USB)</button><button class="btn sm" data-k="copy">Copier le texte</button><button class="btn sm" data-k="log">Saisir comme faite</button><button class="btn sm" data-k="edit">Modifier</button>${(w0.source === 'gen' || w0.source === 'ai' || r.changed) && !S.custom.some(c => c.id === w0.id && !r.changed) ? '<button class="btn sm" data-k="save">Enregistrer</button>' : ''}</div>
        <h3 style="margin:16px 0 6px">Déroulé</h3>${sportStepsHTML(w.tree, sport, p)}
        ${w0.source === 'custom' || (w0.source === 'ai' && S.custom.some(c => c.id === w0.id)) ? '<button class="btn danger block" style="margin-top:14px" data-k="del">Supprimer cette séance</button>' : ''}`;
    };
    const sh = openSheet(`<div id="sw-body">${body()}</div>`);
    const re = () => { $('#sw-body', sh).innerHTML = body(); };
    sh.addEventListener('click', async e => {
      const b = e.target.closest('[data-k]'); if (!b) return;
      const k = b.dataset.k;
      if (k === 'tgt') { S.settings.runTarget = b.dataset.v; saveSettings(); re(); }
      else if (k === 'dur') { minutes = +b.dataset.v; w = cur(); re(); }
      else if (k === 'watch') sendToWatch(w, opts.date || w.date);
      else if (k === 'tread') { closeSheet(); startTreadRun(w, { planSessionId: opts.planSessionId || w.planSessionId }); }
      else if (k === 'sheet') openPoolSheet(w);
      else if (k === 'fit') { download(SP.buildWorkoutFit(w.tree, sport, p, w.name, S.settings.runTarget), slug(w.name) + '.fit', 'application/vnd.ant.fit'); toast('Copie ce fichier dans GARMIN/NewFiles de ta montre (câble USB)'); }
      else if (k === 'copy') copyText(w.name + '\n' + SP.toText(w.tree, sport, p));
      else if (k === 'log') { closeSheet(); const st = SP.stats(w.tree, sport, p); openEntry(sport, null, { name: w.name, minutes: Math.round(st.duration / 60), planSessionId: opts.planSessionId || w.planSessionId, date: opts.date || w.date }); }
      else if (k === 'fav') { S.favs = S.favs.includes(w0.id) ? S.favs.filter(x => x !== w0.id) : S.favs.concat(w0.id); LS.set('favs', S.favs); re(); if (S.view === 'library') render(); }
      else if (k === 'edit') { closeSheet(); openSportBuilder(sport, w); }
      else if (k === 'save') { saveSportCustom(r.changed ? Object.assign({}, w, { id: 'custom-' + sport + '-' + Date.now(), source: 'gen' }) : w); toast('Séance enregistrée dans « Mes séances »'); re(); }
      else if (k === 'del') { S.custom = S.custom.filter(c => c.id !== w0.id); LS.set('custom', S.custom); closeSheet(); render(); toast('Séance supprimée'); }
    });
    return sh;
  }
  const slug = s => String(s || 'seance').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').slice(0, 40);
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); toast('Texte copié'); }
    catch (e) { openSheet(`<h2>Texte de la séance</h2><textarea style="min-height:220px" readonly>${esc(t)}</textarea>`); }
  }
  function saveSportCustom(w) {
    const c = { id: w.id, sport: w.sport, name: w.name, cat: w.cat || '', level: w.level || 3, desc: w.desc || '', dsl: SP.toDSL(w.tree, w.sport), source: w.source === 'ai' ? 'ai' : 'custom' };
    S.custom = S.custom.filter(x => x.id !== c.id).concat(c); LS.set('custom', S.custom);
  }

  // fiche piscine : grand texte contrasté, à lire au bord du bassin ou à photographier avec l'app FORM
  function openPoolSheet(w) {
    const p = P();
    const text = SP.toText(w.tree, 'swim', p);
    const st = SP.stats(w.tree, 'swim', p);
    const sh = openSheet(`<div class="poolsheet"><div class="ps-head"><b>${esc(w.name)}</b><span>${fmtKm(st.distance, 'swim')} · ${W.fmtDur(st.duration, true)} · CSS ${SP.fmtPace(p.css)}/100 m</span></div><pre>${esc(text)}</pre></div>
      <p class="small muted" style="margin-top:10px">Pour tes lunettes FORM : dans l’app FORM, crée une séance à partir d’une photo et photographie cette fiche, ou copie le texte dans la description d’une séance TrainingPeaks.</p>
      <div class="btn-row"><button class="btn" data-k="copy">Copier le texte</button></div>`);
    sh.addEventListener('click', e => { if (e.target.closest('[data-k="copy"]')) copyText(w.name + '\n' + text); });
  }

  // envoi vers la montre : intervals.icu pousse la séance dans le calendrier Garmin Connect, puis sur la Forerunner
  async function sendToWatch(w, date) {
    const p = P(), sport = w.sport || 'bike';
    if (!Intervals.isConfigured()) {
      const v = await ask('Envoyer à ta Forerunner', 'Garmin ne laisse pas une app perso envoyer des séances. Le plus simple : connecte intervals.icu (gratuit) dans ton profil, une seule fois ; il transmet ensuite les séances à Garmin Connect et à ta montre. Sinon, télécharge le fichier .FIT et copie-le par câble USB dans le dossier GARMIN/NewFiles.', [
        { label: 'Configurer intervals.icu', value: 'cfg', cls: 'primary' }, { label: 'Télécharger le .FIT', value: 'fit' }, { label: 'Annuler', value: null }]);
      if (v === 'cfg') { closeAllSheets(); S.view = 'profile'; render(); setTimeout(() => { const el = document.getElementById('icu-card'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 100); }
      else if (v === 'fit' && sport !== 'bike') download(SP.buildWorkoutFit(w.tree, sport, p, w.name, S.settings.runTarget), slug(w.name) + '.fit', 'application/vnd.ant.fit');
      return;
    }
    const d = await pickDate('Pour quel jour ?', date || Date.now());
    if (!d) return;
    try {
      await Intervals.push([workoutEvent(w, d)]);
      toast('Envoyée. Synchronise l’app Garmin Connect : la séance arrive sur ta montre.');
    } catch (e) { toast(e.message + ' (vérifie ta clé intervals.icu)', true); }
  }
  function workoutEvent(w, dateMs) {
    const p = P(), sport = w.sport || 'bike';
    const desc = sport === 'bike' ? SP.bikeToIntervals(w.tree) : SP.toIntervals(w.tree, sport, p, S.settings.runTarget === 'hr' ? 'hr' : 'pace');
    return { category: 'WORKOUT', start_date_local: isoDay(dateMs) + 'T00:00:00', type: { run: 'Run', swim: 'Swim', bike: 'Ride' }[sport], name: w.name, description: desc, external_id: 'd6-' + (w.planSessionId || w.id) + '-' + isoDay(dateMs) };
  }
  function pickDate(title, def) {
    return new Promise(resolve => {
      const sh = openSheet(`<h2>${esc(title)}</h2><label class="field" style="margin-top:12px"><span>Date</span><input type="date" id="pd" value="${isoDay(def)}"></label><button class="btn primary block" id="pd-ok">Valider</button>`);
      $('#pd-ok', sh).addEventListener('click', () => { const [y, m, d] = $('#pd', sh).value.split('-').map(Number); closeSheet(); resolve(y ? new Date(y, m - 1, d, 12).getTime() : null); });
    });
  }

  // ------------------------------------------------------------------ créer / modifier une séance course ou natation
  function openSportBuilder(sport, src) {
    const p = P();
    const isOwn = src && src.source === 'custom';
    const cats = sport === 'run' ? SP.RUN_CATS : SP.SWIM_CATS;
    const example = sport === 'run' ? '15min@E "Échauffement", 5x(1km@I, 2min@trot), 10min@E "Retour au calme"' : '400m@souple "Échauffement", 8x(100m@css r15s), 4x(50m@educ r20s "Rattrapé"), 200m@souple';
    const help = sport === 'run'
      ? 'Étape : <code>durée ou distance@cible</code>. Durées : <code>10min</code>, <code>45s</code>, <code>1h15</code>. Distances : <code>400m</code>, <code>1.5km</code>.<br>Cibles : <code>trot</code>, <code>E</code> endurance, <code>M</code> marathon, <code>T</code> seuil, <code>I</code> VO2max, <code>R</code> vitesse, <code>z1</code> à <code>z5</code> (FC), une allure <code>4:30</code> / <code>4:20-4:35</code>, ou une vitesse <code>10.5kmh</code> (avec un point).<br>Répétition : <code>6x(800m@I, 2min@trot)</code>.'
      : 'Étape : <code>distance@cible</code>, ex. <code>100m@css</code>. Repos après chaque répétition : <code>r15s</code>.<br>Cibles : <code>educ</code>, <code>souple</code>, <code>end</code>, <code>tempo</code>, <code>css</code>, <code>css+3</code>, <code>vite</code>, <code>sprint</code>, ou une allure <code>1:45</code> par 100 m.<br>Répétition : <code>8x(100m@css r15s)</code>, libellé entre guillemets.';
    const sh = openSheet(`<h2>${src ? (isOwn ? 'Modifier la séance' : 'Nouvelle séance à partir de « ' + esc(src.name) + ' »') : 'Créer une séance de ' + sportName(sport).toLowerCase()}</h2>
      <label class="field"><span>Nom</span><input type="text" id="b-name" value="${esc(src ? (isOwn ? src.name : src.name + ' (perso)') : '')}"></label>
      <div class="grid2"><label class="field"><span>Catégorie</span><select id="b-cat">${Object.entries(cats).map(([k, v]) => `<option value="${k}" ${src && src.cat === k ? 'selected' : ''}>${v.name}</option>`).join('')}</select></label>
      <label class="field"><span>Niveau</span><select id="b-lvl">${[1, 2, 3, 4, 5].map(l => `<option value="${l}" ${(src ? src.level : p.levels[sport]) === l ? 'selected' : ''}>${l} · ${W.LEVELS[l]}</option>`).join('')}</select></label></div>
      <label class="field"><span>Structure</span><textarea id="b-dsl" spellcheck="false" autocapitalize="off">${esc(src ? SP.toDSL(src.tree, sport) : example)}</textarea></label>
      <div id="b-prev"></div>
      <details class="small muted" style="margin:8px 0 14px"><summary>Aide sur la syntaxe</summary><p style="margin-top:8px">${help}</p></details>
      <button class="btn primary block" id="b-save">Enregistrer</button>`);
    const prev = () => {
      try {
        const tree = SP.parseWorkout($('#b-dsl', sh).value, sport);
        const st = SP.stats(tree, sport, p);
        $('#b-prev', sh).innerHTML = sportProfileSVG(tree, sport, p, { h: 64 }) + `<p class="small muted" style="margin-top:6px">${W.fmtDur(st.duration, true)} · ${fmtKm(st.distance, sport)} · charge ${r0(st.load)}</p>`;
        return tree;
      } catch (e) { $('#b-prev', sh).innerHTML = `<div class="notice err small">${esc(e.message)}</div>`; return null; }
    };
    prev();
    $('#b-dsl', sh).addEventListener('input', prev);
    $('#b-save', sh).addEventListener('click', () => {
      const tree = prev(); if (!tree) return;
      const c = { id: isOwn ? src.id : 'custom-' + sport + '-' + Date.now(), sport, name: $('#b-name', sh).value.trim() || 'Ma séance', cat: $('#b-cat', sh).value, level: +$('#b-lvl', sh).value, desc: isOwn ? src.desc : (src ? 'Variante de « ' + src.name + ' ».' : 'Séance personnalisée.'), dsl: SP.toDSL(tree, sport), source: 'custom' };
      S.custom = S.custom.filter(x => x.id !== c.id).concat(c); LS.set('custom', S.custom);
      closeSheet(); S.view = 'library'; S.libSport = sport; S.libCat = 'mine'; render(); toast('Séance enregistrée');
    });
  }

  function openSportSurprise(sport) {
    const p = P();
    const focuses = sport === 'run' ? { auto: 'Au hasard', easy: 'Footing', long: 'Sortie longue', tempo: 'Seuil', vma: 'VMA', cotes: 'Côtes', trail: 'Trail', trail_long: 'Sortie longue trail', brick: 'Enchaînement' } : { auto: 'Au hasard', tech: 'Technique', end: 'Endurance', css: 'Seuil CSS', vite: 'Vitesse', ow: 'Eau libre' };
    let focus = 'auto', minutes = sport === 'run' ? 45 : 45, seed = Math.floor(Math.random() * 1e6);
    const gen = () => sport === 'run' ? SP.generateRun({ focus, minutes, level: p.levels.run, seed, runT: p.runT }) : SP.generateSwim({ focus, minutes, level: p.levels.swim, seed, css: p.css });
    let w = gen();
    const body = () => {
      const st = SP.stats(w.tree, sport, p);

  const weekActsMin = wk => { const end = wk.start + 7 * 864e5; let t = 0; S.acts.forEach(a => { if (a.startTime >= wk.start && a.startTime < end && ['swim', 'bike', 'run', 'strength'].includes(a.sport)) t += (a.summary && a.summary.duration) || 0; }); return t / 60; };
  // vue d'ensemble : volume prévu par semaine et par sport, phases, semaine en cours, réalisé

  function drawBilanCharts() {
    const { y, m } = S.month;
    const ms = J.monthStats(S.acts, S.weights, y, m, S.products);
    const cv = $('#b-weeks');
    if (cv) {
      const { ctx, w, h } = setupCanvas(cv, 130);
      const n = ms.weeks.length, bw = Math.min(46, w / n * 0.6);
      const tot = ms.weeks.map(x => Object.values(x.load).reduce((a, b) => a + b, 0));
      const mx = Math.max(50, ...tot) * 1.12;
      ctx.font = '11px system-ui'; ctx.textAlign = 'center';
      ms.weeks.forEach((wk, i) => {
        const cx = (i + 0.5) * w / n; let yy = h - 16;
        ['swim', 'bike', 'run', 'strength', 'stretch', 'other'].forEach(sp => {
          const v = wk.load[sp] || 0; if (!v) return;
          const bh = v / mx * (h - 30); ctx.fillStyle = sportColor(sp); ctx.fillRect(cx - bw / 2, yy - bh, bw, bh); yy -= bh;
        });
        ctx.fillStyle = '#8FA6C4'; ctx.fillText(new Date(wk.start).getDate() + '/' + (new Date(wk.start).getMonth() + 1), cx, h - 3);
        if (tot[i]) { ctx.fillStyle = '#EEF3FA'; ctx.fillText(r0(tot[i]), cx, yy - 4); }
      });
    }
    const lc = $('#loadChart');
    if (lc) {
      const { ctx, w, h } = setupCanvas(lc, 140);
      const load = fitness().load;
      const mx = Math.max(30, ...load.map(d => Math.max(d.ctl, d.atl, d.tss * 0.6))) * 1.1;
      const X = i => i / (load.length - 1) * w, Y = v => h - 4 - v / mx * (h - 10);
      ctx.fillStyle = '#27426B';
      load.forEach((d, i) => { if (d.tss) { const bh = Math.min(h - 6, d.tss * 0.6 / mx * (h - 10)); ctx.fillRect(X(i) - 1.5, h - 4 - bh, 3, bh); } });
      [['atl', '#f5862e'], ['ctl', '#3d9cf0']].forEach(([k, c]) => { ctx.beginPath(); ctx.strokeStyle = c; ctx.lineWidth = 2; load.forEach((d, i) => i ? ctx.lineTo(X(i), Y(d[k])) : ctx.moveTo(X(i), Y(d[k]))); ctx.stroke(); });
    }
    const wc = $('#b-weight');
    if (wc) drawWeightChart(wc, S.weights, new Date(y, m, 1).getTime(), new Date(y, m + 1, 1).getTime());
  }

  function actFromSession(sess) {
    return { id: sess.id, sport: 'bike', sub: 'indoor', source: 'kickr', name: sess.name, startTime: sess.startTime, summary: Object.assign({}, sess.summary, { tssSource: 'power' }), test: sess.test || null, cat: sess.cat, planSessionId: sess.planSessionId, completed: sess.completed };
  }
  async function finishSession(run, cleanup) {
    const snap = Object.assign(run.snapshot(), { planSessionId: run.planSessionId });
    cleanup();
    await Store.kvDel('inprogress').catch(() => {});
    if (snap.samples.length < 60) { toast('Séance de moins d’une minute : rien n’a été enregistré'); render(); return; }
    const sess = buildSession(snap, run.completed);
    const a = actFromSession(sess);
    try { await saveActivity(a, sess); } catch (e) { toast('Impossible d’enregistrer : ' + e.message, true); }
    if (sess.planSessionId) markPlanDone(sess.planSessionId, a.id); else autoLinkPlan(a);
    say('Séance terminée. Bravo !');
    render();
    openActivity(a.id, { fresh: true });
    if (S.settings.autoStrava && Strava.isConnected()) uploadStrava(a, sess);
  }
  async function uploadStrava(a, detail, btn) {
    const set = t => { const b = btn || document.getElementById('s-strava'); if (b) b.textContent = t; };
    try {
      set('Envoi…'); if (btn) btn.disabled = true;
      const sm = detail.summary;
      if (a.sport === 'run') {
        const descR = `Course sur tapis ${APP} : ${fmtKm(sm.distance, 'run')} à ${SP.fmtPace(sm.duration / ((sm.distance || 1) / 1000))}/km${sm.avgHr ? ', FC moy. ' + sm.avgHr : ''}.`;
        const rr = await Strava.upload(FIT.buildFit(detail, sm), { name: a.name, description: descR, externalId: 'd6tri-' + a.id, sportType: 'Run' }, set);
        if (rr.activityId) { a.stravaId = rr.activityId; upsertAct(a); set('Voir sur Strava'); toast(rr.duplicate ? 'Déjà présente sur Strava' : 'Envoyée sur Strava'); }
        else { set('Envoyer vers Strava'); toast('Strava traite encore le fichier : vérifie dans quelques minutes'); }
        if (btn) btn.disabled = false;
        return;
      }
      const so = sm.sources;
      const desc = `Séance ${APP} : NP ${r0(sm.np)} W, IF ${fx(sm.IF, 2)}, charge ${r0(sm.tss)}${a.test ? ', FTP mesurée ' + a.test.ftp + ' W' : ''}.` + (so && so.n ? ` Puissance ${detail.powerRef === 'pedals' ? 'des pédales Assioma' : 'du KICKR'} (KICKR ${r0(so.kickr)} W, pédales ${r0(so.pedals)} W${so.bal ? ', G/D ' + r0(so.bal) + '/' + r0(100 - so.bal) : ''}).` : '');
      const r = await Strava.upload(FIT.buildFit(detail, sm), { name: a.name, description: desc, externalId: 'd6tri-' + a.id, sportType: S.settings.sportType }, set);
      if (r.activityId) { a.stravaId = r.activityId; upsertAct(a); set('Voir sur Strava'); toast(r.duplicate ? 'Déjà présente sur Strava' : 'Envoyée sur Strava'); }
      else { set('Envoyer vers Strava'); toast('Strava traite encore le fichier : vérifie dans quelques minutes'); }
    } catch (e) { set('Envoyer vers Strava'); toast(e.message, true); }
    if (btn) btn.disabled = false;
  }
