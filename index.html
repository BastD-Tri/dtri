:root {
  --bg: #0D1B2E; --surface: #142640; --surface2: #1B3152; --line: #27426B;
  --text: #EEF3FA; --muted: #8FA6C4; --faint: #5F7799;
  --accent: #FFCB2F;
  --swim: #2fc4d9; --bike: #f2a93b; --run: #e85d75; --str: #a98bf0; --accent-ink: #10213A; --danger: #FF5F5F; --ok: #3FD08A;
  --z1: #7f8ea3; --z2: #3d9cf0; --z3: #34c77b; --z4: #f2c230; --z5: #f5862e; --z6: #ef4a4a; --z7: #b05cf0;
  --r-lg: 18px; --r: 12px; --r-sm: 8px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --ui: system-ui, -apple-system, 'Roboto', 'Segoe UI', sans-serif;
  --display: 'WCDisplay', var(--ui);
  --chrono: 'Chrono', 'WCDisplay', var(--ui);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--ui); }
body { overscroll-behavior-y: contain; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 26px; line-height: 1.15; }
h2 { font-size: 19px; line-height: 1.25; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- structure ---------- */
#app { min-height: 100%; padding: calc(var(--safe-t) + 8px) 16px calc(84px + var(--safe-b)); max-width: 720px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 0 14px; }
.topbar h1 { flex: 1; }
.devpill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(63,208,138,.18); }
.dot.wait { background: var(--accent); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around; background: rgba(13,27,46,.96); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + var(--safe-b)); backdrop-filter: blur(8px); }
nav.tabs button { flex: 1; background: none; border: 0; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; padding: 4px 0; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.active { color: var(--accent); }

section.block { margin: 0 0 22px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; gap: 10px; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; }
.card + .card { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); border-radius: var(--r); padding: 11px 16px; font-weight: 600; min-height: 46px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: rgba(255,95,95,.4); background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.btn svg { width: 18px; height: 18px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 13px; font-size: 14px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

/* ---------- formulaires ---------- */
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
input[type=text], input[type=number], input[type=password], input[type=date], input[type=url], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 12px; color: var(--text); min-height: 44px;
}
textarea { min-height: 110px; font-family: ui-monospace, 'Roboto Mono', monospace; font-size: 13.5px; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }

.switch input::after { content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%; top: 3px; left: 3px; background: var(--text); transition: transform .15s; }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(18px); }
input[type=range] { width: 100%; accent-color: var(--accent); }

/* ---------- séances ---------- */
.wk { display: flex; gap: 12px; align-items: stretch; padding: 12px; background: var(--surface); border-radius: var(--r); border: 0; width: 100%; text-align: left; }

.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface2); color: var(--muted); }
.profile-svg { display: block; width: 100%; }
.statline { display: flex; gap: 18px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }

.steps { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.steps li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(39,66,107,.5); }
.steps li .bar { width: 4px; border-radius: 2px; flex: none; }
.steps .rep { color: var(--accent); font-weight: 700; font-size: 13px; padding: 8px 0 2px; border: 0; }
.steps .indent { padding-left: 14px; }

/* ---------- accueil ---------- */
.today { padding: 0; overflow: hidden; }
.today .prof-wrap { background: linear-gradient(180deg, var(--surface2), var(--surface)); padding: 18px 16px 0; }
.today .body { padding: 14px 16px 16px; }
.device { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.device:last-of-type { border-bottom: 0; }
.device .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--surface2); display: grid; place-items: center; flex: none; }
.device .ico svg { width: 22px; height: 22px; color: var(--muted); }
.device .live { font-family: var(--display); font-variant-numeric: tabular-nums; }
.form-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.notice { border-left: 3px solid var(--accent); background: var(--surface); padding: 12px 14px; border-radius: 0 var(--r) var(--r) 0; font-size: 14px; }
.notice.err { border-color: var(--danger); }

/* ---------- plan ---------- */
.week { background: var(--surface); border-radius: var(--r-lg); margin-bottom: 10px; overflow: hidden; }
.week > summary { list-style: none; padding: 14px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; }

.phase-bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
.week .sess { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.week .sess .d { width: 46px; flex: none; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.2; }
.week .sess .d b { display: block; font-family: var(--display); font-size: 18px; color: var(--text); }
.sess.is-today { background: rgba(255,203,47,.08); }
.sess.is-done .name { text-decoration: line-through; text-decoration-color: var(--ok); color: var(--muted); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.check.on { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.progress { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daypick button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 10px; padding: 9px 0; font-size: 13px; }
.daypick button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

/* ---------- historique ---------- */
.hist-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }

canvas.chart { width: 100%; display: block; }
table.laps { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* ---------- feuille modale ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5,12,22,.6); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 18px calc(18px + var(--safe-b)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-width: 720px; margin: 0 auto; }

.sheet-x { position: sticky; top: 0; float: right; margin: -6px -6px 0 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface2); color: var(--muted); display: grid; place-items: center; z-index: 2; }

.toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; z-index: 60; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }

/* ---------- lecteur de séance ---------- */
#player { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding: calc(var(--safe-t) + 8px) 14px calc(10px + var(--safe-b)); }
#player .p-head { display: flex; align-items: center; gap: 10px; }
#player .p-head .title { flex: 1; min-width: 0; font-weight: 650; }

.p-main { flex: 1; display: grid; grid-template-rows: auto 1fr auto minmax(100px, 28vh); gap: 10px; min-height: 0; padding-top: 8px; }

.p-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

.durchips { margin-top: 2px; }
/* ---------- pédales de puissance : deux sources dans le lecteur ---------- */
.p-srctag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }

.p-src { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; text-align: left; }
.p-src .src { background: var(--surface); border-radius: var(--r); padding: 8px 10px 9px; border: 1.5px solid transparent; }
.p-src .src.ref { border-color: var(--c); }

.p-src .vals small { font-size: 11.5px; color: var(--muted); margin-right: 8px; }
.p-src .ft { font-size: 11.5px; color: var(--muted); min-height: 16px; }
.p-src .lr { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.p-src .lr .bar { height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden; position: relative; }
.p-src .lr .bar span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); border-right: 2px solid var(--bg); transition: width .4s; }
.p-src .lr .bar::after { content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, #4dd0c8 0 3px, transparent 3px 5px); }
table.srccmp td:first-child { color: var(--muted); }
/* ---------- forme du jour ---------- */

.forme .fv-in { font-family: var(--chrono); font-style: italic; font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; color: var(--text); background: transparent; border: 0; border-bottom: 1.5px dashed rgba(238, 243, 250, .35); border-radius: 0; padding: 0 2px; margin: 0; text-align: center; min-width: 2.6ch; max-width: 6ch; min-height: 0; height: auto; line-height: 1.15; }
.forme .fv-in:focus { outline: none; border-bottom-color: var(--accent, #ffcb2f); background: rgba(255, 203, 47, .08); }
.forme .fv span { display: block; font-size: 12px; color: var(--muted); }
.startcover .forme { text-align: left; }
#player.tread .startcover { background: rgba(13,27,46,.97); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
/* ---------- séances libres ---------- */

.f-seg { flex: none; }
.f-presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: none; }

.f-controls { display: grid; grid-template-columns: 1.5fr 1fr 1.2fr; gap: 8px; margin-top: 10px; }

.f-count { position: absolute; inset: 0; z-index: 5; display: grid; place-content: center; text-align: center; background: rgba(13,27,46,.92); gap: 10px; }

/* ---------- tapis de course ---------- */
#player.tread .p-power .big { font-size: clamp(84px, 30vw, 170px); }

table.srccmp .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.p-chart { min-height: 90px; position: relative; }

.p-elapsed { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

@media (orientation: landscape) and (max-height: 520px) {
  .p-main { grid-template-columns: 1.05fr 1fr; grid-template-rows: auto auto 1fr; }
  .p-power .big { font-size: clamp(80px, 22vh, 150px); }
  .p-interval { grid-column: 1; grid-row: 1; }
  .p-power { grid-column: 2; grid-row: 1 / span 2; align-self: center; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- D Tri Training : composants multisport ---------- */
.avatar { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: grid; place-items: center; font-family: var(--display); font-weight: 700; flex: none; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.quick button { background: var(--surface); border: 0; border-radius: var(--r); padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; line-height: 1.2; color: var(--muted); text-align: center; }

.wbar { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13.5px; }
.wbar .lab { color: var(--muted); }
.wbar .track { position: relative; height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.wbar .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.wbar .track .plan { background: var(--line); }
.wbar .val { font-size: 12.5px; color: var(--muted); min-width: 74px; text-align: right; }

<noscript><p style="padding:24px">D Tri Training a besoin de JavaScript.</p></noscript>
<script>
/* D Tri Training — moteur de séances : syntaxe, bibliothèque, générateur, métriques */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- utilitaires
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function parseDuration(txt) {
    const s = String(txt).trim().toLowerCase().replace(/\s+/g, '');
    if (!s) throw new Error('durée vide');
    let m = s.match(/^(\d+):(\d{1,2})$/); // 1:30 = 1 min 30 s
    if (m) return +m[1] * 60 + +m[2];
    m = s.match(/^(?:(\d+(?:\.\d+)?)h)?(?:(\d+(?:\.\d+)?)(?:m|min|mn|'))?(?:(\d+(?:\.\d+)?)(?:s|sec|"))?$/);
    if (!m || (!m[1] && !m[2] && !m[3])) {
      if (/^\d+$/.test(s)) return +s * 60; // nombre seul = minutes
      throw new Error('durée invalide : « ' + txt + ' »');
    }
    return Math.round((+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0)));
  }

  function fmtDur(sec, long) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (long) {
      if (h) return h + 'h' + String(m).padStart(2, '0');
      if (m && s) return m + "'" + String(s).padStart(2, '0');
      if (m) return m + "'";
      return s + '"';
    }
    if (h) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    return m + ':' + String(s).padStart(2, '0');
  }

  function durToDSL(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + 'h' : '') + (m ? m + 'm' : '') + (s ? s + 's' : '') || '0s';
  }

  // ---------------------------------------------------------------- syntaxe
  // Exemples :  10m@50-70 "Échauffement", 4x(8m@95, 4m@55), 30s@150 free, 5m@85 c60, 3m@250w
  // Noeuds : {t:'s', d, p, p2?, w?, w2?, c?, free?, l?}  |  {t:'r', n, k:[...]}
  function parseWorkout(text) {
    const src = String(text || '');
    let i = 0;
    function err(msg) { throw new Error(msg + ' (position ' + i + ')'); }
    function skipSep() {
      while (i < src.length && /[\s,;+\n]/.test(src[i])) i++;
    }
    function parseSeq(closing) {
      const out = [];
      for (;;) {
        skipSep();
        if (i >= src.length) { if (closing) err('parenthèse fermante manquante'); return out; }
        if (src[i] === ')') { if (!closing) err('parenthèse fermante en trop'); i++; return out; }
        out.push(parseItem());
      }
    }
    function parseItem() {
      const rest = src.slice(i);
      const rm = rest.match(/^(\d+)\s*[x×*]\s*\(/i);
      if (rm) {
        i += rm[0].length;
        const n = +rm[1];
        const k = parseSeq(true);
        if (!k.length) err('répétition vide');
        if (n < 1 || n > 100) err('nombre de répétitions invalide');
        return { t: 'r', n, k };
      }
      // lire jusqu'au séparateur (en respectant les guillemets)
      let j = i, inQ = false;
      while (j < src.length) {
        const ch = src[j];
        if (ch === '"') inQ = !inQ;
        else if (!inQ && /[,;\n)+]/.test(ch)) break;
        j++;
      }
      const tok = src.slice(i, j);
      i = j;
      return parseStep(tok);
    }
    const tree = parseSeq(false);
    if (!tree.length) throw new Error('séance vide');
    return tree;
  }

  function parseStep(tok) {
    let label;
    let t = tok.replace(/"([^"]*)"/, (_, l) => { label = l.trim(); return ' '; }).trim();
    const at = t.indexOf('@');
    if (at < 0) throw new Error('étape sans « @ » : « ' + tok.trim() + ' »');
    const d = parseDuration(t.slice(0, at));
    if (d <= 0 || d > 6 * 3600) throw new Error('durée hors limites : « ' + tok.trim() + ' »');
    const parts = t.slice(at + 1).trim().split(/\s+/).filter(Boolean);
    const step = { t: 's', d };
    let powerSet = false;
    for (const raw of parts) {
      const p = raw.toLowerCase();
      let m;
      if (p === 'free' || p === 'libre') { step.free = true; continue; }
      if ((m = p.match(/^(?:c|cad)(\d{2,3})$/)) || (m = p.match(/^(\d{2,3})rpm$/))) { step.c = +m[1]; continue; }
      if (!powerSet && (m = p.match(/^(\d+(?:\.\d+)?)(?:-(\d+(?:\.\d+)?))?(%|w)?$/))) {
        if (m[3] === 'w') {
          step.w = +m[1]; if (m[2]) step.w2 = +m[2];
        } else {
          step.p = +m[1] / 100; if (m[2]) step.p2 = +m[2] / 100;
        }
        powerSet = true; continue;
      }
      throw new Error('élément inconnu « ' + raw + ' » dans « ' + tok.trim() + ' »');
    }
    if (!powerSet) {
      if (step.free) step.p = 0.6; else throw new Error('puissance manquante : « ' + tok.trim() + ' »');
    }
    if (step.p !== undefined && (step.p < 0 || step.p > 3.5)) throw new Error('puissance hors limites : « ' + tok.trim() + ' »');
    if (step.p2 !== undefined && (step.p2 < 0 || step.p2 > 3.5)) throw new Error('puissance hors limites : « ' + tok.trim() + ' »');
    if (label) step.l = label;
    return step;
  }

  function toDSL(tree) {
    return tree.map(n => {
      if (n.t === 'r') return n.n + 'x(' + toDSL(n.k) + ')';
      let pw;
      if (n.w !== undefined) pw = n.w + (n.w2 !== undefined ? '-' + n.w2 : '') + 'w';
      else pw = Math.round(n.p * 100) + (n.p2 !== undefined ? '-' + Math.round(n.p2 * 100) : '');
      return durToDSL(n.d) + '@' + pw + (n.c ? ' c' + n.c : '') + (n.free ? ' free' : '') + (n.l ? ' "' + n.l + '"' : '');
    }).join(', ');
  }

  // aplatit l'arbre en étapes successives (fractions de FTP)
  function flatten(tree, ftp) {
    const out = [];
    let t0 = 0;
    (function walk(nodes, rep) {
      for (const n of nodes) {
        if (n.t === 'r') {
          for (let r = 0; r < n.n; r++) walk(n.k, { i: r + 1, n: n.n });
        } else {
          const s = { d: n.d, start: t0 };
          if (n.w !== undefined) {
            const f = ftp || 250;
            s.p = n.w / f; if (n.w2 !== undefined) s.p2 = n.w2 / f;
          } else { s.p = n.p; if (n.p2 !== undefined) s.p2 = n.p2; }
          if (n.c) s.c = n.c;
          if (n.free) s.free = true;
          s.l = n.l || '';
          if (rep && rep.n > 1) s.rep = rep;
          out.push(s);
          t0 += n.d;
        }
      }
    })(tree, null);
    return out;
  }

  function stepPowerAt(step, sInStep) {
    if (step.p2 === undefined) return step.p;
    const f = clamp(sInStep / step.d, 0, 1);
    return step.p + (step.p2 - step.p) * f;
  }

  function totalDuration(tree) {
    let t = 0;
    (function walk(nodes, mult) {
      for (const n of nodes) {
        if (n.t === 'r') walk(n.k, mult * n.n); else t += n.d * mult;
      }
    })(tree, 1);
    return t;
  }

  function zoneOf(frac) {
    for (const z of ZONES) if (frac <= z.max + 1e-9) return z;
    return ZONES[6];
  }

  // NP à partir d'une série 1 Hz (watts)
  function normalizedPower(series) {
    const n = series.length;
    if (!n) return 0;
    if (n < 30) return series.reduce((a, b) => a + b, 0) / n;
    let sum = 0, acc4 = 0, cnt = 0;
    for (let i = 0; i < n; i++) {
      sum += series[i];
      if (i >= 30) sum -= series[i - 30];
      if (i >= 29) { const a = sum / 30; acc4 += a * a * a * a; cnt++; }
    }
    return Math.pow(acc4 / cnt, 0.25);
  }

  function seriesFromFlat(flat, ftp) {
    const out = [];
    for (const s of flat) for (let k = 0; k < s.d; k++) out.push(stepPowerAt(s, k + 0.5) * ftp);
    return out;
  }

  function workoutStats(tree, ftp) {
    ftp = ftp || 250;
    const flat = flatten(tree, ftp);
    const series = seriesFromFlat(flat, ftp);
    const T = series.length;
    const np = normalizedPower(series);
    const IF = np / ftp;
    const tss = (T * np * IF) / (ftp * 3600) * 100;
    const kj = series.reduce((a, b) => a + b, 0) / 1000;
    const zt = new Array(7).fill(0);
    series.forEach(w => { zt[zoneOf(w / ftp).z - 1]++; });
    let maxP = 0; flat.forEach(s => { maxP = Math.max(maxP, s.p, s.p2 || 0); });
    return { duration: T, np, IF, tss, kj, zoneTime: zt, maxFrac: maxP, steps: flat.length };
  }

  // et on raccourcit les longs intervalles pour les niveaux plus faibles.
  function scaleForLevel(tree, wLevel, userLevel) {
    const diff = (userLevel || 3) - (wLevel || 3);
    if (!diff) return JSON.parse(JSON.stringify(tree));
    const f = clamp(1 + 0.15 * diff, 0.55, 1.35);
    function walk(nodes, inRep) {
      return nodes.map(n => {
        if (n.t === 'r') {
          const nn = n.n >= 2 ? Math.max(f < 1 ? 2 : n.n, Math.round(n.n * f)) : n.n;
          return { t: 'r', n: Math.min(nn, n.n >= 8 ? 30 : 12), k: walk(n.k, true) };
        }
        const c = Object.assign({}, n);
        if (inRep && f < 1 && n.d >= 360 && (n.p || 0) >= 0.8) {
          c.d = Math.max(240, Math.round((n.d * Math.max(0.7, f)) / 60) * 60);
        }
        return c;
      });
    }
    return walk(tree, false);
  }

  // ------------------------------------------------------------------ export intervals.icu (→ Garmin Connect → montre)
  function expandNested(tree) {
    // intervals.icu n'accepte pas les répétitions imbriquées : on déplie les niveaux internes
    // (on déplie le niveau externe pour garder les séries internes lisibles)
    const inner = nodes => nodes.flatMap(n => n.t === 'r' ? Array.from({ length: n.n }, () => inner(n.k)).flat() : [n]);
    const out = [];
    tree.forEach(n => {
      if (n.t === 'r' && n.k.some(c => c.t === 'r')) {
        for (let r = 0; r < n.n; r++) n.k.forEach(c => out.push(c.t === 'r' ? { t: 'r', n: c.n, k: inner(c.k) } : c));
      } else out.push(n.t === 'r' ? { t: 'r', n: n.n, k: inner(n.k) } : n);
    });
    return out;
  }
  const cue = l => (l || '').replace(/\d+([.,]\d+)?\s*(km|mtr|min|m|s|h|x|×)?\b/gi, '').replace(/[-:@%]/g, ' ').replace(/\s+/g, ' ').trim();
  function icuAmount(s, sport) {
    if (s.dist !== undefined) return sport === 'swim' ? s.dist + 'mtr' : (Math.round(s.dist / 10) / 100) + 'km';
    const m = Math.floor(s.d / 60), x = s.d % 60;
    return (m ? m + 'm' : '') + (x ? x + 's' : '') || '1s';
  }
  function icuTarget(s, sport, prof, mode) {
    if (sport === 'run') {
      const z = s.k === 'hr' ? s.z : (RUN_T[s.k] || RUN_T.E).hr;
      if (mode === 'hr' || s.k === 'hr' || s.k === 'open' || s.k === 'marche') return 'Z' + z + ' HR';
      const r = paceRange(s, sport, prof);
      return fmtPace(r[1]) + '-' + fmtPace(r[0]) + '/km Pace';
    }
    const css = prof.css || 120;
    const r = paceRange(s, sport, prof);
    const pct = v => Math.round(css / v * 100);
    return pct(r[1]) + '-' + pct(r[0]) + '% Pace';
  }
  function toIntervals(tree, sport, prof, mode) {
    const lines = [];
    const stepLine = s => {
      const c = cue(s.l);
      lines.push('- ' + (c ? c + ' ' : '') + icuAmount(s, sport) + ' ' + icuTarget(s, sport, prof, mode));
      if (s.rest) lines.push('- ' + s.rest + 's');
    };
    expandNested(tree).forEach(n => {
      if (n.t === 'r') { lines.push('', n.n + 'x'); n.k.forEach(stepLine); lines.push(''); }
      else stepLine(n);
    });
    return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  function bikeToIntervals(tree) {
    const lines = [];
    const inner = nodes => nodes.flatMap(n => n.t === 'r' ? Array.from({ length: n.n }, () => inner(n.k)).flat() : [n]);
    const dur = d => { const m = Math.floor(d / 60), x = d % 60; return (m ? m + 'm' : '') + (x ? x + 's' : ''); };
    const line = s => {
      const c = cue(s.l);
      const tg = s.free ? 'freeride' : s.w !== undefined ? s.w + 'w' : s.p2 !== undefined ? 'ramp ' + Math.round(s.p * 100) + '-' + Math.round(s.p2 * 100) + '%' : Math.round(s.p * 100) + '%';
      lines.push('- ' + (c ? c + ' ' : '') + dur(s.d) + ' ' + tg + (s.c ? ' ' + s.c + 'rpm' : ''));
    };
    tree.forEach(n => {
      if (n.t === 'r') { lines.push('', n.n + 'x'); inner(n.k).forEach(line); lines.push(''); } else line(n);
    });
    return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // ------------------------------------------------------------------ fichier FIT de séance (copie USB dans GARMIN/NewFiles)
  function buildWorkoutFit(tree, sport, prof, name, mode) {
    const w = new FIT.FitWriter();
    const now = Math.round(Date.now() / 1000) - FIT.FIT_EPOCH;
    w.define(0, 0, [[0, 'enum'], [1, 'uint16'], [2, 'uint16'], [3, 'uint32z'], [4, 'uint32']]);
    w.write(0, [5, 255, 1, (Date.now() % 4000000000) || 1, now]);
    // étapes (répétitions imbriquées dépliées)
    const steps = [];
    const flatStep = s => {
      const r = paceRange(s, sport, prof);
      let ttype = 2, tval = 0, lo = 0, hi = 0;
      const z = sport === 'run' ? (s.k === 'hr' ? s.z : (RUN_T[s.k] || RUN_T.E).hr) : 0;
      if (sport === 'run' && (mode === 'hr' || s.k === 'hr')) { ttype = 1; tval = z; }
      else if (sport === 'run' && s.k !== 'open' && s.k !== 'marche') { ttype = 0; lo = Math.round(1000000 / r[1]); hi = Math.round(1000000 / r[0]); } // m/s × 1000
      const easy = s.k === 'trot' || s.k === 'marche' || s.k === 'souple' || (s.k === 'kmh' && ['trot', 'marche'].includes(kmhZone(s, prof)));
      const intensity = /échauff/i.test(s.l || '') ? 2 : /calme/i.test(s.l || '') ? 3 : easy ? 4 : 0;
      steps.push({ name: (s.k === 'kmh' && !s.l ? fmtKmh(s.v) + ' km/h' : stepName(s, sport)).slice(0, 15), dtype: s.dist !== undefined ? 1 : 0, dval: s.dist !== undefined ? s.dist * 100 : s.d * 1000, ttype, tval, lo, hi, intensity });
      if (s.rest) steps.push({ name: 'Repos', dtype: 0, dval: s.rest * 1000, ttype: 2, tval: 0, lo: 0, hi: 0, intensity: 1 });
    };
    expandNested(tree).forEach(n => {
      if (n.t === 'r') {
        const from = steps.length;
        n.k.forEach(flatStep);
        steps.push({ name: '', dtype: 6, dval: from, ttype: 2, tval: n.n, lo: 0, hi: 0, intensity: 0, repeat: true });
      } else flatStep(n);
    });
    const swim = sport === 'swim';
    w.define(1, 26, [[4, 'enum'], [6, 'uint16'], [8, 'string', 24], [11, 'enum'], [14, 'uint16'], [15, 'enum']]);
    w.write(1, [swim ? 5 : 1, steps.length, name || 'D Tri', swim ? 17 : 0, swim ? (prof.pool || 25) * 100 : null, swim ? 0 : null]);
    w.define(2, 27, [[254, 'uint16'], [0, 'string', 16], [1, 'enum'], [2, 'uint32'], [3, 'enum'], [4, 'uint32'], [5, 'uint32'], [6, 'uint32'], [7, 'enum']]);
    steps.forEach((s, i) => w.write(2, [i, s.name, s.dtype, s.dval, s.ttype, s.repeat ? s.tval : (s.ttype === 1 ? s.tval : 0), s.ttype === 0 ? s.lo : null, s.ttype === 0 ? s.hi : null, s.intensity]));
    return w.finish();
  }

  // texte lisible (fiche piscine pour FORM, copie TrainingPeaks)
  function toText(tree, sport, prof) {
    const out = [];
    const walk = (nodes, ind) => nodes.forEach(n => {
      if (n.t === 'r') { out.push(ind + n.n + ' ×'); walk(n.k, ind + '   '); return; }
      const r = paceRange(n, sport, prof);
      const amount = n.dist !== undefined ? (n.dist >= 1000 && sport === 'run' ? (n.dist / 1000) + ' km' : n.dist + ' m') : W.fmtDur(n.d, true);
      const tgt = sport === 'run'
        ? (n.k === 'hr' ? 'zone ' + n.z + ' FC (' + hrRange(n.z, prof).join('–') + ' bpm)' : n.k === 'kmh' ? fmtKmh(n.v) + ' km/h (' + fmtPace(3600 / n.v) + ' /km)' : n.k === 'open' ? 'libre' : n.k === 'marche' ? 'marche' : fmtPace(r[0]) + '–' + fmtPace(r[1]) + ' /km')
        : (n.k === 'pace' ? 'allure' : (SWIM_T[n.k] || SWIM_T.end).name.toLowerCase()) + ' ' + fmtPace(r[0]) + '–' + fmtPace(r[1]) + ' /100 m';
      out.push(ind + amount + ' ' + (n.l ? n.l + ', ' : '') + tgt + (n.rest ? ', repos ' + n.rest + ' s' : ''));
    });
    walk(tree, '');
    return out.join('\n');
  }

    ]
  };
  function treadProgram(fam, i) {
    const F = TREAD_FAMS[fam], steps = TREAD_PROG[fam][i - 1].split(' ').map(x => x.split('/').map(Number));
    const dsl = steps.map(([m, v]) => m + 'min@' + v + 'kmh').join(', ');
    const tree = parseWorkout(dsl, 'run');
    const vmax = Math.max(...steps.map(x => x[1])), mins = steps.reduce((a, x) => a + x[0], 0);
    return { id: 'tm_' + fam + i, name: F.name + ' ' + i, cat: 'tapis', fam, num: i, level: F.levels[i - 1], vmax, minutes: mins,
      desc: 'Programme ' + F.name + ' ' + i + ' du tapis : ' + F.desc.charAt(0).toLowerCase() + F.desc.slice(1) + ' Vitesse max ' + fmtKmh(vmax) + ' km/h. Profil relevé sur le graphique du manuel.',
      dsl, sport: 'run', tree, source: 'lib' };
  }
  const TREAD_LIB = Object.keys(TREAD_FAMS).flatMap(f => TREAD_PROG[f].map((_, i) => treadProgram(f, i + 1)));
  const RUN_LIB = mkLib(RUN_RAW, 'run').concat(TREAD_LIB);
  const SWIM_LIB = mkLib(SWIM_RAW, 'swim');

  // ------------------------------------------------------------------ générateurs
  const S = (amt, k, extra) => Object.assign({ t: 's' }, amt, { k }, extra || {});
  const R = (n, k) => ({ t: 'r', n, k });
  const min = m => ({ d: Math.round(m * 60) });
  const sec = s => ({ d: Math.round(s) });
  const met = m => ({ dist: Math.round(m) });

  function generateRun(opts) {
    const o = Object.assign({ focus: 'auto', minutes: 45, level: 3, seed: Date.now() }, opts || {});
    const rng = mulberry32(o.seed);
    let focus = o.focus === 'auto' ? pick(rng, ['easy', 'tempo', 'vma', 'cotes', 'easy', 'long']) : o.focus;
    if (focus === 'trail') focus = pick(rng, ['trail_cotes', 'trail_fartlek', 'trail_descente', 'trail_power', 'trail_escaliers']);
    if (/^trail_/.test(focus)) return generateTrail(focus, o, rng);
    const L = o.level;
    const total = o.minutes * 60;
    let nodes = [], title = '';
    const wu = [S(min(total >= 2700 ? 15 : 10), 'E', { l: 'Échauffement' })];
    if (focus !== 'easy' && focus !== 'long' && focus !== 'brick') wu.push(R(4, [S(sec(20), 'R', { l: 'Accélération' }), S(sec(40), 'trot')]));
    const cd = [S(min(total >= 2700 ? 10 : 5), 'E', { l: 'Retour au calme' })];
    const base = m => wu.concat(m, cd);
    const avail = () => total - wu.reduce((a, s) => a + (s.t === 'r' ? s.n * 60 : s.d), 0) - cd[0].d;
    switch (focus) {
      case 'easy': {
        if (L >= 2 && rng() < 0.6) { nodes = [S(min(o.minutes - 7), 'E'), R(6, [S(sec(20), 'R', { l: 'Ligne droite' }), S(sec(50), 'trot')])]; title = 'Footing ' + o.minutes + '\' + lignes droites'; }
        else if (rng() < 0.3) { nodes = [S(min(8), 'hr', { z: 1 }), S(min(o.minutes - 13), 'hr', { z: 2 }), S(min(5), 'hr', { z: 1 })]; title = 'Footing ' + o.minutes + '\' au cardio'; }
        else { nodes = [S(min(o.minutes), 'E')]; title = 'Footing ' + o.minutes + '\''; }
        return pack(nodes, title, 'easy', o);
      }
      case 'long': {
        const m = o.minutes;
        if (L >= 3 && rng() < 0.5) { const b = Math.round(m * 0.3 / 5) * 5; nodes = [S(min(m - b - 10), 'E'), S(min(b), 'M', { l: 'Allure marathon' }), S(min(10), 'E')]; title = 'Sortie longue ' + W.fmtDur(m * 60, true) + ' progressive'; }
        else { nodes = [S(min(m), 'E')]; title = 'Sortie longue ' + W.fmtDur(m * 60, true); }
        return pack(nodes, title, 'long', o);
      }
      case 'brick': {
        const m = o.minutes;
        nodes = m >= 25 && L >= 3 ? [S(min(8), 'M', { l: 'Sortie de vélo' }), R(Math.max(2, Math.floor((m - 10) / 6)), [S(min(5), 'T'), S(min(1), 'trot')]), S(min(2), 'E')] : [S(min(5), 'M', { l: 'Sortie de vélo' }), S(min(Math.max(5, m - 5)), 'E')];
        return pack(nodes, 'Enchaînement ' + m + '\'', 'brick', o);
      }
      case 'tempo': {
        const v = pick(rng, ['T', 'T', 'cruise', 'M']);
        const a = avail();
        if (v === 'cruise') {
          const n = clamp(Math.floor(a / (1000 / 1 * (300 / 1000) + 90)), 3, 8);
          nodes = [R(n, [S(met(1000), 'T'), S(sec(60), 'trot')])]; title = 'Seuil ' + n + '×1000 m';
        } else if (v === 'M') {
          const d = pick(rng, [10, 15, 20]); const n = clamp(Math.floor(a / ((d + 3) * 60)), 2, 4);
          nodes = [R(n, [S(min(d), 'M'), S(min(3), 'E')])]; title = 'Allure marathon ' + n + '×' + d + '\'';
        } else {
          const d = pick(rng, [5, 6, 8, 10, 12, 15]); const rec = d >= 10 ? 3 : d >= 8 ? 2 : 1;
          const n = clamp(Math.floor(a / ((d + rec) * 60)), 2, 6 + (L >= 4 ? 1 : 0));
          nodes = [R(n, [S(min(d), 'T'), S(min(rec), 'trot')])]; title = 'Seuil ' + n + '×' + d + '\'';
        }
        break;
      }
      case 'vma': {
        const v = pick(rng, ['dist', 'dist', '3030', 'pyr']);
        const a = avail();
        if (v === '3030') { const n = clamp(Math.floor(a / 660), 1, 3); nodes = [R(n, [R(10, [S(sec(30), 'R'), S(sec(30), 'trot')]), S(min(3), 'trot')])]; title = '30/30 ' + n + '×10'; }
        else if (v === 'pyr') { [1, 2, 3, 2, 1].forEach(m => nodes.push(S(min(m), 'I'), S(min(m), 'trot'))); title = 'Pyramide VMA 1-2-3-2-1'; }
        else {
          const dist = pick(rng, [400, 600, 800, 1000, 1200]);
          const k = dist <= 400 ? 'R' : 'I';
          const T = 300; const rep = dist / 1000 * T / 1.06;
          const rec = Math.round(dist <= 400 ? 90 : dist <= 800 ? 120 : 150);
          const n = clamp(Math.floor(a / (rep + rec)), 4, dist <= 400 ? 12 : 8);
          nodes = [R(n, [S(met(dist), k), S(sec(rec), 'trot')])]; title = n + '×' + dist + ' m';
        }
        break;
      }
      case 'cotes': {
        const d = pick(rng, [30, 45, 60, 90]); const n = clamp(Math.floor(avail() / (d * 3)), 6, 12);
        nodes = [R(n, [S(sec(d), 'I', { l: 'Montée' }), S(sec(d * 2), 'trot', { l: 'Descente' })])]; title = 'Côtes ' + n + '×' + W.fmtDur(d, true);
        break;
      }
      default: nodes = [S(min(o.minutes), 'E')]; title = 'Footing';
    }
    return pack(base(nodes), title, focus, o);
  }

  // trail : au cardio, en terrain vallonné (ou sur tapis incliné)
  function generateTrail(focus, o, rng) {
    const m = o.minutes, L = o.level;
    const wu = S(min(m >= 50 ? 15 : 10), 'hr', { z: 2, l: 'Échauffement' }), cd = S(min(m >= 50 ? 10 : 5), 'hr', { z: 1, l: 'Retour au calme' });
    const avail = Math.max(10, m - (m >= 50 ? 25 : 15));
    let nodes = [], title = '';
    switch (focus) {
      case 'trail_cotes': {
        const d = pick(rng, [3, 4, 5]), n = clamp(Math.floor(avail / (d * 2)), 3, 7 + (L >= 4 ? 1 : 0));
        nodes = [R(n, [S(min(d), 'hr', { z: 4, l: 'Montée' }), S(min(d), 'trot', { l: 'Descente souple' })])]; title = 'Côtes longues ' + n + '×' + d + '\''; break;
      }
      case 'trail_fartlek': {
        const n = clamp(Math.floor(avail / 5), 3, 10);
        nodes = [R(n, [S(min(3), 'hr', { z: 3, l: 'Relance' }), S(min(1), 'hr', { z: 4, l: 'Bosse' }), S(min(1), 'hr', { z: 2 })])]; title = 'Fartlek nature ' + n + '×5\''; break;
      }
      case 'trail_descente': {
        const n = clamp(Math.floor(avail / 6), 3, 8);
        nodes = [R(n, [S(min(4), 'hr', { z: 3, l: 'Montée' }), S(min(2), 'hr', { z: 2, l: 'Descente rapide, petits pas' })])]; title = 'Montées-descentes ' + n + '×6\''; break;
      }
      case 'trail_power': {
        const n = clamp(Math.round(avail / 9), 2, 8);
        nodes = [R(n, [S(min(5), 'marche', { l: 'Marche rapide en côte' }), S(min(4), 'hr', { z: 2, l: 'Course' })])]; title = 'Rando-course ' + n + '×9\''; break;
      }
      case 'trail_escaliers': {
        const n = clamp(Math.floor(avail / 3), 6, 12);
        nodes = [R(n, [S(min(1), 'hr', { z: 4, l: 'Montée d’escaliers' }), S(min(2), 'marche', { l: 'Redescente en marchant' })])]; title = 'Escaliers ' + n + '×1\''; break;
      }
      case 'trail_long': return pack([S(min(m), 'hr', { z: 2, l: 'Endurance en terrain varié, marche dans les côtes raides' })], 'Sortie longue trail ' + W.fmtDur(m * 60, true), 'trail', o);
      default: return pack([S(min(m), 'hr', { z: 2, l: 'Footing nature' })], 'Footing nature ' + m + '\'', 'trail', o);
    }
    return pack([wu].concat(nodes, [cd]), title, 'trail', o);
  }

  function pack(tree, title, cat, o) {
    const sport = o.sport || 'run';
    const prof = { runT: o.runT || 300, css: o.css || 120 };
    tree = JSON.parse(JSON.stringify(tree));
    // niveau débutant : un peu moins de répétitions
    if (o.level <= 1) tree.forEach(n => { if (n.t === 'r' && n.n > 3 && !(n.k[0] && n.k[0].l === 'Accélération')) n.n = Math.max(2, Math.round(n.n * 0.75)); });
    const target = o.minutes * 60;
    const dur = () => stats(tree, sport, prof).duration;
    const isMain = n => n.t === 'r' && !(n.k[0] && (n.k[0].l === 'Accélération' || n.k[0].k === 'educ' && n.n === 4 && tree.indexOf(n) === 1));
    const before = tree.map(n => n.t === 'r' ? n.n : null);
    // trop long : on retire des répétitions, puis on raccourcit l'échauffement
    for (let g = 0; g < 60 && dur() > target * 1.08 + 60; g++) {
      const reps = tree.filter(n => isMain(n) && n.n > 1).sort((a, b) => b.n - a.n);
      if (reps.length) { reps[0].n--; continue; }
      const wu = tree[0];
      if (wu.t === 's' && wu.d && wu.d > 480) { wu.d = Math.max(480, wu.d - 120); continue; }
      const strides = tree.findIndex(n => n.t === 'r' && n.k[0] && n.k[0].l === 'Accélération');
      if (strides >= 0) { tree.splice(strides, 1); continue; }
      const last = tree[tree.length - 1];
      if (last.t === 's' && last.d && last.d > 300) { last.d -= 60; continue; }
      break;
    }
    // trop court : on complète en endurance avant le retour au calme
    const gap = target - dur();
    if (gap > Math.max(180, target * 0.06)) {
      const filler = sport === 'run' ? S(min(Math.round(gap / 60)), 'E', { l: 'Endurance' }) : S(met(Math.max(100, Math.round(gap / ((prof.css + 12) / 100) / 100) * 100)), 'end', { l: 'Endurance' });
      tree.splice(Math.max(1, tree.length - 1), 0, filler);
    }
    // titre : refléter les répétitions retirées
    let cursor = 0;
    tree.forEach((n, i) => {
      if (n.t !== 'r' || before[i] === null || before[i] === n.n) return;
      const pos = title.indexOf(before[i] + '×', cursor);
      if (pos < 0) return;
      title = title.slice(0, pos) + n.n + '×' + title.slice(pos + String(before[i]).length + 1);
      cursor = pos + 1;
    });
    tree = tree.map(n => n.t === 'r' && n.n === 1 ? n.k : [n]).flat();
    return { id: 'gen-' + sport + '-' + o.seed, sport, name: title, cat, level: o.level, desc: 'Séance générée pour ton niveau (' + o.minutes + ' min visées).', tree, dsl: toDSL(tree, sport), source: 'gen', seed: o.seed };
  }

  function generateSwim(opts) {
    const o = Object.assign({ focus: 'auto', minutes: 45, level: 3, seed: Date.now(), css: 120, sport: 'swim' }, opts || {});
    const rng = mulberry32(o.seed);
    const focus = o.focus === 'auto' ? pick(rng, ['tech', 'end', 'css', 'css', 'vite', 'ow']) : o.focus;
    // distance visée : minutes × vitesse moyenne (CSS + 12 s, repos compris)
    const meters = Math.round(o.minutes * 60 / ((o.css + 14) / 100) / 100) * 100;
    const L = o.level;
    const wu = [S(met(meters >= 2000 ? 400 : 300), 'souple', { l: 'Échauffement' }), R(4, [S(met(50), 'educ', { rest: 15, l: pick(rng, ['Rattrapé', 'Poings fermés', 'Battements sur le côté', 'Touche épaule']) })])];
    const cd = [S(met(200), 'souple', { l: 'Retour au calme' })];
    let main = meters - (wu[0].dist + 200 + 200);
    main = Math.max(300, main);
    let nodes = [], title = '';
    switch (focus) {
      case 'tech': {
        const drills = ['Rattrapé', 'Poings fermés', 'Battements planche', 'Respiration 3 temps', 'Godille', 'Touche épaule'];
        const a = pick(rng, drills), b = pick(rng, drills.filter(x => x !== a));
        const n = clamp(Math.round(main / 400), 1, 4);
        nodes = [R(n, [R(2, [S(met(50), 'educ', { rest: 15, l: a })]), R(2, [S(met(50), 'educ', { rest: 15, l: b })]), S(met(200), 'end', { rest: 30 })])];
        title = 'Technique : ' + a.toLowerCase() + ' & ' + b.toLowerCase();
        break;
      }
      case 'end': {
        const d = pick(rng, [200, 300, 400, 500]);
        const n = clamp(Math.round(main / d), 2, 10);
        nodes = [R(n, [S(met(d), 'end', { rest: d >= 400 ? 30 : 20, l: rng() < 0.4 ? 'Pull-buoy un sur deux' : undefined })])];
        title = 'Endurance ' + n + '×' + d + ' m';
        break;
      }
      case 'css': {
        const d = pick(rng, [100, 100, 150, 200, 300]);
        const n = clamp(Math.round(main / d), 3, d <= 100 ? 16 : 8);
        nodes = [R(n, [S(met(d), 'css', { rest: d <= 100 ? 15 : d <= 200 ? 20 : 30 })])];
        title = 'Seuil ' + n + '×' + d + ' m';
        break;
      }
      case 'vite': {
        const n = clamp(Math.round(main / 300), 2, 5);
        nodes = [R(n, [R(4, [S(met(50), 'vite', { rest: 20 })]), S(met(100), 'souple')])];
        title = 'VO2 ' + n + '×4×50 m';
        break;
      }
      default: { // eau libre
        const d = pick(rng, [400, 500, 750]);
        const n = clamp(Math.round(main / d), 1, 4);
        nodes = [R(n, [S(met(d), 'tempo', { rest: 30, l: 'Visées tous les 6 mouvements' })])];
        title = 'Eau libre ' + n + '×' + d + ' m';
      }
    }
    nodes = JSON.parse(JSON.stringify(nodes, (k, v) => v === undefined ? undefined : v));
    const tree = wu.concat(nodes, cd).map(n => n.t === 'r' && n.n === 1 ? n.k : [n]).flat();
    return pack(tree, title, focus, o);
  }

  // ------------------------------------------------------------------ zones et charge
  function runZones(prof) {
    const T = prof.runT || 300;
    return Object.entries(RUN_T).filter(([k]) => k !== 'marche').map(([k, z]) => ({ k, name: z.name, color: z.color, fast: T / z.hi, slow: T / z.lo }));
  }

  // ------------------------------------------------------------------ plan course à pied (route ou trail)

            desc: (x.role === 'long2' ? 'Le lendemain de la sortie longue, sur jambes fatiguées : c’est le « week-end choc » des trails longs. ' : '') + 'Au cardio (zone 2), environ ' + dp + ' m de D+' + (o.dplus && (ph === 'peak' || ph === 'build') ? ' (la course en compte ' + o.dplus + ' : rapproche-toi de son rapport D+/durée)' : '') + '. Marche dans les côtes raides, emporte de quoi boire et manger.' });

  // ------------------------------------------------------------------ manipulation du plan
  function weekFor(plan, date) {
    let w = plan.weeks.find(x => date >= x.start && date < x.start + 7 * 864e5);

      const last = plan.weeks[plan.weeks.length - 1];

  }

    if (f.s.sport === 'stretch') { f.s.link = null; f.s.timing = 'repos'; }

  // ------------------------------------------------------------------ étirements dans le plan

  const STRETCH_MODES = { auto: { name: 'Complet', desc: 'avant la natation et les séances clés de course, après les sorties longues et les séances dures, et les jours de repos' }, light: { name: 'Léger', desc: 'après les sorties longues et les enchaînements, plus une routine détente par semaine' }, off: { name: 'Aucun', desc: 'pas d’étirements dans le plan' } };

  const isHard = s => ['q', 'q2'].includes(s.role) || !!s.test || /seuil|vo2|vma|tempo|css|vite|sst|anaer|sprint|fractionn|ramp|test|cotes|côtes/i.test((s.cat || '') + ' ' + (s.role === 'easy' ? '' : s.name || ''));
  function stretchItem(routineId, date, link, timing, why, key) {

      const mid = s.p2 !== undefined ? (s.p + s.p2) / 2 : s.p;

  function stepsHTML(tree, ftp, intensity) {
    const line = n => {
      const col = W.zoneOf(n.p2 !== undefined ? (n.p + n.p2) / 2 : (n.p !== undefined ? n.p : n.w / ftp)).color;
      const pct = n.w !== undefined ? n.w + ' W' : (n.p2 !== undefined ? `${r0(n.p * 100)} → ${r0(n.p2 * 100)} %` : `${r0(n.p * 100)} %`);
      const watts = n.w !== undefined ? '' : (n.p2 !== undefined ? ` (${r0(n.p * ftp * intensity)}–${r0(n.p2 * ftp * intensity)} W)` : ` (${r0(n.p * ftp * intensity)} W)`);
      return `<li><span class="bar" style="background:${col}"></span><span class="grow">${W.fmtDur(n.d, true)} à ${pct}${watts}${n.c ? ` <span class="muted">${n.c} rpm</span>` : ''}${n.free ? ' <span class="tag">libre</span>' : ''}</span><span class="muted small ellipsis" style="max-width:40%">${esc(n.l || '')}</span></li>`;
    };
    const walk = (nodes, depth) => nodes.map(n => n.t === 'r'
      ? `<li class="rep" style="padding-left:${depth * 14}px">${n.n} ×</li>` + walk(n.k, depth + 1).replace(/<li>/g, `<li style="padding-left:${(depth + 1) * 14}px">`)

    return `<ul class="steps">${walk(tree, 0)}</ul>`;
  }
